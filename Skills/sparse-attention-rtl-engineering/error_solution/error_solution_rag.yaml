- id: SA-QUEST-BFP8-Q64-P64-015
  title: Updating one BFP8 exponent invalidates the unchanged output base
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - partial_metadata_update
    - bounded_alignment_distance
  status: validated
  error_family: verification_harness_and_oracle
  error_type: INVALID_STIMULUS
  subtype: exponent_update_exceeds_alignment_window
  stage: metadata_reuse_partial_update
  tool: Vivado XSim
  failing_layer: testbench_metadata_configuration
  symptom_signatures:
  - >-
    Row serializer or lane protocol error occurs only after the third computation starts following a single
    exponent update.
  - The first two distinct tiles and metadata reuse already passed.
  preconditions:
  - >-
    Output base exponent remains -8 and the tested lane supports the relevant left-alignment window through
    eight bits.
  - The test changes one B exponent from zero to +1 while A exponent remains zero.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Computed the alignment distance before and after the partial update instead of treating every protocol
      flag as a metadata-reuse defect.
    observation_or_result: Delta changed from 0+0-(-8)=8 to 0+1-(-8)=9, outside this configuration's supported
      window.
  - step: 2
    status: observed_action
    action: >-
      Considered raising the output base as part of a coordinated metadata change, then selected a 0-to--1
      B update to keep the intended one-entry-update experiment.
    observation_or_result: The chosen update made delta seven without rewriting any output-base entries.
  - step: 3
    status: observed_action
    action: >-
      Supplied -10'sd1 and its packed 10-bit 3ff expectation, changed column-zero expected output to 15360,
      and kept columns one through seven at 16384.
    observation_or_result: The user log passed partial-update checks with only one metadata entry rewritten.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Updated B[0,0] from zero to +1 while holding the base at -8.
    result: The third compute used delta nine and triggered a protocol error.
  rejected_by_evidence:
  - hypothesis_or_direction: Partial metadata writes are inherently broken or reused compute state is stale.
    evidence: >-
      Two distinct prior tiles passed, and a legal one-entry exponent update produced the independently calculated
      changed column with other columns unchanged.
  root_cause:
  - >-
    The directed stimulus changed one member of a coupled exponent/base configuration without preserving its
    alignment invariant. The exact serializer-versus-lane flag was not separately instrumented in the failing
    run.
  resolution:
    actions:
    - For this one-entry-update test, use B exponent -1 so the unchanged base remains legal.
    - Recalculate the numerical expectation as (8*0.5+56)*256=15360 for column zero.
    - Preserve unchanged-metadata assertions and verify the remaining columns stay at 16384.
  validation:
  - evidence: >-
      ALL QUEST BFP8 PARTIAL METADATA UPDATE TESTS PASSED; column zero was 15360, columns one through seven
      were 16384, and only one metadata entry was rewritten.
    regression_scope: Distinct-tile reuse followed by one legal exponent update and another complete computation.
    limitation: >-
      This test does not prove that the wrapper rejects all illegal exponent/base combinations at configuration
      time; the source explicitly left that validation obligation open.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A maximum group-exponent increase may require updating the output base too; a valid partial-write mechanism
      does not make every partial metadata combination legal.
  reuse_rule:
  - >-
    Apply when the actual alignment equation exceeds the configured lane window after a metadata change. A
    legal delta with wrong data or an explicitly required illegal-input rejection is a different case.
