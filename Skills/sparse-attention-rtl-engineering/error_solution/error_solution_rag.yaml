  error_type: SOURCE_PATH_ERROR
  subtype: incorrect_relative_path_or_repository_root
  stage: compilation_or_route_source_loading
  tool: Vivado xvlog and Tcl read_verilog
  failing_layer: source_resolution
  symptom_signatures:
  - Cannot find file at rtl/sparse/bf16/bf16_pair_lane_mapper_opt.sv although the source is under rtl/sparse.
  - >-
    A copied route script resolves a sibling baseline repository underneath the new repository instead of beside
    it.
  preconditions:
  - The intended source exists, but its location is computed from the wrong path base.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Compared the BF16 compilation path with the known source location and removed the extra bf16 directory
      component.
    observation_or_result: The length-sweep simulation passed all paged tests, including reductions through
      256.
  - step: 2
    status: observed_action
    action: >-
      Inspected the later standalone route script's here and repo variables after read_verilog could not locate
      the baseline exponent module.
    observation_or_result: The sibling baseline was incorrectly joined relative to the bench directory.
  - step: 3
    status: observed_action
    action: >-
      Changed the sibling baseline path from file join $here .. baseline_name to file join $repo .. baseline_name.
    observation_or_result: The subsequent route proceeded beyond source loading, and later contained OOC routes
      were obtained.
  failed_or_insufficient_attempts: []
  rejected_by_evidence: []
  root_cause:
  - >-
    The command and copied script encoded incorrect directory relationships; the source modules themselves
    were present.
  resolution:
    actions:
    - >-
      Resolve each source relative to its actual project or script root and verify the resulting path before
      invoking the tool.
    - >-
      In the standalone route case, resolve the sibling repository from the repository root, not its bench
      subdirectory.
  validation:
  - evidence: >-
      The BF16 path correction was followed by ALL PAGED SPARSE MAC TESTS PASSED over the length sweep; the
      corrected route script advanced through source loading into implementation.
    regression_scope: Source resolution, BF16 length-sweep simulation, and standalone route startup.
    limitation: >-
      A successful path fix does not validate the newly loaded design's timing; the separate physical records
      describe those results.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Check existence before recreating code; a present file at a different path calls for a command repair,
      while an absent generated artifact calls for its prerequisite step.
  reuse_rule:
  - >-
    Apply when source existence is confirmed at a different resolved path. Do not invent or replace RTL to
    satisfy a mistaken file path.
