  - step: 1
    status: observed_action
    action: Compared the passing first case with case 1 failing on row 0 word 0 after introducing per-row ready.
    observation_or_result: score_ready_o was indexed from row_ready_q by a testbench row input changed in the
      same timeslot.
  - step: 2
    status: observed_action
    action: Added
    observation_or_result: The affected code diff changed only the observation phase.
  - step: 3
    status: observed_action
    action: Reran the simulation without reverting per-row readiness.
    observation_or_result: >-
      All five exact cases passed, each checking 16 rows and release within 136 cycles; later extensions added
      eight cases and four-group coverage.
  failed_or_insufficient_attempts: []
  rejected_by_evidence:
  - hypothesis_or_direction: Per-row readiness lost row preparation state between cases.
    evidence: The same RTL passed all five cases after only a
  root_cause:
  - >-
    The testbench read the old combinational-ready value in the same simulation timeslot in which it changed
    the selected row. The failing observation was not evidence that the row-preparation RTL had lost state.
  resolution:
    actions:
    - Allow the newly driven row and word inputs to settle before the exact per-row ready assertion.
    - Preserve the RTL per-row readiness and rerun all numerical and release checks.
  validation:
  - evidence: >-
      After adding a #1 settle before the check, five exact fixed-point cases passed with 16 rows each and
      release within 136 cycles. Later extensions expanded the same suite to eight cases and a four-group 64-row
      test.
    regression_scope: row-group online-softmax unit simulation
  derived_guidance:
  - status: generalized_rule
    rule: Do not add an RTL pipeline or revert to global-ready merely to satisfy a same-timeslot sample.
  - status: generalized_rule
    rule: Do not delete the readiness check.
  - status: generalized_rule
    rule: >-
      Keep the distinction from real done-before-payload bugs; a monitor-phase repair applies only when the
      existing interface is combinational and its expected ready value is otherwise correct.
  reuse_rule:
  - >-
    Reuse when a row-select input and its combinational per-row ready output are driven and sampled in one
    timeslot. Preserve exact readiness checks after fixing the monitor phase.
- id: SA-ATTN-INT8-Q64-001
  title: Banked row state and a registered scheduler close full-attention timing
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - online_softmax_row_state
    - hbm_address_scheduler
    - full_device_325mhz
  status: validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_FAILURE
  subtype: wide_row_state_and_scheduler_control_paths
  stage: full_attention_physical_implementation
  tool: Vitis and Vivado route_design
  failing_layer: rtl_control_and_state_microarchitecture
  symptom_signatures:
  - >-
    Original full-attention build has setup WNS -0.297 ns and 4,170 failing setup endpoints at the 325 MHz
    request.
  - >-
    Critical paths include score-tile BRAM output through score selection/arithmetic and scheduler-driven row-state
    control.
  - Functional board oracle still passes after Vitis auto-scales the kernel to 296.3 MHz.
  preconditions:
  - The seven-shape numerical oracle passes 311,424 context values with zero mismatches.
  - The requested 325 MHz constraint is retained for the repair build.
  - Timing evidence comes from the full packaged implementation, not an isolated unit.
  action_trace:
  - step: 1
    status: observed_action
    action: Read the original full-device routed report and separated it from the board numerical result.
    observation_or_result: >-
      The original image had -0.297 ns WNS and 4170 failing setup endpoints, although seven board workloads
      passed 311424 context values after the clock was scaled to 296.3 MHz.
  - step: 2
    status: observed_action
    action: Inspected softmax row-state congestion and built a separate four-bank row-state candidate.
    observation_or_result: >-
      Four 16x64-bit memories replaced the wide max/sum register network; isolated routing passed with +0.263
      ns WNS, and integrated smoke simulation checked 512 context beats.
  - step: 3
    status: observed_action
    action: >-
      Inspected the remaining scheduler-to-HBM-base-address control chain and registered the sparse scheduler
      choice before address update.
    observation_or_result: >-
      The final derivative combined banked row state with the registered scheduler while retaining the original
      build as the before-state.
  - step: 4
    status: observed_action
    action: >-
      Completed full packaged route and the seven-shape device oracle for that derivative at the requested
      325 MHz.
    observation_or_result: >-
      Full-design WNS was +0.003 ns, TNS zero, WHS +0.009 ns, and 311424 context values matched; the worst
      kernel-clock path was +0.024 ns in value normalization.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Retained the original unbanked implementation through physical optimization and board testing.
    result: >-
      Functional board results passed at 296.3 MHz, but the official route still missed the requested 325 MHz
      by 0.297 ns.
  - status: attempted_insufficient
    action: Evaluated only the isolated BRAM-banked softmax route as an intermediate candidate check.
    result: >-
      +0.263 ns local WNS supported the candidate but did not establish full-kernel timing or board correctness;
      those required the subsequent packaged build.
  rejected_by_evidence:
  - hypothesis_or_direction: Passing the board numerical oracle proves the original design meets 325 MHz.
    evidence: >-
      Vitis selected 296.3 MHz for that original image, and its routed report had negative slack at the 325
      MHz request.
  - hypothesis_or_direction: After the final fix, softmax must still be the next timing bottleneck.
    evidence: >-
      The final kernel-specific worst path moved to value reciprocal/quotient-to-output arithmetic with +0.024
      ns slack.
  root_cause:
  - >-
    Wide per-row max/sum selection and scheduler/address control limited the full kernel. The original worst
    route included score-BRAM-to-subtraction logic; local physical optimization did not remove the overall
    miss. Banked state plus registered scheduler control produced a validated derivative.
  resolution:
    actions:
    - >-
      Place the 64 row max/sum state pairs in four independent 16x64-bit BRAM banks selected by row modulo
      four.
    - Register the sparse scheduler choice before the 64-bit HBM base-address update.
    - >-
      Validate the combined derivative with full route, selected clock metadata, and the same numerical device
      oracle.
  validation:
  - evidence: >-
      The banked-state and registered-scheduler derivative achieved full-design WNS +0.003 ns, TNS zero, zero
      failing setup endpoints, WHS +0.009 ns, and retained the seven-shape board result of 311,424 context
      values with zero mismatches. The worst kernel-clock path had +0.024 ns slack.
    regression_scope: full RTL smoke tests, 325 MHz packaged route, SLR0 verification, and U55C device oracle
  derived_guidance:
  - status: generalized_rule
    rule: Do not report the auto-scaled 296.3 MHz board pass as a 325 MHz pass.
  - status: generalized_rule
    rule: Do not substitute isolated softmax or scheduler slack for full-device timing.
  - status: generalized_rule
    rule: Do not weaken the clock constraint.
  - status: generalized_rule
    rule: >-
      Keep full-design minimum slack separate from kernel-clock slack; this image's +0.003 ns full-design minimum
      was in platform control, while its 325 MHz kernel minimum was +0.024 ns.
  reuse_rule:
  - >-
    Apply when full-route paths show both wide per-row state selection and a scheduler-to-address chain. A
    unit-level positive slack result is only a candidate; require full packaged timing and unchanged numerical
    board output.
- id: SA-QK-SOFTMAX-Q64-002
  title: An unconstrained OOC route does not establish SLR0 timing
  applies_to:
    design_profiles:
    - int8_q64_qk_online_softmax_overlap_ooc325
    architecture_traits:
    - out_of_context_route
    - slr_confinement
    - wide_top_level_ports
  status: validated
  error_family: physical_timing_and_evidence
  error_type: PHYSICAL_EVIDENCE_ERROR
  subtype: unconstrained_placement_claimed_as_target_slr_timing
  stage: standalone_softmax_timing
  tool: Vivado route_design
  failing_layer: timing_methodology
  symptom_signatures:
  - A positive standalone WNS is reported before an SLR pblock is applied.
  - >-
    The route can place logic outside the intended SLR or leave wide top-level I/O without platform partition-pin
    constraints.
  preconditions:
  - The intended claim is timing inside U55C SLR0.
  - The first standalone route lacks an SLR0 containment pblock.
  action_trace:
  - step: 1
    status: observed_action
    action: Examined the standalone softmax route's placement scope after positive slack had been reported.
    observation_or_result: The initial route did not yet constrain the design to the intended SLR0 region.
  - step: 2
    status: observed_action
    action: >-
      Added an SLR0 pblock, assigned the design cells, and enabled routing containment before rerunning implementation.
    observation_or_result: The four-group unit passed an SLR0-contained OOC route with +0.293 ns WNS.
  - step: 3
    status: observed_action
    action: >-
      Kept the constrained unit result separate from the later integrated QK-plus-softmax OOC checkpoint and
      from full-device board evidence.
    observation_or_result: >-
      The integrated original-reader round later passed at +0.016 ns; neither result established shell clock
      skew or platform port timing.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used the first unrestricted standalone route as the available timing experiment.
    result: Its positive slack did not test the intended SLR0 containment requirement.
  rejected_by_evidence:
  - hypothesis_or_direction: Positive standalone WNS is sufficient evidence for a board-integrated SLR0 clock.
    evidence: >-
      The first route lacked the required containment, and OOC HD.CLK_SRC and HD.PARTPIN_LOCS were absent for
      shell clock and HBM-port paths.
  root_cause:
  - >-
    Positive slack from unconstrained placement answered a different physical question than the intended SLR0-contained
    implementation. It could not establish the target placement or a shell-integrated board clock.
  resolution:
    actions:
    - Constrain the standalone implementation to SLR0 and contain routing before reporting an SLR0 result.
    - >-
      Report that rerun as constrained OOC evidence and reserve a shell or board claim for a separately integrated
      build.
  validation:
  - evidence: >-
      The corrected methodology produced an SLR0-contained four-group unit result at +0.293 ns and later a
      separate full QK-softmax OOC result at +0.016 ns. Both remained explicitly classified as OOC, not board
      passes.
    regression_scope: unchanged arithmetic simulation plus constrained OOC implementation
  derived_guidance:
  - status: generalized_rule
    rule: Do not promote an unconstrained OOC route to an SLR0 or board-pass claim.
  - status: generalized_rule
    rule: Do not treat missing HD.CLK_SRC or HD.PARTPIN_LOCS on OOC ports as shell timing evidence.
  - status: generalized_rule
    rule: >-
      The +0.016 ns integrated OOC timing case is a different repair experiment; consult its reader and checkpoint
      history before transferring any structural fix.
  reuse_rule:
  - >-
    Reuse whenever a timing claim depends on placement scope. Unconstrained OOC, SLR-contained OOC, full-device
    route, and board-selected clock are distinct evidence levels even when they use the same RTL.
- id: SA-HLS-WIN-Q64-001
  title: HLS output normalization expands into excessive hardware
  applies_to:
    design_profiles:
    - centered_window_hls_int8_q64_d64_w16_full_attention_u55c
    architecture_traits:
    - hls_operator_scheduling
    - shared_normalization
    - on_chip_input_buffers
  status: validated
  error_family: hls_architecture_and_resources
  error_type: RESOURCE_EXPLOSION
  subtype: replicated_output_normalization
  stage: hls_synthesis
  tool: Vitis HLS
  failing_layer: hls_microarchitecture
  symptom_signatures:
  - First synthesis estimates roughly 243,000 LUTs for a fixed 64x64 attention kernel.
  - The output-normalization operation is expanded into substantially more hardware than intended.
  preconditions:
  - C simulation passes the intended numerical contract.
  - >-
    The design requires one correctness-oriented output-normalization path rather than per-output parallel
    division.
  action_trace:
  - step: 1
    status: observed_action
    action: Ran the fixed 64-token centered-window kernel's C tests before evaluating the hardware estimate.
    observation_or_result: >-
      All nine invocations passed with worst observed error about 0.001955, but first synthesis estimated roughly
      243000 LUTs.
  - step: 2
    status: observed_action
    action: >-
      Identified output-normalization replication and revised normalization sharing and input loading before
      final RTL validation.
    observation_or_result: Revised synthesis estimated about 25100 LUTs, 18500 registers, 26 DSPs, and a 2.705
      ns period.
  - step: 3
    status: observed_action
    action: Checked that generated pointer offsets remained 0x10, 0x1c, and 0x28, then completed RTL co-simulation.
    observation_or_result: >-
      The firmware interface remained compatible and all nine RTL invocations passed with worst error 0.00195424.
  - step: 4
    status: observed_action
    action: Continued through physical implementation and the later user-supplied U55C board run.
    observation_or_result: >-
      Routed accelerator use was 13719 LUTs, 12640 registers, 41 BRAMs, and 34 DSPs; six board invocations
      passed.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Synthesized the initial numerically passing HLS implementation with replicated output normalization.
    result: >-
      The first estimate was roughly 243000 LUTs, motivating an architecture revision despite passing C simulation.
  rejected_by_evidence:
  - hypothesis_or_direction: Passing C simulation proves the first implementation is a practical hardware architecture.
    evidence: >-
      The numerically passing first version expanded to roughly 243000 estimated LUTs; resource sharing changed
      that hardware cost without changing the target algorithm.
  root_cause:
  - >-
    HLS expanded output normalization into more hardware than intended. Sharing normalization and simplifying
    input loading reduced the estimate substantially; the transcript does not isolate a single pragma as the
    sole cause.
  resolution:
    actions:
    - Share output normalization across channels instead of retaining the first excessive replication.
    - Simplify the input-loading structure and preserve the existing three-pointer firmware interface.
    - Recheck C and RTL numerical behavior, then confirm the resulting routed resources and board output.
  validation:
  - evidence: >-
      Revised HLS estimates fell to about 25,100 LUTs, 18,500 registers, and 26 DSPs with a 2.705 ns estimated
      period. RTL co-simulation passed all nine cases; final routed accelerator use was 13,719 LUTs, 12,640
      registers, 41 BRAMs, and 34 DSPs, followed by a passing board oracle.
    regression_scope: C simulation, HLS synthesis, RTL co-simulation, full route, and U55C board test
  derived_guidance:
  - status: generalized_rule
    rule: Do not accept C simulation or an HLS timing estimate as evidence that resource use is practical.
  - status: generalized_rule
    rule: Do not preserve full unrolling when the required throughput does not justify replicated division.
  - status: generalized_rule
    rule: >-
      The supplied history reports the successful sharing change but does not include a complete HLS source
      diff; identify the actual replicated operators and throughput requirement before choosing directives
      in a new design.
  reuse_rule:
  - >-
    Apply when HLS replicates expensive operators beyond throughput needs. Sharing is accepted only if numerical
    regression, cycle behavior, and final routed resources remain within the design contract.
- id: SA-HLS-WIN-Q64-002
  title: XSim startup and device discovery fail inside the isolated environment
  applies_to:
    design_profiles:
    - centered_window_hls_int8_q64_d64_w16_full_attention_u55c
    architecture_traits:
    - hls_rtl_cosimulation
    - sandboxed_tool_execution
  status: validated
  error_family: tool_and_build_flow
  error_type: TOOL_ENVIRONMENT_ERROR
  subtype: sandbox_isolation_at_xsim_startup
  stage: rtl_cosimulation_startup
  tool: Vivado XSim
  failing_layer: execution_environment
  symptom_signatures:
  - RTL compilation succeeds but XSim exits at startup with an unexpected Tcl exception.
  - The failure occurs before any RTL transaction or numerical mismatch is reported.
  - Device discovery inside the sandbox reports no U55C even though the host has one.
  preconditions:
  - Compilation and elaboration have completed.
  - The same generated RTL and testbench can be run in an authorized non-sandboxed tool environment.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Observed a zero-device XRT result and an unexpected Tcl exception at XSim startup after RTL compilation
      succeeded.
    observation_or_result: No RTL numerical failure had occurred; the simulator failed before test transactions
      started.
  - step: 2
    status: observed_action
    action: Retried the co-simulation in the authorized host environment and checked device visibility there.
    observation_or_result: The U55C was visible outside isolation and XSim started successfully with the generated
      design.
  - step: 3
    status: observed_action
    action: Let all nine RTL transactions and final C++ checks complete.
    observation_or_result: >-
      Co-simulation passed all nine invocations, including boundary and mask checks, with maximum error 0.00195424.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Started device discovery and RTL co-simulation inside the isolated environment.
    result: >-
      Discovery reported no devices and XSim failed before transactions; neither observation could establish
      DUT correctness or physical board absence.
  rejected_by_evidence:
  - hypothesis_or_direction: No U55C is present on the host.
    evidence: Host-environment discovery found the U55C that isolated discovery could not see.
  - hypothesis_or_direction: The startup exception is a demonstrated attention-datapath numerical bug.
    evidence: The host run reached all nine transactions and passed their numerical checks using the generated
      kernel.
  root_cause:
  - >-
    The isolated execution environment caused the device-visibility limitation and was implicated by the startup
    failure disappearing in the host run. The transcript does not identify the exact missing permission, resource,
    or Tcl-runtime condition.
  resolution:
    actions:
    - >-
      Run the existing generated design in the authorized host tool environment to isolate environment-dependent
      startup behavior.
    - >-
      Require the full numerical co-simulation to pass after startup; reaching the simulator prompt alone is
      insufficient.
  validation:
  - evidence: XSim started in the host environment and all nine RTL invocations passed with maximum error 0.00195424.
    regression_scope: Generated attention RTL and nine-case co-simulation including boundary and mask checks.
    limitation: >-
      Exact OS or Tcl-runtime root cause was not recorded; this is an environment workaround supported by the
      comparative runs.
  derived_guidance:
  - status: generalized_rule
    rule: Do not modify a passing C model or generated RTL to repair a pre-transaction environment failure.
  - status: generalized_rule
    rule: Do not infer physical board absence from sandboxed device discovery alone.
  reuse_rule:
  - >-
    Reuse only for failures before the first simulated transaction where the same compiled snapshot runs in
    the authorized host environment. A numerical or protocol failure after startup is not an environment-only
    case.
- id: SA-HLS-WIN-Q64-003
  title: Overlapping hardware links corrupt a shared generated build directory
  applies_to:
    design_profiles:
    - centered_window_hls_int8_q64_d64_w16_full_attention_u55c
    architecture_traits:
    - vitis_link
    - generated_build_directory
    - concurrent_processes
  status: validated
  error_family: tool_and_build_flow
  error_type: BUILD_STATE_ERROR
  subtype: concurrent_links_share_build_directory
  stage: hardware_link
  tool: Vitis v++ and Vivado
  failing_layer: build_orchestration
  symptom_signatures:
  - A link attempt reports a port or block-design error after another attempt was started.
  - Two link processes overlap in the same generated build directory.
  - Previously validated HLS package and interface mapping are unchanged.
  preconditions:
  - The first link process has not terminated.
  - A retry reuses its mutable generated directory.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Started a retry after a sandboxed link reported a port error, while the earlier attempt was still running.
    observation_or_result: >-
      Both attempts touched the same generated build directory; the assistant explicitly identified this orchestration
      mistake.
  - step: 2
    status: observed_action
    action: >-
      Restarted the hardware link in a separate sparse300_hw directory while retaining the validated sparse300_final
      HLS package.
    observation_or_result: >-
      Connectivity generation passed and the fresh block design completed the phase where the overlapping attempts
      had failed.
  - step: 3
    status: observed_action
    action: Checked the generated Q, combined K/V, and output HBM connections.
    observation_or_result: >-
      The fresh design reported the intended HBM[0], HBM[1], and HBM[2] connections and proceeded to synthesis
      and implementation.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Retried hardware link in the original generated directory before the first process exited.
    result: The runs overlapped and the shared generated state produced a failed link/block-design attempt.
  rejected_by_evidence:
  - hypothesis_or_direction: The failed overlapping attempt requires changing the validated kernel's Q/K/V
      ports.
    evidence: >-
      The fresh-directory run passed block-design creation and generated the intended HBM connections using
      the existing package.
  root_cause:
  - >-
    The recorded retry overlapped a still-running link in the same mutable generated directory. A fresh-directory
    link using the validated package removed the block-design failure; the history does not independently explain
    the first sandboxed port error before overlap.
  resolution:
    actions:
    - Isolate the retry in a distinct generated link directory and build tag.
    - Reuse the validated HLS package and recheck generated HBM connectivity.
    - Allow the new link to complete without a second process writing the same directory.
  validation:
  - evidence: >-
      The fresh sparse300_hw link passed block-design creation with the expected HBM[0], HBM[1], and HBM[2]
      connections and later produced the routed, packaged, board-passing image.
    regression_scope: fresh hardware link through packaging and board execution
  derived_guidance:
  - status: generalized_rule
    rule: Do not patch kernel ports based on an error produced by overlapping build processes.
  - status: generalized_rule
    rule: Do not reuse a partially mutated link directory as clean evidence.
  - status: generalized_rule
    rule: >-
      Wait for or explicitly end a prior attempt before retrying in any directory it still owns; the recorded
      successful repair used a fresh directory.
  reuse_rule:
  - >-
    Apply when multiple implementation processes overlap in one generated directory and a clean-directory retry
    removes the structural error without source changes. Preserve the contaminated directory only as failure
    evidence.
- id: SA-HLS-WIN-Q64-004
  title: Resume implementation without the BUFG optimization pass that crashed
  applies_to:
    design_profiles:
    - centered_window_hls_int8_q64_d64_w16_full_attention_u55c
    architecture_traits:
    - vitis_generated_implementation
    - checkpoint_resume
    - bufg_optimization
  status: validated
  error_family: tool_and_build_flow
  error_type: TOOL_CRASH
  subtype: vivado_bufg_optimizer_crash
  stage: physical_implementation_optimization
  tool: Vivado
  failing_layer: implementation_tool
  symptom_signatures:
  - Vivado crashes during BUFG clock-buffer optimization.
  - C simulation, RTL co-simulation, packaging, and synthesis have already passed.
  - The crash stack points to the implementation optimizer rather than user RTL diagnostics.
  preconditions:
  - A usable synthesized checkpoint exists.
  - The generated flow permits an explicit optimization-pass list and implementation resume.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Located the crash in the Vivado BUFG clock-buffer optimization pass after C/RTL validation and synthesis
      had completed.
    observation_or_result: >-
      The crash stack identified an implementation optimizer phase rather than a reported HDL compile or numerical
      failure.
  - step: 2
    status: observed_action
    action: >-
      Added an explicit optimization-pass list excluding BUFG optimization and a resume target for the existing
      synthesized design.
    observation_or_result: The retry could reuse completed synthesis instead of rebuilding the attention source.
  - step: 3
    status: observed_action
    action: >-
      Corrected a Tcl property-setting error in the first resume helper and inspected the generated implementation
      script.
    observation_or_result: >-
      Vitis accepted resume; the generated script showed the intended pass exclusion and reloaded synthesis
      checkpoints and constraints.
  - step: 4
    status: observed_action
    action: >-
      Followed the retry past optimizer finalization, placement, route, frequency checks, and xclbin generation.
    observation_or_result: >-
      The routed report met 300 MHz with +0.003 ns setup slack, +0.009 ns hold slack, and zero failing endpoints.
  - step: 5
    status: observed_action
    action: >-
      Incorporated the user's later board-test output after automated board permission had initially been declined.
    observation_or_result: Six centered-window invocations passed; the maximum board error was 0.00195424.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Ran the generated implementation flow with its original optimizer pass selection.
    result: Vivado crashed in BUFG optimization.
  - status: attempted_insufficient
    action: Used the first version of the new resume helper.
    result: >-
      A Tcl property-setting error required correction before Vitis accepted resume. The exact failing property
      syntax is not included in the supplied history.
  rejected_by_evidence: []
  root_cause:
  - >-
    The observed crash was isolated to Vivado's BUFG optimization pass. Excluding that pass allowed the same
    synthesized design to progress; the internal Vivado defect was not identified.
  resolution:
    actions:
    - Configure an explicit optimization-pass selection that excludes the identified crashing BUFG pass.
    - >-
      Correct the helper's property assignment and verify the generated script actually contains that selection.
    - Resume implementation from the valid synthesized design and reload its constraints.
    - Complete final route, selected-frequency checks, packaging, and functional board validation.
  validation:
  - evidence: >-
      The retry passed optimizer finalization, completed routing at 300 MHz with WNS +0.003 ns and WHS +0.009
      ns, produced the xclbin, and the later user board log passed six invocations with maximum error 0.00195424.
    regression_scope: Resumed implementation, routed setup/hold, clock metadata, firmware packaging, and six
      board invocations.
    limitation: >-
      The history states that the pass list and Tcl helper were corrected, but does not contain their complete
      command diff; do not invent the missing exact optimizer options.
  derived_guidance:
  - status: generalized_rule
    rule: Do not call the workaround successful when optimization merely advances past the crash.
  - status: generalized_rule
    rule: Do not skip final route or board validation.
  - status: generalized_rule
    rule: Do not generalize this workaround to unrelated Vivado crashes without the same stack location.
  reuse_rule:
  - >-
    Reuse only when the crash is isolated to the same optional optimizer pass and a valid earlier checkpoint
    exists. The workaround is accepted only after full timing and functional validation, not merely after tool
    progress.
- id: SA-HLS-WIN-Q64-005
  title: The post-package clock checker does not recognize Scalable Clocks metadata
  applies_to:
    design_profiles:
    - centered_window_hls_int8_q64_d64_w16_full_attention_u55c
    architecture_traits:
    - xclbin_clock_metadata
    - timing_gate_parser
  status: validated
  error_family: tool_and_build_flow
  error_type: REPORT_PARSER_ERROR
  subtype: scalable_clocks_metadata_format
  stage: post_package_frequency_check
  tool: project timing-check helper
  failing_layer: report_parser
  symptom_signatures:
  - Firmware packaging succeeds and produces the final xclbin.
  - The frequency checker rejects or cannot parse metadata labeled Scalable Clocks.
  preconditions:
  - The routed timing report already passes.
  - The image's metadata represents clocks in the Scalable Clocks format.
  action_trace:
  - step: 1
    status: observed_action
    action: Checked the image after make firmware completed and produced the final 46 MB xclbin.
    observation_or_result: >-
      Clock metadata showed 300 MHz, but the timing-check helper did not handle the Scalable Clocks representation.
  - step: 2
    status: observed_action
    action: Corrected the helper's handling of that metadata format while retaining the routed timing check.
    observation_or_result: The corrected check reported 300 MHz achieved and routed timing met.
  - step: 3
    status: observed_action
    action: Kept packaging, clock verification, and board execution as separate observed results.
    observation_or_result: >-
      Board execution was initially declined, then the user supplied a later successful six-case run of the
      image.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Applied the original clock-metadata parser to the new image.
    result: >-
      The parser did not recognize its Scalable Clocks format despite successful packaging and passing routed
      timing.
  rejected_by_evidence:
  - hypothesis_or_direction: A metadata parse failure alone proves the xclbin or RTL is invalid.
    evidence: >-
      Packaging had produced the final artifact, routed timing passed, and the corrected checker recognized
      its 300 MHz clock without a reported RTL change.
  root_cause:
  - >-
    The helper recognized only the reference image's prior clock-metadata layout and did not handle the generated
    image's Scalable Clocks section.
  resolution:
    actions:
    - Extend the helper to accept the image's Scalable Clocks representation.
    - Recheck both the selected 300 MHz metadata and final routed timing before accepting the image.
  validation:
  - evidence: >-
      The session reported the corrected helper passing both the 300 MHz achieved-frequency check and the routed
      timing gate.
    regression_scope: Final xclbin clock metadata and final routed timing report.
    limitation: The exact parser source diff is not included in the supplied transcript.
  derived_guidance:
  - status: generalized_rule
    rule: Do not rebuild or change RTL solely because a successful image uses a different metadata layout.
  - status: generalized_rule
    rule: Do not accept clock metadata without routed slack, or routed slack without the selected image clock.
  reuse_rule:
  - >-
    Apply when the artifact is valid and the parser rejects only an alternate documented metadata layout. Continue
    requiring both selected-clock metadata and nonnegative routed timing.
- id: SA-QUEST-BFP8-Q64-P64-013
  title: XSim runs an old snapshot after xvlog rejects the new wrapper
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - incremental_xsim_build
    - reused_work_library
  status: validated
  error_family: tool_and_build_flow
  error_type: BUILD_STATE_ERROR
  subtype: stale_snapshot_after_compile_failure
  stage: mapper_recompilation
  tool: Vivado xvlog, xelab, and XSim
  failing_layer: simulation_build_orchestration
  symptom_signatures:
  - xvlog reports redeclaration of ANSI port cfg_ready and invalid initialization in declaration.
  - xelab and xsim still run afterward and repeat the old Pending mapping not ready failure.
  preconditions:
  - A previously compiled work library or snapshot exists in the reused simulation directory.
  - The command sequence does not stop when source compilation fails.
  action_trace:
  - step: 1
    status: observed_action
    action: Read the first compile diagnostics before interpreting the later repeated simulation failure.
    observation_or_result: >-
      The new wrapper had been ignored after syntax errors, so the later simulation was not evidence about
      the intended patch.
  - step: 2
    status: observed_action
    action: >-
      Supplied a complete corrected wrapper with one cfg_ready port declaration and its assignment outside
      the port list.
    observation_or_result: The repair preserved registered completion and blocked readiness during pending-result
      capture.
  - step: 3
    status: observed_action
    action: Supplied a clean simulation-build rerun that stopped on compile failure before elaboration or simulation.
    observation_or_result: The next user output reported ALL DOUBLE-BUFFER MAPPER TESTS PASSED at 590 ns.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Continued to elaboration and simulation after xvlog returned errors.
    result: The previous compiled design repeated its original fatal, making the new patch appear ineffective.
  rejected_by_evidence:
  - hypothesis_or_direction: The repeated runtime fatal disproves the registered-completion repair.
    evidence: >-
      Compilation of the revised source had already failed; the clean successful rebuild subsequently passed
      the mapper suite.
  root_cause:
  - >-
    The build sequence continued after failed source compilation in a directory containing prior compiled artifacts.
    The stale simulation result was attributed to the new source even though that source was rejected.
  resolution:
    actions:
    - Repair the wrapper declaration error first.
    - Build in a clean dedicated simulation directory or invalidate only the affected generated snapshot.
    - Gate elaboration and simulation on successful compilation, preserving each tool's exit status.
  validation:
  - evidence: The subsequent user log reported the full double-buffer mapper suite passing at 590 ns.
    regression_scope: Compile, elaborate, and simulate the corrected wrapper with the five directed mapper
      tests.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A test result is relevant only when the source intended for that test compiled successfully; repeated
      old failures after compile errors are build evidence first.
  reuse_rule:
  - >-
    Apply when a failed compile is followed by simulation using reusable generated state. If compilation succeeds
    and artifact identity is current, investigate the runtime failure on its own evidence.
- id: SA-QK-SOFTMAX-Q64-003
  title: Reader timing repair requires physical sweeps and correct checkpoint attribution
  applies_to:
    design_profiles:
    - int8_q64_qk_online_softmax_overlap_ooc325
    architecture_traits:
    - hbm_reader_enable_fanout
    - slr0_ooc
    - checkpoint_strategy_sweep
  status: validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_FAILURE
  subtype: reader_enable_fanout_and_checkpoint_identity
  stage: integrated_qk_softmax_physical_implementation
  tool: Vivado route_design
  failing_layer: reader_control_and_physical_implementation
  symptom_signatures:
  - A legal SLR0 route misses 325 MHz by 0.210 ns despite passing integrated functional simulation.
  - The worst path is a high-fanout HBM-reader next-round enable rather than the softmax pipeline.
  - A later positive route belongs to an older checkpoint while the current source contains a reader rewrite.
  preconditions:
  - >-
    The integrated IP contains a 4x4 grid of 16x16 packed-INT8 QK engines, sixteen score-bank sets, and four
    row-group softmax pipelines.
  - Runs use the U55C part, a 3.076923 ns clock, and SLR0 routing containment.
  - Candidate sources, synthesis checkpoints, strategy rounds, and metrics can be distinguished.
  action_trace:
  - step: 1
    status: observed_action
    action: Ran both 8- and 16-lane integrated three-tile d=128 simulations before diagnosing the route.
    observation_or_result: Both passed with zero GEMM-buffer and softmax stalls and a 177-cycle QK tile-drain
      interval.
  - step: 2
    status: observed_action
    action: >-
      Inspected the default route's critical endpoints and implemented a predecoded-reader candidate in a separate
      synthesis flow.
    observation_or_result: >-
      Original-reader WNS was -0.210 ns; the candidate's default-route WNS improved to -0.071 ns but still
      failed.
  - step: 3
    status: observed_action
    action: >-
      Ran separate physical-strategy sweeps for the original checkpoint and the reader candidate while keeping
      the clock and SLR scope unchanged.
    observation_or_result: >-
      Explore opt/place, AggressiveExplore physopt, and Explore route on the original-reader checkpoint reached
      +0.016 ns.
  - step: 4
    status: observed_action
    action: Compared the passing metrics with checkpoint identity and current source state.
    observation_or_result: >-
      The pass belonged to the original reader, while the working source contained the predecoded version;
      the reported proof remained an OOC result.
  - step: 5
    status: observed_action
    action: Read the later completed strategy tables for both original and predecoded-reader checkpoints.
    observation_or_result: >-
      The original reader finished at -0.210, +0.016, and +0.028 ns across rounds 0-2. The predecoded reader
      finished at -0.071, +0.034, and +0.024 ns. Both closed timing with later strategies; the best reported
      predecoded result used Explore opt/place, AggressiveExplore physopt, and Explore route.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Routed the original-reader checkpoint with the default physical strategy.
    result: WNS was -0.210 ns at 325 MHz.
  - status: attempted_insufficient
    action: Routed the predecoded-reader candidate with the default strategy after it passed simulation.
    result: >-
      WNS improved to -0.071 ns but still failed; that candidate did not produce the +0.016 ns pass recorded
      here.
  rejected_by_evidence:
  - hypothesis_or_direction: The softmax lane count is the first repair lever for the initial timing miss.
    evidence: >-
      The reported worst path was an HBM-reader enable path; both tested lane counts already passed the same
      zero-stall simulation.
  - hypothesis_or_direction: The current predecoded-reader source is proven at +0.016 ns.
    evidence: >-
      The +0.016 ns round used the original reader. The predecoded source had its own separate results, initially
      -0.071 ns and later +0.034 and +0.024 ns; those are its candidate-specific claims.
  root_cause:
  - >-
    The original route was limited by reader control/fanout under its physical strategy. Predecoding improved
    but did not close the default candidate route; later physical strategies closed both checkpoints. The first
    +0.016 ns pass and the later +0.034 ns candidate pass belong to different source artifacts.
  resolution:
    actions:
    - >-
      Preserve the original checkpoint and the separate reader candidate so each physical result has an unambiguous
      source identity.
    - >-
      Evaluate Explore opt/place, AggressiveExplore physopt, and Explore route against the identified reader
      checkpoint; this combination produced +0.016 ns for the original and +0.034 ns for the predecoded candidate.
    - >-
      Compare the later Explore opt, ExtraNetDelay_high place, and Explore physopt/route round separately;
      it produced +0.028 ns for the original and +0.024 ns for the predecoded candidate.
    - >-
      Associate every timing claim with its actual checkpoint and preserve integrated simulation and OOC scope
      qualifications when selecting a result.
  validation:
  - evidence: >-
      Completed SLR0 OOC tables show original-reader rounds at -0.210, +0.016, and +0.028 ns and predecoded-reader
      rounds at -0.071, +0.034, and +0.024 ns at 325 MHz. Integrated three-tile d=128 simulations passed with
      zero buffer or softmax stalls; the original +0.016 ns round's worst path moved into GEMM control/array
      logic.
    regression_scope: >-
      Integrated overlap simulation and separate SLR0-contained OOC synthesis/route sweeps for both identified
      reader checkpoints.
    limitation: >-
      These are narrow OOC margins, with no shell-integrated or board proof. The final tables establish results
      for these two checkpoints, not a universal ranking of physical strategies.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Reinspect the worst path after each structural or physical change; a useful control rewrite may still
      fail timing, and a later strategy pass may belong to a different source checkpoint.
  reuse_rule:
  - >-
    Reuse the investigation when timing points to high-fanout reader control and multiple checkpoints are being
    swept. The exact physical strategy is an experiment to retest on a new design, not a guaranteed repair;
    an arithmetic-dominated path requires a different investigation.
- id: SA-BF16-COMPACT-001
  title: XSim elaboration rejects inconsistent timescale declarations
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - systemverilog_simulation
    - mixed_module_timescales
  status: validated
  error_family: tool_and_build_flow
  error_type: ELABORATION_ERROR
  subtype: missing_module_timescale
  stage: bf16_multiplier_elaboration
  tool: Vivado XSim
  failing_layer: simulation_source_configuration
  symptom_signatures:
  - XSIM 43-4099 reports that bf16_mul has no timescale while another design module has one.
  preconditions:
  - xvlog succeeded, but the testbench and multiplier used inconsistent explicit time declarations.
  action_trace:
  - step: 1
    status: observed_action
    action: Identified the timescale diagnostic at elaboration, after successful source analysis.
    observation_or_result: The testbench declared 1ns/1ps while the multiplier did not.
  - step: 2
    status: observed_action
    action: >-
      Supplied the same timescale declaration at the start of the multiplier and requested compile, elaboration,
      and simulation again.
    observation_or_result: The user log reported ALL TESTS PASSED (10 vectors), terminating at 200 ns.
  failed_or_insufficient_attempts: []
  rejected_by_evidence:
  - hypothesis_or_direction: The diagnostic proves the BF16 arithmetic is incorrect.
    evidence: The failure preceded numerical simulation; the rebuilt design passed the ten-vector suite.
  root_cause:
  - Mixed timescale handling blocked elaboration before the arithmetic tests could run.
  resolution:
    actions:
    - Apply consistent time declarations to the affected simulation modules and rebuild the snapshot.
  validation:
  - evidence: Ten BF16 multiplier test vectors passed after elaboration succeeded.
    regression_scope: Source analysis, elaboration, and multiplier smoke simulation.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A simulation time unit determines delay interpretation; it does not establish an FPGA clock-frequency
      result.
  reuse_rule:
  - >-
    Apply to an explicit elaboration diagnostic about inconsistent time declarations; numerical failures after
    successful elaboration need their own investigation.
- id: SA-BF16-COMPACT-002
  title: A dash-prefixed Tcl property value and malformed edits prevent simulation launch
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - vivado_project_simulation
    - xsim_plusargs
  status: validated
  error_family: tool_and_build_flow
  error_type: TCL_ARGUMENT_ERROR
  subtype: leading_dash_property_value_and_corrupted_script
  stage: fp32_accumulator_accuracy_simulation_launch
  tool: Vivado Tcl and XSim
  failing_layer: simulation_script
  symptom_signatures:
  - Common 17-170 reports Unknown option '-testplusarg VECTORS=...'.
  - A retry log still prints the original positional set_property statement.
  - The edited file contains duplicated snippets and a malformed -objects $fsset vectors sequence.
  preconditions:
  - >-
    The desired property value starts with -testplusarg and is passed through positional set_property arguments.
  - The subsequent manual edit was unsaved or mixed into existing Tcl statements.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Traced the first failure to the dash-prefixed more_options value and supplied explicit -name, -value,
      and -objects arguments.
    observation_or_result: The next log still executed the old positional statement, so it did not test the
      proposed correction.
  - step: 2
    status: observed_action
    action: >-
      Inspected the supplied editor contents and identified duplicate pasted replacements and broken launch_simulation
      text.
    observation_or_result: The script needed a clean replacement rather than another insertion into the corrupted
      text.
  - step: 3
    status: observed_action
    action: >-
      Supplied one complete Tcl script, preserved vector-file checks and a single simulation launch, and requested
      verification of the saved contents before rerunning.
    observation_or_result: The user then obtained ACCUM_ACCURACY_COMPLETED dots=12 and completed the Python
      error analysis.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Set the dash-prefixed property value using the original positional statement.
    result: Vivado interpreted the value as an option and stopped.
  - status: attempted_insufficient
    action: Retried after a malformed or unsaved manual edit.
    result: The same original command ran again; the proposed syntax had not been cleanly applied.
  rejected_by_evidence: []
  root_cause:
  - >-
    Tcl option parsing rejected the positional dash-prefixed value; duplicated and unsaved edits then prevented
    the replacement from being tested.
  resolution:
    actions:
    - >-
      Use set_property -name xsim.simulate.xsim.more_options -value "-testplusarg VECTORS=$vectors" -objects
      $fs in a clean Tcl script.
    - Check the actual saved script before launch, then run the numerical analysis on the completed simulation.
  validation:
  - evidence: >-
      All 12 dot products completed across lengths 64, 128, and 256; the Python analysis reported maximum absolute
      error 2.384185791e-07.
    regression_scope: Simulation launch, vector-file delivery, and four numeric patterns at each of three reduction
      lengths.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A repeated error is not a failed repair experiment when the log proves the corrected command was never
      executed.
  reuse_rule:
  - >-
    Apply when the first diagnostic is command parsing and the logged command matches this argument shape.
    Do not change arithmetic RTL to repair a simulation-script option error.
- id: SA-BF16-COMPACT-003
  title: Serial-mapper watchdog still assumes the older short scan
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - serial_lane_mapper
    - changed_configuration_latency
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: watchdog_shorter_than_contractual_latency
  stage: serial_mapper_configuration
  tool: Vivado XSim
  failing_layer: testbench_watchdog
  symptom_signatures:
  - Fatal Mapper configuration timeout occurs before the new serial scan can complete.
  preconditions:
  - The new mapper scans 32 positions in 32 cycles; the reused watchdog still aborts after 12 cycles.
  - The test already has an independent exact scan_cycles==32 assertion.
  action_trace:
  - step: 1
    status: observed_action
    action: Compared the inherited timeout against the new one-position-per-cycle mapping contract.
    observation_or_result: The watchdog expired before the required 32-cycle latency.
  - step: 2
    status: observed_action
    action: >-
      Supplied a change from scan_cycles>12 to scan_cycles>40 and kept scan_cycles!=32 as a separate fatal
      condition.
    observation_or_result: All 104 mapper tests passed in the next user log.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Reused the short mapper's watchdog after changing the scan architecture.
    result: The new mapper was falsely declared stalled before its specified completion time.
  rejected_by_evidence: []
  root_cause:
  - The testbench timeout was not updated with the architecture's configuration latency.
  resolution:
    actions:
    - >-
      Increase the watchdog enough to allow the specified scan, while retaining the exact 32-cycle completion
      assertion.
  validation:
  - evidence: REGISTERED SPARSE LANE MAPPER reported 104 tests passed and ALL LANE MAPPER TESTS PASSED.
    regression_scope: Directed and randomized mapping tests with exact configuration latency.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Increasing a timeout is justified here by the explicit latency contract; a controller that already missed
      its legal completion event is a different case.
  reuse_rule:
  - >-
    Reuse only when the watchdog is demonstrably shorter than legal latency. Missing completion despite legal
    stimulus and sufficient time requires event/state investigation.
- id: SA-BF16-COMPACT-004
  title: Paged-executor testbench misses a one-cycle completion while still driving operands
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - two_pass_execution
    - pulsed_completion
    - asymmetric_block_lengths
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: missed_completion_pulse_during_stimulus_task
  stage: paged_compacted_dot_product_completion
  tool: Vivado XSim
  failing_layer: testbench_completion_monitor
  symptom_signatures:
  - Pair completion timeout occurs although all 20 expected outputs were seen.
  - done_seen, core_issued_last, and core_done_seen are all 11 at timeout.
  preconditions:
  - pair_done is asserted for the one-cycle S_COMPLETE state.
  - The testbench over-drives a short page using a length based on blocks that are not required on that page.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Initially considered missing completion for an empty block and added state, synthetic-handshake, result,
      and completion diagnostics.
    observation_or_result: The trace showed both blocks completed and the observed result mask exactly matched
      the expected mask.
  - step: 2
    status: observed_action
    action: >-
      Reinterpreted the timeout as a missed notification and inspected the stimulus task against the one-cycle
      S_COMPLETE state.
    observation_or_result: The task was still streaming a nominal 24-cycle sequence when the shorter page finished.
  - step: 3
    status: observed_action
    action: >-
      Supplied a per-page length calculation using only required_blocks, plus a continuous clocked completion
      latch that captured done and mask metadata.
    observation_or_result: The case runner could observe completion after leaving its stimulus loop and check
      the saved metadata.
  - step: 4
    status: observed_action
    action: Requested a clean rebuild after the separate patch-script failure was corrected.
    observation_or_result: Four paged cases passed, covering 20, 32, 16, and zero active results, for 68 computed
      outputs total.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Waited for live pair_done only after finishing a stimulus loop that was too long for the page.
    result: The legal completion pulse passed unnoticed and the test timed out.
  rejected_by_evidence:
  - hypothesis_or_direction: The controller deadlocked because a block with no work never completed.
    evidence: Both sticky core completion flags were set and all expected results had already arrived.
  root_cause:
  - >-
    Incorrect per-page stream length allowed the testbench to miss a transient completion event and its transient
    metadata.
  resolution:
    actions:
    - Derive each page's maximum stream length only from its required blocks.
    - >-
      Capture pair_done and associated result masks continuously, clearing that capture at the next accepted
      job.
    - Let the case runner wait on captured completion and confirm readiness before starting another job.
  validation:
  - evidence: PAGED EXECUTOR TESTS PASSED 4 and ALL PAGED SPARSE MAC TESTS PASSED at 1720 ns.
    regression_scope: Empty, one-pass, and two-pass masks; source tags, result completeness, and background
      configuration.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Capture the notification and the metadata that belongs to it together; latching only a done bit can still
      leave the final checker reading a later transaction's metadata.
  reuse_rule:
  - >-
    Apply when accepted results and internal completion prove progress finished but the procedural monitor
    missed a pulse. It does not repair an RTL interface that exposes completion before its payload is valid.
- id: SA-BF16-COMPACT-005
  title: An overescaped patch regex never finds the intended assignment
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - scripted_testbench_transform
    - guarded_file_update
  status: validated
  error_family: tool_and_build_flow
  error_type: SOURCE_GENERATOR_ERROR
  subtype: overescaped_regex_in_patch_script
  stage: completion_monitor_testbench_patch
  tool: Python patch script
  failing_layer: source_transformation
  symptom_signatures:
  - AssertionError Could not find maximum_length assignment.
  preconditions:
  - A raw regex uses doubled backslashes where whitespace matching was intended.
  - The script asserts before writing the output file and a pre-edit backup exists.
  action_trace:
  - step: 1
    status: observed_action
    action: Inspected the failed regex and identified literal-backslash matching instead of whitespace matching.
    observation_or_result: The assertion stopped the first patch before the testbench file was written.
  - step: 2
    status: observed_action
    action: >-
      Supplied a replacement patch reading the saved pre-fix source and locating the single maximum_length
      assignment with plain string boundaries through its semicolon.
    observation_or_result: >-
      Expected occurrence checks were retained, and the completion-latch and required-block-length changes
      could be applied together.
  - step: 3
    status: observed_action
    action: Requested recompilation and the paged-executor test.
    observation_or_result: The user reported all four paged cases passing after the corrected patch.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used the overescaped raw regex in the first source patch.
    result: The assignment was present but the pattern did not match, so no patch was written.
  rejected_by_evidence: []
  root_cause:
  - The patch encoded regex escaping incorrectly; the source transformation failed before any RTL experiment.
  resolution:
    actions:
    - Start from the preserved pre-edit source and identify the assignment with verified string boundaries.
    - Verify every target and final modification before performing the single output write.
  validation:
  - evidence: The resulting testbench compiled and the four-case paged suite passed.
    regression_scope: Source transformation followed by compile, elaborate, and paged simulation.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A failed transformation assertion is useful evidence about the patch, not evidence that the DUT rejected
      the intended fix.
  reuse_rule:
  - >-
    Apply when the intended fragment exists but escaping prevents the patch from locating it. Preserve fail-before-write
    behavior rather than silently skipping a missing replacement.
