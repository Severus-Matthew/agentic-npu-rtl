    after compilation is a separate timing or arithmetic question.
- id: SA-QUEST-BFP8-Q64-P64-018
  title: Parallel rank comparisons replace a timing-critical Top-4 insertion cascade
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - streaming_topk
    - fixed_four_rank_selector
    - deterministic_ties
  status: validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_FAILURE
  subtype: serial_topk_insertion_dependency
  stage: standalone_top4_selector_implementation
  tool: Vivado synthesis and route_design
  failing_layer: ranking_microarchitecture
  symptom_signatures:
  - The selector passes 1005 functional tests but synthesis WNS is -1.466 ns at 300 MHz.
  - The ranking-register path has eighteen logic levels.
  preconditions:
  - Insertion is implemented as an iterative cascade through four stored ranks.
  - Signed score order and page-ID tie breaking are part of the required behavior.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Inspected the failed ranking path and kept the successful 1005-case functional suite as the behavioral
      baseline.
    observation_or_result: The problem was comparator/update dependency depth, not DSP capacity or a demonstrated
      ordering error.
  - step: 2
    status: observed_action
    action: >-
      Supplied independent rank-slot comparisons and one-hot earliest-insertion detection, followed by local
      register shifts.
    observation_or_result: >-
      The new structure preserved empty-slot handling, tie order, and reset while removing the serial comparison
      chain.
  - step: 3
    status: observed_action
    action: Requested functional rerun, synthesis, and OOC routing under the same 300 MHz constraint.
    observation_or_result: >-
      The final route used 297 LUTs and 199 registers, with WNS +1.292 ns, WHS +0.057 ns, and zero routing
      errors.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used cascaded insertion logic for the functional prototype.
    result: Although its 1005 functional cases passed, its synthesized critical path missed 300 MHz.
  rejected_by_evidence: []
  root_cause:
  - Serial rank comparisons and updates created an eighteen-level path between ranking registers.
  resolution:
    actions:
    - >-
      Compare the incoming candidate with rank slots in parallel and derive the earliest qualifying insertion
      point.
    - >-
      Use local insert/shift register updates while preserving signed comparison and deterministic ID tie behavior.
    - Repeat numerical/order tests and route the rewritten selector.
  validation:
  - evidence: >-
      Optimized Top-4 passed its functional suite and the OOC route at 300 MHz with WNS +1.292 ns and WHS +0.057
      ns; all 232 routable nets were routed.
    regression_scope: Standalone four-rank selection and constrained OOC timing.
    limitation: >-
      This is a Top-4 prototype; the final Quest profile uses Top-2. The case supports a ranking-depth repair
      pattern, not untested arbitrary K scaling.
  derived_guidance: []
  reuse_rule:
  - >-
    Apply when a measured path cascades through rank comparisons. The later Top-K-to-page-union FIFO case concerns
    a different path and needs its own repair.
- id: SA-QUEST-BFP8-Q64-P64-019
  title: Streaming and staged exponent alignment remove the buffered BFP8 accumulator bottleneck
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - group_scaled_accumulation
    - common_base_exponent
    - staged_rounding
  status: validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_AND_RESOURCE_FAILURE
  subtype: dynamic_group_select_align_round_add_chain
  stage: standalone_group_accumulator_implementation
  tool: Vivado route_design
  failing_layer: arithmetic_storage_and_pipeline_architecture
  symptom_signatures:
  - A functionally passing accumulator uses 576 LUTs and has WNS -0.390 ns at 300 MHz.
  - >-
    A fifteen-level path selects a stored partial sum, aligns and rounds it, then accumulates in the same cycle.
  preconditions:
  - >-
    The prototype stores eight group partials and performs dynamic group selection and common-exponent search
    locally.
  - All 128 numerical tests pass, so the repair must preserve the tested arithmetic and rounding contract.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Read the routed group-index-to-accumulator path and calculated the cost of replicating 576 LUTs across
      4096 PEs.
    observation_or_result: Both the -0.390 ns setup miss and projected accumulator area were unacceptable for
      the proposed array.
  - step: 2
    status: observed_action
    action: Supplied a streamed accumulator receiving a precomputed common exponent and partial sums directly.
    observation_or_result: >-
      This removed the eight-entry storage, repeated dynamic selection, and local maximum-exponent search;
      128 tests passed, LUTs fell to 378, and routed WNS became +0.048 ns.
  - step: 3
    status: observed_action
    action: Inspected the new worst base-exponent-to-aligned-value path instead of stopping at the narrow first
      pass.
    observation_or_result: >-
      Exponent subtraction, shift, ties-to-even rounding, and sign application still occupied one alignment
      cycle.
  - step: 4
    status: observed_action
    action: >-
      Supplied an extra registered boundary between exponent-difference calculation and alignment and reran
      the numerical and physical checks.
    observation_or_result: >-
      The two-stage variant retained all 128 test results, used 288 LUTs, and reached WNS +0.432 ns with WHS
      +0.064 ns and zero route errors.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Retained buffered dynamic group selection, alignment, rounding, and addition in one critical cycle.
    result: >-
      Setup failed at -0.390 ns and the architecture could not be replicated unchanged at the intended array
      size.
  - status: attempted_insufficient
    action: Evaluated the first streamed implementation as a full array replication candidate.
    result: >-
      Its +0.048 ns standalone pass was narrow and 378 LUTs per lane would still exceed the full-device budget
      at 4096 instances; shared/tiled alignment remained necessary.
  rejected_by_evidence: []
  root_cause:
  - >-
    Dynamic stored-group selection and arithmetic alignment were combined on the critical path; per-PE duplication
    also made the prototype's local resource cost unsuitable for array scaling.
  resolution:
    actions:
    - Supply a common exponent before the stream so the accumulator need not buffer and rescan all groups.
    - >-
      Separate exponent difference and magnitude calculation from the shift/round stage, preserving the numerical
      contract.
    - >-
      Treat the 288-LUT block as a validated alignment reference and evaluate scheduled shared alignment before
      large-array replication.
  validation:
  - evidence: >-
      All 128 numerical tests passed across the tested variants; WNS progressed from -0.390 to +0.048 to +0.432
      ns, while LUTs fell from 576 to 378 to 288.
    regression_scope: Standalone group-scaled accumulator arithmetic and 300 MHz OOC routing.
    limitation: >-
      Even 4096 copies of the final 288-LUT aligner plus MAC would consume about 91.4 percent of device LUT
      capacity before system logic; no full-array scalability proof follows.
  derived_guidance: []
  reuse_rule:
  - >-
    Apply when the measured path combines group selection and exponent alignment. Confirm upstream exponent
    availability and tested partial-sum ranges before changing the input contract or sharing schedule.
- id: SA-ATTN-INT8-Q64-002
  title: Staging RTL files is insufficient when the packaged kernel source list omits them
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - rtl_kernel_packaging
    - generated_import_directory
    - explicit_source_manifest
  status: validated
  error_family: tool_and_build_flow
  error_type: MISSING_RTL_MODULE
  subtype: staged_but_unregistered_kernel_sources
  stage: packaged_kernel_synthesis
  tool: Vitis linker and Vivado synthesis
  failing_layer: kernel_package_source_manifest
  symptom_signatures:
  - Synthesis reports sparse_online_softmax_stats not found and cascades through the kernel wrapper modules.
  - >-
    prepare_sources copies the module into imports, but package_xo has a separate explicit custom_sources list.
  preconditions:
  - New softmax and exponent modules were introduced after the original GEMM packaging list was written.
  - The required source exists but is not registered in the packaged project's synthesis sources.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Read the first missing-module diagnostic instead of treating the final v++ link-failed summary as the
      root cause.
    observation_or_result: sparse_online_softmax_stats was absent from the synthesis source closure of the
      packaged kernel.
  - step: 2
    status: observed_action
    action: >-
      Compared prepare_sources staging with package_xo's explicit custom_sources list for both score-only and
      full-V builds.
    observation_or_result: Copying the files into imports had not added them to that separate list.
  - step: 3
    status: observed_action
    action: >-
      Added the exponent and online-softmax sources to both package lists and the value-stage source to the
      full-attention list, then rebuilt new packaged candidates.
    observation_or_result: >-
      Both integrated kernel RTL syntheses later completed without missing-module or RTL errors and advanced
      toward implementation.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Added the new sources to staging but retained the old explicit package manifest.
    result: The generated package was missing instantiated modules even though the source files existed on
      disk.
  rejected_by_evidence:
  - hypothesis_or_direction: The missing-module error requires redesigning online softmax arithmetic.
    evidence: >-
      The source module existed; registering it in the package's actual source set allowed synthesis to proceed.
  root_cause:
  - >-
    The source-copy step and source-registration step had independent lists; only the former had been updated
    for the added functional stages.
  resolution:
    actions:
    - >-
      Include every instantiated exponent, softmax, and applicable value-stage source in the actual packaged
      synthesis manifest.
    - Regenerate the package and verify the synthesized imported-source set before retrying full link.
  validation:
  - evidence: >-
      The session subsequently reported both integrated kernel RTL syntheses completing without missing-module
      or RTL errors.
    regression_scope: Source staging, kernel packaging, and integrated kernel synthesis for score-only and
      full-V variants.
    limitation: This closes source inclusion only; timing and board gates were separate later experiments.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      An implementation must be tested from the packaged source closure, not merely from a standalone simulation
      command with a more complete source list.
  reuse_rule:
  - >-
    Apply when a known source is omitted from the build's actual manifest. If the module is registered but
    its declaration is rejected, investigate that earlier source diagnostic instead.
- id: SA-ATTN-INT8-Q64-003
  title: A post-transfer ready check falsely rejects the last captured score beat
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - single_score_tile_capture
    - ready_state_transition
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: ready_checked_after_accepted_final_beat
  stage: online_softmax_score_tile_capture
  tool: Vivado XSim
  failing_layer: testbench_handshake_observation
  symptom_signatures:
  - Fatal capture backpressure at beat 511 occurs at the final beat of a 512-beat tile.
  preconditions:
  - The testbench checks score_ready at the negedge after the intervening rising-edge transfer.
  - The receiver may legally lower ready after accepting the final tile beat and changing state.
  action_trace:
  - step: 1
    status: observed_action
    action: Inspected the final-beat stimulus loop and its post-edge readiness assertion.
    observation_or_result: >-
      The checker read the next state's ready instead of the readiness that allowed the just-completed transfer.
  - step: 2
    status: observed_action
    action: >-
      Moved the existing readiness check before the next negedge wait while preserving all beat data and count
      requirements.
    observation_or_result: The unchanged RTL passed first-key, continuation, final-key, and diagonal causal
      online-softmax cases.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Sampled readiness after each beat had already been accepted.
    result: The legal final-beat state transition was reported as capture backpressure.
  rejected_by_evidence: []
  root_cause:
  - The testbench confused transfer-time readiness with readiness after the receiver had consumed the tile.
  resolution:
    actions:
    - >-
      Sample or capture readiness at the defining handshake phase, before the final transfer changes receiver
      state.
    - Keep exact capture counts and subsequent row-statistic checks intact.
  validation:
  - evidence: >-
      Five online tile transitions passed and the log reported ALL TESTS PASSED: one score tile and online
      normalizer state.
    regression_scope: Score-tile capture and online normalizer state across causal and multiple-key-tile sequences.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      This repair moves an observation to the accepted transfer; it is different from waiting for initial readiness
      or allowing combinational row selection to settle.
  reuse_rule:
  - >-
    Reuse when only the final post-transfer ready sample fails and accepted-beat evidence is correct. A receiver
    that drops ready before an unaccepted beat requires a different investigation.
- id: SA-ATTN-INT8-Q64-004
  title: V response data is driven before the read-address transfer advances the reader
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - axi_read_address_handshake
    - behavioral_memory_driver
  status: validated
  error_family: verification_harness_and_oracle
  error_type: INVALID_STIMULUS
  subtype: read_response_started_before_address_acceptance
  stage: value_stage_unit_test
  tool: Vivado XSim
  failing_layer: testbench_memory_response_driver
  symptom_signatures:
  - Fatal V reader backpressure at beat zero while the reader is still in state two.
  preconditions:
  - >-
    The testbench observes v_arvalid and begins V response data without waiting through the rising-edge address
    handshake.
  - The test memory's address-ready condition allows that next edge to accept the request.
  action_trace:
  - step: 1
    status: observed_action
    action: Added beat number and reader state to the failure message and reran the failing case.
    observation_or_result: The failure was specifically beat zero in the pre-response reader state.
  - step: 2
    status: observed_action
    action: >-
      Inserted an intervening posedge after checking the address request and before the negedge that starts
      the response loop.
    observation_or_result: The reader advanced through the address handshake before the first response beat.
  - step: 3
    status: observed_action
    action: Reran the value-stage numerical test without changing its RTL.
    observation_or_result: The 64x128 causal-context test passed all 512 output beats.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Began V response stimulus after seeing the address-valid indication but before the accepting edge.
    result: v_rready was still low for beat zero.
  rejected_by_evidence: []
  root_cause:
  - >-
    The behavioral memory driver skipped the address-acceptance event required before the reader entered its
    receive state.
  resolution:
    actions:
    - In this always-address-ready test environment, wait through the accepting posedge before driving V data.
    - >-
      In a general backpressured memory model, wait for an actual ARVALID && ARREADY handshake rather than
      assuming one elapsed edge is sufficient.
  validation:
  - evidence: >-
      PASS value stage 64x128 causal context, 512 output beats appeared after the testbench-only phase correction.
    regression_scope: One value-stage causal numerical case and V read-burst response sequence.
    limitation: >-
      This case does not establish coverage of arbitrary AXI address backpressure; the historical driver used
      the stated readiness assumption.
  derived_guidance: []
  reuse_rule:
  - >-
    Reuse when the response driver outruns address acceptance. A current-address handshake followed by persistent
    low response readiness needs a separate state-machine diagnosis.
- id: SA-ATTN-INT8-Q64-005
  title: A BRAM-banked softmax test assumes capture readiness immediately after start
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - banked_row_state
    - initialization_latency
    - ready_valid_input
  status: validated
  error_family: verification_harness_and_oracle
  error_type: INVALID_STIMULUS
  subtype: missing_wait_for_capture_ready_after_start
  stage: banked_softmax_unit_test
  tool: Vivado XSim
  failing_layer: testbench_input_driver
  symptom_signatures:
  - Fatal capture backpressure at beat zero appears after replacing flip-flop row state with BRAM banks.
  preconditions:
  - The banked implementation performs preparation before score capture becomes ready.
  - The old testbench sends the first score immediately after deasserting start.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Inspected the banked candidate's first-beat failure and compared the testbench's start-to-capture sequence.
    observation_or_result: The input loop made no allowance for the interface's ready signal during preparation.
  - step: 2
    status: observed_action
    action: Added while (!score_ready) @(negedge clk) before both the ordinary-tile and sloped-score input
      loops.
    observation_or_result: The driver now waited for capture readiness instead of assuming a fixed startup
      latency.
  - step: 3
    status: observed_action
    action: Reran the existing online-state and sloped causal numerical checks.
    observation_or_result: All tile transitions and the sloped row-max/Q16-sum case passed.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Reused the immediate-capture stimulus sequence with the banked implementation.
    result: The first beat was presented while preparation still held score_ready low.
  rejected_by_evidence: []
  root_cause:
  - >-
    The testbench assumed old startup timing instead of honoring the existing readiness contract after the
    memory architecture changed.
  resolution:
    actions:
    - >-
      Wait for score_ready before starting each capture sequence, retaining all per-beat and row-statistic
      checks.
  validation:
  - evidence: >-
      PASS sloped causal scores: row maxima and Q16 sums and ALL TESTS PASSED: one score tile and online normalizer
      state followed the patch.
    regression_scope: >-
      Banked-state softmax unit tests, continuation/rescaling across key tiles, and nonzero sloped causal logits.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Readiness may be legally delayed by a memory preparation phase; adding a tiny settle delay is not a substitute
      for the actual ready handshake.
  reuse_rule:
  - >-
    Apply when an existing ready-valid contract permits preparation latency. If the frozen contract instead
    specifies exact immediate acceptance, investigate an RTL latency violation.
- id: SA-ATTN-INT8-Q64-006
  title: The exp approximation test passes only after its absolute-error bound is widened
  applies_to:
    design_profiles:
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - exchangeable_exp_approximations
    - q0_16_output
    - numerical_error_budget
  status: validation_change_requires_review
  error_family: verification_harness_and_oracle
  error_type: NUMERICAL_ACCEPTANCE_CHANGE
  subtype: approximation_tolerance_relaxed_without_recorded_contract_justification
  stage: standalone_exponential_approximation_test
  tool: Vivado XSim
  failing_layer: numerical_acceptance_criterion
  symptom_signatures:
  - >-
    exp kind two at x=1 returns 65362 against the real-valued reference 65358.794332 and fails the original
    absolute-error bound.
  - The rerun passes after kind two's allowed absolute error is increased from 2.1 to 24.0 output LSB.
  preconditions:
  - >-
    The suite compares direct, bipartite, and piecewise-linear exponent implementations against a floating-point
    reference.
  - An additional relative-error limit of 0.002 is checked only when the expected output is at least 1024.
  action_trace:
  - step: 1
    status: observed_action
    action: Ran the three-implementation test and observed the kind-two error exceed the shared absolute threshold.
    observation_or_result: The first reported error was about 3.206 LSB, above the original 2.1 bound.
  - step: 2
    status: observed_action
    action: >-
      Changed only the kind-two absolute threshold to 24.0, retaining 2.1 for the other implementations and
      the existing conditional relative bound.
    observation_or_result: No corresponding exp-datapath repair appeared in that diff.
  - step: 3
    status: observed_action
    action: Reran the suite with the modified acceptance criterion and added textual Fatal detection to the
      script.
    observation_or_result: >-
      Kind two reported maximum absolute error 14.709855 LSB and maximum checked relative error 0.000756, and
      the modified suite passed.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Tested the original kind-two approximation against the original 2.1-LSB bound.
    result: It failed; the later threshold change did not make that original requirement pass.
  rejected_by_evidence:
  - hypothesis_or_direction: The passing rerun proves the original numerical requirement was repaired.
    evidence: >-
      The observed change widened the allowed error, and the measured maximum 14.709855 LSB still exceeded
      the original 2.1-LSB bound.
  root_cause:
  - >-
    The kind-two approximation and original absolute bound were inconsistent. The supplied record does not
    establish whether the implementation or the original error budget should change.
  resolution:
    actions:
    - >-
      The historical change set the kind-two absolute threshold to 24.0 LSB while retaining the other thresholds;
      no validated repair of the original 2.1-LSB requirement is recorded.
  validation:
  - evidence: >-
      The modified suite passed with kind-two maximum absolute error 14.709855 LSB and checked relative error
      0.000756.
    regression_scope: The tested standalone exp input sweep under the changed threshold.
    limitation: >-
      The transcript contains no independent justification for selecting 24.0 LSB and no proof that the original
      2.1-LSB requirement was satisfied. Do not treat this record as a validated numerical repair.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Preserve which implementation, reference, units, absolute threshold, and conditional relative threshold
      produced a PASS; changing the acceptance criterion changes what was established.
  - status: generalized_rule
    rule: >-
      Establish an independently supported error budget before adopting 24.0 LSB; if 2.1 LSB remains contractual,
      improve or replace the approximation and rerun that original criterion.
  reuse_rule:
  - >-
    Retrieve this case to recognize an unproven tolerance relaxation. Apply the historical threshold only when
    the new design's numerical contract independently supports it; otherwise investigate the approximation.
