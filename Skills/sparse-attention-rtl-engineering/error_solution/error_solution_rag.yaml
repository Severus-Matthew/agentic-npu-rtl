  symptom_signatures:
  - Parser errors point to the second quoted fragment in two split $fatal format messages.
  preconditions:
  - The testbench places adjacent quoted strings without a legal SystemVerilog concatenation expression.
  action_trace:
  - step: 1
    status: observed_action
    action: Inspected the two failing diagnostic statements rather than changing descriptor logic.
    observation_or_result: Both statements used C-style adjacent string literals.
  - step: 2
    status: observed_action
    action: Supplied single complete format strings for the tag-mismatch and descriptor-count diagnostics.
    observation_or_result: Recompilation succeeded and 1007 packer cases passed.
  failed_or_insufficient_attempts: []
  rejected_by_evidence:
  - hypothesis_or_direction: Descriptor ordering or packer datapath behavior caused the compiler failure.
    evidence: >-
      The compiler stopped on testbench format-string syntax before simulation; unchanged packer RTL passed
      after that syntax repair.
  root_cause:
  - The generated testbench used invalid string syntax in its own failure messages.
  resolution:
    actions:
    - >-
      Merge each split format message into one legal literal while preserving arguments and assertion predicates.
  validation:
  - evidence: FOUR-PAIR PACKER TESTS PASSED 1007 and ALL FOUR-PAIR DESCRIPTOR TESTS PASSED at 422880 ns.
    regression_scope: Seven directed and 1000 random descriptor cases including ordering, backpressure, and
      batch boundaries.
  derived_guidance: []
  reuse_rule:
  - >-
    Apply to parser diagnostics at adjacent diagnostic literals; do not change assertion meaning merely because
    its reporting string is malformed.
- id: SA-BF16-COMPACT-007
  title: Preserving equivalent registers fixes fanout that physical fanout optimization did not change
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - replicated_pe_control
    - synthesis_register_merging
  status: validated
  error_family: physical_timing_and_evidence
  error_type: CONTROL_FANOUT_BOTTLENECK
  subtype: equivalent_control_register_merging
  stage: sixteen_mac_tile_implementation
  tool: Vivado synthesis and physical optimization
  failing_layer: synthesis_control_distribution
  symptom_signatures:
  - Shared out_valid, exponent, and out_last control nets each drive more than 800 loads.
  - AggressiveFanoutOpt leaves fanout and routed slack unchanged.
  preconditions:
  - Sixteen similar PEs allow synthesis to merge equivalent control registers.
  - The baseline already passes 250 MHz setup; the issue is control locality and scaling margin.
  action_trace:
  - step: 1
    status: observed_action
    action: Compared baseline and AggressiveFanoutOpt reports under the same implementation flow.
    observation_or_result: >-
      Both had 6232 LUTs, WNS +0.523 ns, and out_valid fanout 834; the attempted physical optimization made
      no change.
  - step: 2
    status: observed_action
    action: Supplied a separate synthesis experiment with -keep_equivalent_registers while preserving other
      settings.
    observation_or_result: The original and modified flows could be compared without a simultaneous hierarchy
      or clock change.
  - step: 3
    status: observed_action
    action: Compared the routed fanout, setup/hold, resources, and routing status.
    observation_or_result: >-
      Maximum listed internal fanout fell to 81, WNS rose to +0.986 ns, LUTs rose by 54, and registers rose
      by 354; DSP count stayed 16 and routing errors stayed zero.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Applied AggressiveFanoutOpt to the original merged-control implementation.
    result: It left the relevant fanout and WNS unchanged.
  rejected_by_evidence: []
  root_cause:
  - >-
    Shared control created by equivalent-register merging drove many PE loads; preserving local registers removed
    the observed shared-net bottleneck in this experiment.
  resolution:
    actions:
    - Preserve the comparison baseline and test -keep_equivalent_registers as a targeted synthesis-flow change.
    - >-
      Validate actual post-route locality, resource cost, and both setup and hold before adopting that flow
      for the tile.
  validation:
  - evidence: >-
      Routed WNS improved from +0.523 to +0.986 ns; internal fanout fell from 834 to 81, with WHS +0.045 ns
      and zero route errors.
    regression_scope: Controlled sixteen-MAC implementation comparison at 250 MHz.
    limitation: >-
      External reset fanout remained 1563; this result did not solve full-system reset distribution or prove
      larger-array timing.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      Apply synthesis preservation only where measured merging harms locality; its extra registers are a tradeoff,
      not a universal requirement.
  reuse_rule:
  - >-
    Reuse when equivalent PE control is merged and physical fanout optimization is ineffective. Associative
    lookup depth, arithmetic depth, or failed RAM inference require different repairs.
- id: SA-BF16-COMPACT-008
  title: A serial configuration map removes the combinational compactor setup path but hold remains open
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - mask_compaction
    - registered_lane_mapping
    - ooc_io_timing
  status: partially_validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_FAILURE
  subtype: combinational_mask_routing_and_unresolved_input_hold
  stage: compacted_two_block_tile_implementation
  tool: Vivado route_design
  failing_layer: mask_routing_architecture_and_io_timing
  symptom_signatures:
  - The combinational compactor uses 24706 LUTs and has setup WNS -4.252 ns at 250 MHz.
  - A registered mapper fixes setup but retains negative hold slack under the original input constraints.
  preconditions:
  - Mask-dependent mapping and operand routing sit directly in the constrained data path.
  - The original minimum input delay is zero and some hold paths begin at mask input ports.
  action_trace:
  - step: 1
    status: observed_action
    action: Localized the failed setup path to mask-dependent compaction rather than the previously timed BF16
      MACs.
    observation_or_result: The combined design had 1198 setup failures and a large LUT increase.
  - step: 2
    status: observed_action
    action: >-
      Supplied an eight-cycle configuration mapper that registered lane-source tags before shallow operand
      selection.
    observation_or_result: >-
      The routed implementation fell to 9502 LUTs and setup WNS became +0.854 ns, but 596 hold endpoints failed
      at WHS -0.080 ns.
  - step: 3
    status: observed_action
    action: Tried post-route hold optimization from the saved checkpoint and rechecked minimum-delay paths.
    observation_or_result: >-
      Failing hold endpoints fell to 546, yet worst hold stayed -0.080 ns and representative paths ran directly
      from mask ports into mapper registers.
  - step: 4
    status: observed_action
    action: >-
      Identified the zero-minimum input constraint and proposed classifying input versus internal hold paths
      before any constraint change.
    observation_or_result: >-
      The supplied results did not establish justified upstream minimum arrival delays or full hold closure
      for this checkpoint.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used combinational mask compaction on the per-cycle operand path.
    result: Setup missed by 4.252 ns and used 24706 LUTs.
  - status: attempted_insufficient
    action: Applied the recorded post-route hold repair.
    result: It reduced endpoint count at an extra 50 LUTs but did not improve worst hold slack.
  rejected_by_evidence: []
  root_cause:
  - >-
    Deep mask-routing logic caused the setup failure. The residual reported hold problem was on direct input
    paths under the OOC minimum-delay model; whether the real upstream interface would satisfy it remained
    unproven.
  resolution:
    actions:
    - >-
      Move mask-to-lane mapping into a registered configuration phase and keep per-cycle operand selection
      shallow.
    - Preserve the original constraints and report setup recovery separately from residual hold failures.
  validation:
  - evidence: >-
      The registered mapper recovered setup to +0.854 ns and reduced LUTs to 9502; the subsequent hold experiment
      still reported WHS -0.080 ns and 546 failing endpoints.
    regression_scope: Functional compaction tests and OOC setup/hold/resource reports.
    limitation: This is a validated setup repair and incomplete hold investigation, not a full timing or board
      pass.
  derived_guidance:
  - status: generalized_rule
    rule: >-
      A diagnostic minimum-delay sensitivity experiment cannot justify changing the interface contract merely
      to remove a red timing report.
  - status: generalized_rule
    rule: >-
      Obtain actual upstream timing evidence or a justified interface boundary before declaring the remaining
      hold problem resolved.
  reuse_rule:
  - >-
    Apply the mapping split when the measured setup path is combinational compaction; transfer any hold conclusion
    only after matching clock and I/O timing assumptions.
- id: SA-BF16-COMPACT-009
  title: Registering pager flags helps but page-mask routing needs its own stage
  applies_to:
    design_profiles:
