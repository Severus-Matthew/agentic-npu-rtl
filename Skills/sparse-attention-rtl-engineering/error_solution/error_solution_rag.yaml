- id: SA-QUEST-BFP8-Q64-P64-006
  title: Replay stimulus marks a vector end instead of every BFP8 group end
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - grouped_dot_product
    - per_group_last_marker
    - systolic_skew
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: wrong_group_boundary_stimulus
  stage: bfp8_replay
  tool: Vivado XSim
  failing_layer: testbench_stimulus
  symptom_signatures:
  - Metadata load completes but the test times out waiting for all 64 outputs.
  - last is asserted only at the 64th operand.
  preconditions:
  - The compute architecture processes eight groups of eight values.
  - The interface uses last as an end-of-group marker.
  action_trace:
  - step: 1
    status: observed_action
    action: Compared the stalled replay task with the grouped compute interface after metadata loading completed.
    observation_or_result: a_left_last[r]=(t==r+63) and b_top_last[c]=(t==c+63) marked only the final operand
      of the whole vector.
  - step: 2
    status: observed_action
    action: >-
      Supplied replacement predicates ((t-r)%8==7) for A and ((t-c)%8==7) for B within the existing valid windows.
    observation_or_result: Each row or column now marked all eight groups while retaining the original systolic
      skew.
  - step: 3
    status: observed_action
    action: >-
      Supplied diagnostics for valid beats, last markers, group completions, and result_done before further
      RTL changes.
    observation_or_result: >-
      The next run completed the first tile and then failed the separate Result completion flags not cleared
      reset check.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Generated last only at t=r+63 for A and t=c+63 for B in the replay testbench.
    result: Metadata loaded, but the first tile timed out waiting for 64 completed results.
  rejected_by_evidence:
  - hypothesis_or_direction: The timeout proves metadata reuse is broken.
    evidence: >-
      The first computation had not completed, so the test had not yet reached the reuse phase; correcting
      boundary stimulus enabled the first tile to finish.
  root_cause:
  - >-
    The replay stimulus marked only the global vector endpoint. The accumulator required a boundary pulse after
    every eight-element group.
  resolution:
    actions:
    - Generate last on every eighth valid operand for each skewed A row and B column.
    - >-
      Recheck all group boundaries and the 64 completed outputs before diagnosing later metadata-reuse or reset
      failures.
  validation:
  - evidence: >-
      After the stimulus correction, the next run completed the first tile and exposed a separate reset-state
      bug.
    regression_scope: input framing, all eight group completions, and 64 outputs
  derived_guidance:
  - status: generalized_rule
    rule: Do not change compute RTL until legal boundary stimulus is demonstrated.
  reuse_rule:
  - >-
    Reuse when a grouped interface defines last per subgroup and stimulus marks only the global vector end.
    A new downstream failure after progress resumes must be classified separately rather than folded into this
    case.
- id: SA-QUEST-BFP8-Q64-P64-007
  title: Tile reset and full clear leave different stale compute-completion state
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - metadata_reuse
    - compute_state_reset
    - distinct_tile_and_full_clear
  status: validated
  error_family: rtl_protocol_and_lifecycle
  error_type: RESET_ERROR
  subtype: stale_completion_state
  stage: reusable_metadata_compute_tile
  tool: Vivado XSim
  failing_layer: rtl_reset_wiring
  symptom_signatures:
  - 'Fatal: Result completion flags not cleared'
  - 'Fatal: Full clear did not reset computation'
  - A second computation sees stale result_done state.
  preconditions:
  - Metadata-preserving tile_reset and full clear have intentionally different metadata semantics.
  - The inner compute core's clear input alone does not reset every completion register.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Followed the replay run past its corrected first tile and inspected why result_done remained set after
      tile_reset.
    observation_or_result: The nested compute core's clear path did not clear every completion register.
  - step: 2
    status: observed_action
    action: Supplied compute reset gating for tile_reset while retaining metadata-loaded flags for reuse.
    observation_or_result: >-
      Distinct second-tile tests passed, but the later full-clear controller test still reported Full clear
      did not reset computation.
  - step: 3
    status: observed_action
    action: >-
      Compared .rst_n(rst_n && !tile_reset) with .clear(clear || tile_reset) and supplied .rst_n(rst_n && !clear
      && !tile_reset).
    observation_or_result: Both reset classes reached compute completion state, while only clear invalidated
      metadata flags.
  - step: 4
    status: observed_action
    action: >-
      Requested the controller rerun with distinct tiles, invalid-start checks, full invalidation, reserved
      metadata rejection, and reload.
    observation_or_result: >-
      The user log showed tile results 16384 and 98304, preserved metadata reuse, full-clear invalidation,
      successful reload, and ALL QUEST BFP8 CONTROLLER TESTS PASSED.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Relied on the compute core's clear input alone to clear completion state.
    result: result_done remained stale after reset.
  - status: attempted_insufficient
    action: Added tile_reset to compute reset but initially omitted clear from that reset expression.
    result: Reuse advanced, but the full-clear controller test still failed.
  rejected_by_evidence: []
  root_cause:
  - >-
    Reset wiring treated tile_reset and clear inconsistently. Both had to reset compute state, while only full
    clear was allowed to invalidate preserved metadata.
  resolution:
    actions:
    - In this wrapper, include both clear and tile_reset in the compute core's active-low reset expression.
    - Keep the separate metadata logic so tile_reset preserves validity and clear invalidates it.
    - Rerun distinct-data reuse and full-clear/reload tests while retaining completion-clear assertions.
  validation:
  - evidence: >-
      The controller log reported both distinct tile values, metadata reuse, full-clear invalidation, reserved-kind
      rejection, successful reload computation, and final PASS at 6591 ns.
    regression_scope: >-
      First compute, metadata-preserving reset, distinct second compute, full invalidation, premature starts,
      reserved metadata kind, and reload.
  derived_guidance:
  - status: generalized_rule
    rule: Do not remove the completion-clear assertion.
  - status: generalized_rule
    rule: Do not erase reusable metadata on tile_reset unless the architecture contract requires it.
  - status: generalized_rule
    rule: >-
      The recorded combinational reset expression is specific to this wrapper; check reset generation and safe
      deassertion before transferring it to a system-level asynchronous reset network.
  reuse_rule:
  - >-
    Reuse when reset classes intentionally differ for metadata but both must clear compute completion. Do not
    merge reset semantics until state ownership is explicitly partitioned.
- id: SA-QUEST-BFP8-Q64-P64-008
  title: Ping-pong operand arrays map to flip-flops instead of LUTRAM
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - ping_pong_operand_storage
    - distributed_ram_target
  status: validated
  error_family: memory_structure_and_inference
  error_type: MEMORY_ERROR
  subtype: lost_distributed_ram_inference
  stage: ping_pong_operand_storage
  tool: Vivado synthesis and implementation
  failing_layer: rtl_memory_structure
  symptom_signatures:
  - LUTRAM utilization drops to zero.
  - Feeder register count rises to approximately 16,911.
  - Total registers rise to 25,935 and setup WNS becomes -0.207 ns.
  preconditions:
  - The design intends 16,384 bits of two-bank operand storage.
  - Storage is described as multidimensional arrays accessed across generated write/read processes.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Compared the passing ping-pong simulation with routed resource reports and the earlier dual-write baseline.
    observation_or_result: LUTRAM fell from 160 LUTs to zero, total registers rose to 25935, and WNS fell to
      -0.207 ns at 300 MHz.
  - step: 2
    status: observed_action
    action: Examined hierarchical utilization and calculated the intended operand capacity.
    observation_or_result: >-
      The feeder alone used 16911 registers, close to the 16384 data bits required by two banks, two matrices,
      eight lanes, 64 entries, and eight bits.
  - step: 3
    status: observed_action
    action: >-
      Supplied a simple 64x8 RAM module with one synchronous writer, asynchronous read, ram_style=distributed,
      and no array reset; instantiated it 32 times.
    observation_or_result: Validity remained in the parent controller and the access structure became explicit
      to synthesis.
  - step: 4
    status: observed_action
    action: Requested simulation, synthesis inference checks, and route under the existing 300 MHz constraint.
    observation_or_result: >-
      The corrected design used 320 LUTRAM LUTs, only 267 feeder registers, +0.108 ns setup slack, +0.031 ns
      hold slack, 64 DSPs, and zero routing errors.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used the original multidimensional ping-pong storage description despite passing functional simulation.
    result: >-
      Physical implementation inferred no LUTRAM, expanded storage into registers, and missed the 300 MHz setup
      target.
  rejected_by_evidence:
  - hypothesis_or_direction: The new cost is mainly an unavoidable increase in GEMM arithmetic.
    evidence: >-
      DSP usage remained 64, while hierarchy localized the extra registers to the operand feeder; explicit
      RAM instances reduced that feeder cost.
  root_cause:
  - >-
    The intended operand data mapped to flip-flops rather than distributed RAM. The multidimensional, cross-process
    access structure was the working inference explanation; the explicit per-lane memory rewrite restored RAM
    inference and removed the register growth.
  resolution:
    actions:
    - Restructure storage as 32 explicit 64x8 single-write distributed-RAM instances.
    - Use synchronous writes, asynchronous reads, and an appropriate ram_style attribute.
    - Keep validity/reset state outside the memory so the RAM array itself needs no reset.
    - Verify inference from utilization and hierarchy reports, not from source attributes alone.
  validation:
  - evidence: >-
      Corrected implementation used 320 LUTRAM LUTs, reduced feeder registers to 267, achieved +0.108 ns WNS
      and +0.031 ns WHS at 300 MHz, retained 64 DSPs, and had zero routing errors.
    regression_scope: feeder simulation, integrated tile simulation, synthesis, placement, and routing
  derived_guidance:
  - status: generalized_rule
    rule: Do not accept functional simulation as proof of physical memory inference.
  - status: generalized_rule
    rule: Do not guess the resource mapping from RTL declarations.
  reuse_rule:
  - >-
    Apply when functional storage behavior is correct but utilization shows the intended FPGA memory primitive
    is absent. Require post-synthesis hierarchy and routed timing as proof; source attributes alone are insufficient.
- id: SA-QUEST-BFP8-Q64-P64-009
  title: Exact-text testbench generation fails on guard shape and occurrence counts
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - generated_scaled_regression
    - exact_text_transformation
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: brittle_exact_text_generator
  stage: query64_regression_generation
  tool: Python generator
  failing_layer: testbench_generator
  symptom_signatures:
  - 'Expected one occurrence, found 0: ''if (merged_seen >= 3)'''
  - 'Expected one occurrence, found 2: ''starts_seen != 24 ||'''
  preconditions:
  - A larger testbench is generated by exact text replacement from a verified smaller testbench.
  - Source formatting or repeated guards differ from the generator's assumptions.
  action_trace:
  - step: 1
    status: observed_action
    action: Compared the generator's expected if (merged_seen >= 3) fragment with the verified source guard.
    observation_or_result: >-
      The source continued with || and metadata predicates, so the complete string ending in a closing parenthesis
      did not exist.
  - step: 2
    status: observed_action
    action: Supplied matching fragments ending in || for both merged_seen and work_seen, then requested regeneration.
    observation_or_result: Regeneration progressed but exposed a second failure because starts_seen != 24 ||
      appeared twice.
  - step: 3
    status: observed_action
    action: >-
      Inspected the two start-count checks and supplied an expected count of two for that specific replacement
      while preserving one for other bounds.
    observation_or_result: >-
      Both completion and duplicate-execution guards could be updated to 192 without removing strict generator
      checks.
  - step: 4
    status: observed_action
    action: >-
      Requested regeneration, inspection of both starts_seen != 192 guards, and the complete generated regression.
    observation_or_result: >-
      The user log passed 256 page scores, 128 selections, 24 descriptors, 192 GEMMs, 12288 numerical results,
      8192 valid scores, and 4096 masked outputs.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Assumed merged_seen and work_seen guards ended immediately after their numeric bounds.
    result: Generation aborted with zero matches for the expected closed guard.
  - status: attempted_insufficient
    action: Corrected the guard fragments but retained a one-occurrence assumption for every replacement.
    result: Generation then aborted on the two legitimate starts_seen guards.
  rejected_by_evidence:
  - hypothesis_or_direction: The scorer, Top-K selector, page union, or GEMM caused the failure.
    evidence: >-
      Python generation aborted before the testbench existed or RTL simulation began; repairing generator assumptions
      enabled the unchanged hardware regression to pass.
  root_cause:
  - >-
    Exact string replacement encoded fragile assumptions about formatting and occurrence counts. One guard
    continued with additional conditions, while another correctly appeared twice.
  resolution:
    actions:
    - Match the real guard prefix including continued || conditions for merged_seen and work_seen.
    - >-
      Require exactly two replacements for the duplicated starts_seen bound and exactly one for the other expected
      fragments.
    - Regenerate and inspect both 192-start guards before compiling and running the generated test.
  validation:
  - evidence: >-
      The generated 64-query regression passed 256 page scores, 128 selections, 24 descriptors, 192 GEMMs,
      12,288 numerical outputs, 8,192 valid scores, and 4,096 masked outputs.
    regression_scope: generator self-check plus full 64-query regression
  derived_guidance:
  - status: generalized_rule
    rule: Do not modify scorer, selector, union, or GEMM RTL for a generator transformation failure.
  - status: generalized_rule
    rule: Do not replace all occurrences without first proving how many are expected.
  reuse_rule:
  - >-
    Reuse for generated tests whose exact transformation count is part of correctness. A generator must fail
    closed when the source shape changes.
- id: SA-QUEST-BFP8-Q64-P64-010
  title: Delayed group-done checks count legal work from the next group
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - eight_group_scheduler
    - delayed_completion_pulse
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: delayed_completion_pulse_race
  stage: query64_group_scheduler
  tool: Vivado XSim
  failing_layer: testbench_monitor
  symptom_signatures:
  - Early groups pass, then exact page/dimension counts fail at group_done_pulse.
  - The next group's first page may already have been accepted when completion is sampled.
  preconditions:
  - group_done_pulse occurs one cycle after the final result handshake.
  - The scheduler may accept next-group work during that interval.
  action_trace:
  - step: 1
    status: observed_action
    action: Examined why groups zero and one passed but the completion check for group two failed.
    observation_or_result: >-
      group_done_pulse followed the final accepted result by one cycle, during which a next-group candidate
      could already advance cumulative counters.
  - step: 2
    status: observed_action
    action: >-
      Supplied exact page and dimension checks at the first entry into the waiting-for-group-result drain state.
    observation_or_result: Counts were checked before a new group's transfers could contaminate that group's
      expected totals.
  - step: 3
    status: observed_action
    action: >-
      Kept a separate completion-pulse multiplicity check and requested the scheduler regression with backpressure.
    observation_or_result: The suite passed eight groups, 64 rows, 256 pages, 16384 dimensions, and one block-done
      pulse.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Checked exact cumulative per-group totals at the delayed group_done_pulse.
    result: >-
      The next group's first accepted page could already be included, falsely reporting an incorrect completed
      group.
  rejected_by_evidence:
  - hypothesis_or_direction: A mismatched counter necessarily means the scheduler issued an extra illegal page.
    evidence: >-
      The sample occurred after the scheduler was allowed to accept new-group traffic; moving the exact-count
      check to drain entry made the unchanged count requirements pass.
  root_cause:
  - >-
    The monitor compared per-group cumulative counts at a delayed pulse, after the next group was legally allowed
    to advance the counters.
  resolution:
    actions:
    - Check exact cumulative page and dimension totals when the scheduler first enters the drain state.
    - Retain a separate check for completion-pulse count and group limits.
    - Rerun the scheduler and integrated regression with the original exact transfer counts.
  validation:
  - evidence: >-
      Scheduler regression passed eight groups, 64 rows, 256 candidate pages, 16,384 scoring dimensions, one
      block-done pulse, and randomized backpressure.
    regression_scope: standalone 64-query scheduler plus integrated scheduler regression
  derived_guidance:
  - status: generalized_rule
    rule: Do not loosen exact counts or allow an unexplained extra page.
  - status: generalized_rule
    rule: Do not change scheduler RTL before correcting the observation point.
  reuse_rule:
  - >-
    Reuse when a delayed completion indication permits the next transaction to advance cumulative monitors.
    Move exact-count checks to the defining handshake rather than weakening counts.
- id: SA-QUEST-BFP8-Q64-P64-011
  title: A FIFO boundary alone does not close the Top-K-to-page-union path
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - topk_to_page_union
    - 300mhz_ooc
    - associative_control
  status: validated
  error_family: physical_timing_and_evidence
  error_type: TIMING_FAILURE
  subtype: topk_to_page_union_control_path
  stage: query64_physical_implementation
  tool: Vivado route_design
  failing_layer: rtl_control_microarchitecture
  symptom_signatures:
  - Original 64-query top has WNS -1.524 ns and large negative TNS.
  - A two-entry registered FIFO improves WNS only to -1.304 ns.
  - The critical path runs from Top-K selection into associative page-union storage/update logic.
  preconditions:
  - Functional regressions pass.
  - The 300 MHz constraint is real and unchanged.
  - The numerical 64-D GEMM datapath is already verified.
  action_trace:
  - step: 1
    status: observed_action
    action: Routed the functional 64-query baseline and inspected the worst selection-to-page-union path.
    observation_or_result: At the unchanged 300 MHz target, WNS was -1.524 ns and TNS was -3817.489 ns.
  - step: 2
    status: observed_action
    action: >-
      Supplied a two-entry selected-item FIFO boundary and requested functional regression plus a separate
      route.
    observation_or_result: >-
      WNS improved only to -1.304 ns; the new 18-level path started at the FIFO read-pointer register and ended
      at a page-union entry write enable.
  - step: 3
    status: observed_action
    action: >-
      Supplied a short shift-register FIFO head and replaced priority-encoded variable-index union updates
      with parallel entry comparisons and one-hot local writes.
    observation_or_result: >-
      The repair directly removed the measured read-pointer mux and associative-update chain while preserving
      duplicate checks and ready/valid behavior.
  - step: 4
    status: observed_action
    action: Requested focused union tests, the full query64 regression, and another route at the same clock.
    observation_or_result: >-
      WNS reached +0.048 ns with TNS zero, zero failing endpoints, zero routing errors, and 64 DSPs; the worst
      path moved back into BFP8 compute control.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Added only the two-entry registered FIFO boundary.
    result: >-
      WNS improved by 0.220 ns but remained -1.304 ns; failing setup endpoints increased from 8243 to 8601,
      and the union update path remained critical.
  rejected_by_evidence:
  - hypothesis_or_direction: The 64-D GEMM arithmetic needs to be changed to solve this specific timing failure.
    evidence: >-
      The failing path was in FIFO/selection-to-union control; the control rewrite closed timing without changing
      the verified arithmetic.
  root_cause:
  - >-
    The selection-to-union path retained deep control, matching, priority, and variable-indexed update logic
    even after an initial FIFO boundary.
  resolution:
    actions:
    - Replace the FIFO implementation with a short shift-register FIFO that preserves ready/valid semantics.
    - Replace priority/variable-index union writes with parallel comparisons and one-hot local slot updates.
    - Run union-level and full 64-query functional regressions before routing.
    - Preserve the original clock constraint and compare independent implementation checkpoints.
  validation:
  - evidence: >-
      The optimized compute/control top achieved +0.048 ns WNS, TNS 0, zero failing setup endpoints, +0.042
      ns WHS, zero routing errors, 8,276 LUTs, 13,778 registers, 394 LUTRAM LUTs, and 64 DSPs.
    regression_scope: page-union regression, full query64 functional regression, and routed timing
  derived_guidance:
  - status: generalized_rule
    rule: Do not weaken the 300 MHz constraint.
  - status: generalized_rule
    rule: Do not modify the verified GEMM arithmetic without critical-path evidence pointing there.
  - status: generalized_rule
    rule: Do not call improved negative slack timing closure.
  reuse_rule:
  - >-
    Reuse when routed paths point from selection into associative union/update control and a simple register
    boundary still leaves negative slack. Do not transfer the fix to a path dominated by GEMM arithmetic or
    memory routing.
- id: SA-QUEST-BFP8-Q64-P64-012
  title: Compute completion does not free an occupied score BRAM
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - single_score_bram
    - explicit_release
    - job_ready_lifecycle
  status: validated
  error_family: verification_harness_and_oracle
  error_type: TESTBENCH_ERROR
  subtype: incorrect_job_ready_lifecycle_expectation
  stage: integrated_score_bram
  tool: Vivado XSim
  failing_layer: testbench_assertion
  symptom_signatures:
  - 'Fatal: Scheduler counts incorrect: candidates=256 samples=16384 groups=8 blocks=1 busy=0'
  - All printed counters are correct, but the combined condition still fails.
  - The hidden additional check expects job_ready high immediately after compute completion.
  preconditions:
  - The BRAM score block is full and score_storage_block_ready is high.
  - Readback and release have not yet completed.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Expanded the failed combined completion assertion beyond its printed candidate, sample, group, block,
      and busy counters.
    observation_or_result: >-
      Those counters were correct; the additional job_ready==1 expectation came from the earlier compute-only
      testbench.
  - step: 2
    status: observed_action
    action: Compared that expectation with score-buffer ownership after compute, before readback and release.
    observation_or_result: A sealed block containing 8192 scores must keep job_ready low even after job_busy
      drops.
  - step: 3
    status: observed_action
    action: >-
      Supplied a wait for score_storage_block_ready and changed the completion check to require busy low, job_ready
      low, block-ready high, and written_count=8192.
    observation_or_result: >-
      The new check validated occupied storage instead of treating compute completion as permission to overwrite
      it.
  - step: 4
    status: observed_action
    action: Preserved the later job_ready==1 assertion after release and requested BRAM readback regression.
    observation_or_result: >-
      The user log passed all 8192 numerical writes and reads, address mapping, 2729 readback stalls, and clean
      retirement.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Reused the old compute-only completion assertion expecting job_ready immediately after compute.
    result: It falsely rejected correct buffer occupancy in the BRAM-backed design.
  rejected_by_evidence:
  - hypothesis_or_direction: Correct compute counters require RTL to raise job_ready immediately.
    evidence: >-
      Stored scores still owned the single buffer; the full readback-and-release suite passed with readiness
      low before release and high afterward.
  root_cause:
  - >-
    The assertion reused pre-BRAM lifecycle semantics. In the BRAM-backed design, compute completion clears
    job_busy but the occupied score buffer must keep job_ready low until readback and release retire the block.
  resolution:
    actions:
    - Wait for completed-block sealing before testing post-compute storage state.
    - >-
      Require job_busy=0, job_ready=0, score_storage_block_ready=1, and score_storage_written_count=8192 before
      readback/release.
    - Retain the separate post-release job_ready=1 check.
  validation:
  - evidence: >-
      Full BRAM regression passed 8,192 stored and read scores, independent Q/K numerical comparison, page-slot
      addressing, 2,729 readback stalls, and clean block retirement.
    regression_scope: full query64 score generation, writeback, BRAM readback, and release
  derived_guidance:
  - status: generalized_rule
    rule: Do not change RTL to accept a new job while the single score buffer remains occupied.
  - status: generalized_rule
    rule: Do not delete the post-release readiness assertion.
  reuse_rule:
  - >-
    Reuse when compute completion and storage availability are distinct events. The correct ready expectation
    must follow buffer ownership, not the older compute-only lifecycle.
- id: SA-QK-SOFTMAX-Q64-001
  title: Per-row softmax-ready is checked before combinational row selection settles
  applies_to:
    design_profiles:
    - int8_q64_qk_online_softmax_overlap_ooc325
    architecture_traits:
