design_profiles:
- design_id: quest_bfp8_q64_top2_kpage64_score_bram
  family: quest_selected_sparse_qk
  selection: >-
    Query-dependent Top-2 KV-page selection from per-page minimum/maximum K bounds, identified as Quest in
    the session
  query_organization: 64 queries in eight groups of eight
  key_organization: two selected pages per query, 64 K tokens per page
  arithmetic: BFP8-style 8x8x64 systolic QK GEMM with fixed-point score and exponent metadata
  mask_semantics: structural query-row and key-position validity only
  storage: 8192 x 42-bit addressable score BRAM
  functional_boundary: QK score generation, filtering, storage, readback, and release
  excluded_stages:
  - scale by 1/sqrt(d) is not confirmed
  - causal or additive attention mask is not confirmed
  - softmax
  - V multiplication or reduction
  evidence_status:
    functional_simulation: confirmed
    compute_control_300mhz_ooc: confirmed
    final_bram_backed_300mhz_ooc: unverified
- design_id: fixed_stride_int8_q64_kpage64_qk_scores_u55c
  family: fixed_pattern_block_sparse_qk
  selection: Hardware selects resident 64-token K blocks 0,4,8,... by striding HBM block addresses
  query_organization: Dimension-flexible M, tiled in 64-query blocks
  key_organization: Dimension-flexible N, resident 64-token K blocks, one sampled block per 256-token group
  arithmetic: Signed INT8 Q/K with signed INT32 dot-product scores on a logical 64x64 QK array
  mask_semantics: No score, causal, or additive mask in this checkpoint; padded lanes are zero-filled and checked
  storage: Four 256-bit HBM readers and one 256-bit tile-major INT32 score writer
  functional_boundary: Hardware block selection and QK score generation only
  excluded_stages:
  - scale by 1/sqrt(d) or another score-scale stage
  - causal or additive attention mask
  - softmax
  - V read, P-by-V, normalization, or context output
  evidence_status:
    functional_simulation: confirmed
    full_device_325mhz_route: confirmed
    u55c_board_oracle: confirmed
    k_block_size_8_or_16_variant: unverified
- design_id: fixed_pattern_int8_q64_online_attention_u55c
  family: fixed_pattern_block_sparse_online_attention
  selection: Fixed causal schedule over matching contiguous 64-token K/V tiles
  query_organization: 64-query tiles for one attention head
  key_organization: Older summary tiles plus all local causal tiles; K and V tile IDs match
  arithmetic: >-
    INT8 Q/K/V, INT32 QK, experimental /1024 score scale, Q0.16 softmax state, signed 40-bit value accumulation,
    Q8.8 output
  mask_semantics: Causal diagonal masking with fixed block selection
  storage: Bounded tile-local score/probability/V/value state plus four banked row-statistic BRAMs
  functional_boundary: QK, online softmax, sampled V accumulation, normalization, and context output
  excluded_stages:
  - calibrated model-specific quantization and true 1/sqrt(d_head) validation
  - runtime-programmable sparse selection
  - RoPE, multi-head/GQA mapping, and output projection
  - fully overlapped high-throughput scheduling
  evidence_status:
    rtl_regression: confirmed
    original_full_device_325mhz_route: failed
    original_board_oracle_at_296_3mhz: confirmed
    banked_registered_full_device_325mhz_route: confirmed
    banked_registered_u55c_board_oracle: confirmed
- design_id: int8_q64_qk_online_softmax_overlap_ooc325
  family: overlapped_qk_online_softmax_ip
  selection: All-valid synthetic score flow; no integrated sparse scheduler
  query_organization: 64-query tiles across four 16-row groups
  key_organization: 64-key score tiles, three-tile d=128 overlap regression
  arithmetic: 4x4 grid of 16x16 packed-INT8 QK engines plus four eight-lane online-softmax pipelines
  mask_semantics: All-valid in confirmed integration test
  storage: Sixteen score-BRAM bank sets
  functional_boundary: Overlapped QK and online-softmax state only
  excluded_stages:
  - sparse or causal selection and masking
  - calibrated score scale
  - V path and context output
  - CPU, shell, and board integration
  evidence_status:
    three_tile_overlap_simulation: confirmed
    slr0_325mhz_ooc_route: confirmed
    full_device_route: unverified
    board_oracle: unverified
- design_id: centered_window_hls_int8_q64_d64_w16_full_attention_u55c
  family: fixed_token_window_hls_full_attention
  selection: Per-query centered token window j=max(0,i-8)..min(63,i+7)
  query_organization: Fixed 64-token sequence, one 64-channel head
  key_organization: Fixed positional window, 960 allowed pairs out of a 64x64 connectivity matrix
  arithmetic: 16-lane grouped INT8 QK dot product, LUT softmax, fixed-point weighted V, shared output normalization
  mask_semantics: Token-level centered window applied before row-wise softmax
  storage: Full Q/K/V buffered on chip; three 512-bit AXI-MM HBM pointers for Q, combined K/V, and output
  functional_boundary: Complete single-head window attention from HBM input through normalized context output
  excluded_stages:
  - programmable sequence length, head dimension, or window
  - input-dependent or score-dependent sparse selection
  - multi-head, GQA, RoPE, projection, and long-sequence scaling
  - board-measured accelerator-only cycle counter
  evidence_status:
    c_simulation_nine_cases: confirmed
    rtl_cosimulation_nine_cases: confirmed
    full_device_300mhz_route: confirmed
    u55c_board_oracle_six_cases: confirmed
    accelerator_only_board_throughput: unverified
- design_id: bf16_tile16_mask_compaction_paged_qk_predecessor
  family: mask_compacted_bf16_dot_product_substrate
  selection: Two 4x4 output masks compact work onto sixteen MAC lanes; up to 32 active outputs use two passes.
  query_organization: Small 4x4 output tiles; four-pair descriptor and operand-router experiments are related
    variants.
  key_organization: BF16 dot-product reductions with tested length sweeps from 16 through 256.
  arithmetic: >-
    BF16 multiplication and fixed-point/Q31 accumulation; separate FP32 accumulator evaluation was an earlier
    experiment.
  mask_semantics: Compute-lane selection and explicit masked-result metadata, not a completed softmax attention
    mask.
  storage: Registered lane maps, active/pending configuration, and registered page masks.
  functional_boundary: Predecessor arithmetic, sparse compaction, mapping, operand routing, and paged dot-product
    completion.
  excluded_stages:
  - Quest page-bound scoring
  - softmax and V
  - integrated HBM or board attention proof
  evidence_status:
    functional_simulation: confirmed
    paged_setup_250mhz_ooc: confirmed
    paged_hold_with_original_io_constraints: failed
    full_device_or_board: unverified
error_families:
- family_id: tool_and_build_flow
  description: >-
    Simulator, compiler, generator, parser, process-isolation, or build-directory failures outside DUT function.
  first_questions:
  - Which tool and phase emitted the first failure?
  - Did a PASS or completed artifact exist before the failure?
  - Can the same source be reproduced in a clean process and directory?
- family_id: verification_harness_and_oracle
  description: Testbench stimulus, monitor timing, generated-test, assertion expectation, or golden-model failures.
  first_questions:
  - Is the observed event sampled at the contract-defined handshake or edge?
  - Is the expected result independently derived rather than copied from the DUT structure?
  - Does the stimulus obey grouping, last-marker, reset, and lifecycle rules?
- family_id: rtl_protocol_and_lifecycle
  description: Ready/valid, completion visibility, reset, ownership, occupancy, and reuse-state failures in
    RTL.
  first_questions:
  - Which accepted handshake changes ownership or state?
  - Is completion exposed before its payload or snapshot is externally valid?
  - Which state must clear and which metadata is intentionally preserved?
- family_id: memory_structure_and_inference
  description: Logical storage is correct in simulation but maps to the wrong FPGA primitive or ownership structure.
  first_questions:
  - What primitive and capacity does the architecture require?
  - What did synthesis actually infer in hierarchy and utilization reports?
  - Do reset, port, or multidimensional access patterns prevent inference?
- family_id: physical_timing_and_evidence
  description: Routed timing failure, congestion, SLR placement, or incorrect promotion of weak physical evidence.
  first_questions:
  - Is the report OOC, SLR-constrained, full-device, or board-integrated?
  - What is the exact startpoint-to-endpoint family of the worst routed path?
  - Did the proposed change close timing or merely improve negative slack?
- family_id: hls_architecture_and_resources
  description: >-
    HLS scheduling or unrolling creates unintended operator replication, impractical resources, or poor latency.
  first_questions:
  - Which operation was replicated and which loop/directive caused it?
  - Does required throughput justify that replication?
  - Do post-synthesis and routed reports confirm the intended sharing?
records:
- id: SA-QUEST-BFP8-Q64-P64-001
  title: A second XSim run reports a watchdog after functional PASS
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - scripted_xsim_flow
    - bounded_testbench
  status: diagnosed_fix_provided
  error_family: tool_and_build_flow
  error_type: SIMULATION_TIMEOUT
  subtype: duplicate_simulation_run
  stage: fp32_accumulator_verification
  tool: Vivado XSim
  failing_layer: simulation_script
  symptom_signatures:
  - Functional PASS messages and $finish appear before a later watchdog timeout.
  - The Tcl flow invokes launch_simulation and then separately invokes run all.
  preconditions:
  - The first run already reached the intended terminal PASS.
  - The timeout occurs only after the completed run is continued or restarted.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Read the simulation output before the final watchdog and located two passing dot products and $finish
      at 366 ns.
    observation_or_result: Outputs 41200000 and 40200000 matched 10.0 and 2.5 before the later 2 us timeout.
  - step: 2
    status: observed_action
    action: Compared that event order with the Tcl commands launch_simulation followed by run all.
    observation_or_result: The extra run command occurred after the intended test had already terminated.
  - step: 3
    status: observed_action
    action: >-
      Supplied a script change removing the standalone run all command and left the accumulator RTL and testbench
      unchanged.
    observation_or_result: >-
      The conversation then moved to accumulator synthesis; a separate post-edit simulation log was not shown
      for this script repair.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Ran launch_simulation followed by an additional run all in the original script.
    result: A valid functional PASS was followed by a misleading watchdog timeout.
  rejected_by_evidence:
  - hypothesis_or_direction: The accumulator never completed its dot products.
    evidence: Both expected results and the intended $finish were printed before the watchdog.
  root_cause:
  - >-
    launch_simulation had already executed the testbench. A redundant run-all command continued simulation
    after the successful $finish path and eventually triggered the watchdog.
  resolution:
    actions:
    - Remove only the redundant run all command after launch_simulation in the affected flow.
    - Recompile or relaunch as needed to confirm one intended execution terminates at its PASS.
  validation:
  - evidence: The supplied log proves both functional tests passed before the extra run command.
    regression_scope: Two accumulator dot products and their back-to-back separation.
    limitation: >-
      Removal was supplied as the repair; an isolated post-edit script rerun is not present in the incident
      excerpt. Do not describe the script repair as independently rerun here.
  derived_guidance:
  - status: generalized_rule
    rule: Do not change accumulator RTL to cure a post-PASS timeout.
  - status: generalized_rule
    rule: Do not increase the watchdog before checking for duplicate simulation commands.
  - status: generalized_rule
    rule: >-
      This incident does not establish that every launch_simulation flow runs to completion; inspect the actual
      commands and event order.
  reuse_rule:
  - >-
    Reuse only when a complete PASS precedes the timeout and the flow issues a second simulation command. A
    timeout before PASS belongs to a different case.
- id: SA-QUEST-BFP8-Q64-P64-002
  title: Mapper completion is visible before the pending snapshot
  applies_to:
    design_profiles:
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    architecture_traits:
    - double_buffered_configuration
    - captured_completion_snapshot
  status: validated
  error_family: rtl_protocol_and_lifecycle
  error_type: VALID_READY_PROTOCOL_ERROR
  subtype: completion_visible_before_snapshot
  stage: double_buffer_mapper_configuration
  tool: Vivado XSim
  failing_layer: rtl_wrapper
  symptom_signatures:
  - 'Fatal: Pending mapping not ready'
  - cfg_done is high while pending_valid is still low.
  preconditions:
  - cfg_done is combinationally assigned from engine_done.
  - pending_valid is set by a nonblocking assignment on the same completion edge.
  action_trace:
  - step: 1
    status: observed_action
    action: >-
      Traced the failed pending_valid check to combinational cfg_done=engine_done and a clocked pending_valid
      update.
    observation_or_result: The inner engine could advertise done one cycle before the wrapper captured its
      result.
  - step: 2
    status: observed_action
    action: >-
      Supplied a wrapper patch declaring cfg_done as logic, clearing it on reset, and assigning cfg_done<=engine_done
      beside pending snapshot capture.
    observation_or_result: The proposed external completion event now meant that the snapshot had been captured.
  - step: 3
    status: observed_action
    action: Added !engine_done to engine_ready && !pending_valid in cfg_ready.
    observation_or_result: Configuration could not reopen during the engine-done-to-capture gap.
  - step: 4
    status: observed_action
    action: >-
      After a malformed edit caused cfg_ready declaration errors, supplied one complete corrected wrapper and
      a compile-success-gated rerun.
    observation_or_result: The subsequent user log reported ALL DOUBLE-BUFFER MAPPER TESTS PASSED and $finish
      at 590 ns.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Applied the initial wrapper changes incompletely, leaving a redeclared or malformed cfg_ready port.
    result: >-
      xvlog rejected the source; the later stale simulation could not validate the handshake fix. The separate
      stale-snapshot case records this build failure.
  rejected_by_evidence:
  - hypothesis_or_direction: The testbench simply sampled a correct same-cycle completion too early.
    evidence: >-
      cfg_done was directly driven by engine_done while the wrapper only captured pending_valid on the following
      edge; externally visible completion really preceded valid payload.
  root_cause:
  - >-
    The wrapper exposed engine completion one cycle before the completed mapping snapshot became externally
    valid.
  resolution:
    actions:
    - Register cfg_done alongside capture of the pending mapping.
    - Block cfg_ready during the engine_done-to-capture transition.
    - Define completion as “result captured,” not merely “inner engine pulsed done.”
  validation:
  - evidence: User-provided rerun reported ALL DOUBLE-BUFFER MAPPER TESTS PASSED, terminating at 590 ns.
    regression_scope: Initial mapping, overlapping configuration, activation, over-capacity rejection, and
      empty mapping.
  derived_guidance:
  - status: generalized_rule
    rule: Do not weaken the testbench check that completion implies a valid snapshot.
  reuse_rule:
  - >-
    Apply when an inner done pulse and an externally consumable captured result occur on different cycles.
    Do not use when the payload is already stable and valid in the same completion cycle.
- id: SA-QUEST-BFP8-Q64-P64-003
  title: Reserved SystemVerilog words prevent testbench compilation
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    - bf16_tile16_mask_compaction_paged_qk_predecessor
    - fixed_pattern_int8_q64_online_attention_u55c
    architecture_traits:
    - systemverilog_testbench
  status: validated
  error_family: tool_and_build_flow
  error_type: SV_SYNTAX_ERROR
  subtype: reserved_keyword_identifier
  stage: testbench_compilation
  tool: Vivado xvlog
  failing_layer: testbench
  symptom_signatures:
  - keyword 'matches' used in incorrect context
  - syntax error near matches or packed
  - Hardware modules compile before the testbench is rejected.
  - >-
    Parser errors also occurred for local in a scheduler loop and context in a four-pair operand-router testbench.
  preconditions:
  - A testbench local variable is named matches or packed.
  action_trace:
  - step: 1
    status: observed_action
    action: Located the first xvlog diagnostics in testbench identifiers matches and later packed.
    observation_or_result: The hardware modules had been analyzed; testbench parsing failed before numerical
      simulation.
  - step: 2
    status: observed_action
    action: >-
      Supplied identifier renames from matches to match_count and from packed to packed_word, including declarations
      and uses.
    observation_or_result: The reserved-word collisions were removed without changing arithmetic or loader
      behavior.
  - step: 3
    status: observed_action
    action: Requested recompilation and the affected simulation after the rename.
    observation_or_result: >-
      Subsequent row-stream integration passed; the operand-loader log explicitly passed both 64-write loads,
      atomic paired writes, and 37 backpressure stalls.
  - step: 4
    status: observed_action
    action: >-
      Renamed context to tile_ctx in the BF16 router testbench and local to local_tile in the causal scheduler
      testbench.
    observation_or_result: The router passed 1010 cases; the scheduler passed four shape/restart cases including
      640x640x128.
  failed_or_insufficient_attempts: []
  rejected_by_evidence:
  - hypothesis_or_direction: The numerical RTL or descriptor loader caused this failure.
    evidence: xvlog named reserved words in the testbench and simulation had not started.
  root_cause:
  - SystemVerilog reserved words were used as identifiers in testbench code.
  resolution:
    actions:
    - Rename matches to match_count.
    - Rename packed to packed_word.
    - >-
      For the additional observed collisions, rename context to tile_ctx and local to local_tile, updating
      all affected references.
    - Recompile before changing any hardware module.
  validation:
  - evidence: >-
      The operand-loader rerun reported ALL QUEST GEMM8 OPERAND LOADER TESTS PASSED after packed was renamed;
      the row-stream path also passed subsequent integration after matches was renamed.
    regression_scope: >-
      Compilation, row-stream integration, and two-bank loader simulation including partial masks, atomic writes,
      and backpressure.
  - evidence: >-
      The four-pair router reported 1010 tests passed; the causal scheduler reported four shapes passed and
      ALL TESTS PASSED: causal fixed-pattern addresses and restart.
    regression_scope: Four-pair operand routing and causal fixed-pattern scheduler compile/simulation.
  derived_guidance:
  - status: generalized_rule
    rule: Do not attribute a parser error isolated to the testbench to the accelerator datapath.
  reuse_rule:
  - >-
    Reuse for parser failures whose first diagnostic names a reserved identifier in verification code. Do not
    infer a datapath defect until compilation reaches RTL semantics.
- id: SA-QUEST-BFP8-Q64-P64-004
  title: BFP8 testbench expectation contains only the final group contribution
  applies_to:
    design_profiles:
    - quest_bfp8_q64_top2_kpage64_score_bram
    architecture_traits:
    - bfp8_group_accumulation
    - independent_numeric_oracle
  status: validated
  error_family: verification_harness_and_oracle
  error_type: REFERENCE_MODEL_ERROR
  subtype: golden_accumulator_overwrite
  stage: bfp8_row_accumulation
  tool: Vivado XSim plus independent Python reference
  failing_layer: testbench_reference
  symptom_signatures:
  - got = -17408, expected = -43520
  - Expected value equals only the final group's contribution.
  - >-
    Integrated tile mode 0 reported got=16384 expected=2048, again matching only one of eight expected group
    contributions.
  preconditions:
  - Multiple group partial sums should be accumulated into one output.
  - The DUT value equals the manually summed and scaled contributions.
  action_trace:
  - step: 1
    status: observed_action
    action: Reconstructed the eight mode-0 column-0 partials as 51, -68, 85, -102, 119, -136, 153, and -170.
    observation_or_result: >-
      Their sum was -68; alignment from exponent 0 to base -8 multiplied it by 256, giving the DUT value -17408.
  - step: 2
    status: observed_action
    action: Compared the failing expectation -43520 with the individual aligned terms.
    observation_or_result: >-
      -43520 equaled only -170*256, identifying an incorrect expected-value path rather than evidence against
      this DUT result.
  - step: 3
    status: observed_action
    action: >-
      Supplied an independent Python generator implementing signed power-of-two alignment and ties-to-even
      rounding across three modes and eight columns.
    observation_or_result: >-
      The generator formed independent fixed-point-plus-exponent reference words instead of reading DUT results.
  - step: 4
    status: observed_action
    action: Supplied a separate testbench variant consuming the generated reference and requested a fresh run.
    observation_or_result: The user log reported Python-reference PASS for all three modes, each with 64 events
      and eight outputs.
  - step: 5
    status: observed_action
    action: >-
      For the later integrated-tile recurrence, accumulated aligned_group terms into a scalar expected_total,
      assigned golden[r][c] once, and added the mode-0 16384*(r+1)*(c+1) sanity check.
    observation_or_result: >-
      Three integrated modes then passed 64 outputs each; a subsequent independent Python-reference run also
      passed all 192 outputs.
  failed_or_insufficient_attempts:
  - status: attempted_insufficient
    action: Used the original SystemVerilog expected-value calculation for the multi-group comparison.
    result: It produced -43520 instead of the independently reconstructed -17408 and falsely rejected the DUT.
  rejected_by_evidence:
  - hypothesis_or_direction: The DUT dropped or miscomputed the group accumulation in the reported case.
    evidence: >-
      The manual full sum equaled the DUT value, and the subsequent independent Python-reference suite passed
      all three modes.
  root_cause:
  - >-
    The original SystemVerilog expected-value path did not represent the full multi-group sum. For the failing
    case its value equaled the last term; the exact expression-sizing or update mechanism inside that path
    was not isolated further.
  resolution:
    actions:
    - >-
      Generate independent expected values from all eight partials and their exponents, with explicit signed
      alignment and rounding.
    - Check the row-lane output and exponent against those generated vectors in a separate testbench variant.
    - >-
      Preserve the arithmetic RTL because independent reconstruction supports the observed DUT result for the
      failing case.
    - >-
      In the integrated-tile recurrence, replace compound accumulation into the multidimensional golden array
      with scalar expected_total, then assign the finished value once and check a closed-form mode-0 result.
  validation:
  - evidence: >-
      User log reported BFP8 ROW LANE PYREF PASS for modes 0, 1, and 2, followed by ALL QUEST BFP8 ROW LANE
      PYREF TESTS PASSED.
    regression_scope: >-
      Three row-lane numerical modes, 64 events and eight outputs per mode, including exponent variation and
      cancellation patterns.
    limitation: >-
      The successful independent replacement does not prove the precise internal cause of the old SystemVerilog
      oracle's last-term result.
  - evidence: >-
      Integrated SystemVerilog and independent Python-reference logs each reported all three tile modes passing,
      64 outputs per mode.
    regression_scope: 192 complete tile outputs and their 1536 group contributions.
    limitation: >-
      The scalar rewrite and independent model establish the reference correction, not a general XSim defect
      in all multidimensional array updates.
  derived_guidance:
  - status: generalized_rule
    rule: Do not change RTL merely to match a demonstrably incorrect expected value.
  - status: generalized_rule
    rule: Do not reuse DUT implementation structure as the replacement oracle.
  reuse_rule:
  - >-
    Use when the DUT matches an independently reconstructed multi-group sum and the expected value matches
    only one group. Preserve independence between the replacement oracle and DUT implementation structure.
