  subtype: mask_pager_to_router_combinational_chain
  stage: paged_tile_implementation
  tool: Vivado route_design
  failing_layer: pagination_control_microarchitecture
  symptom_signatures:
  - The functional paged design misses 250 MHz setup by 0.866 ns.
  - Registering total_active and needs_second_pass improves WNS only to -0.617 ns.
  preconditions:
  - Pager logic influences status and lane routing through a long mask-dependent dependency chain.
  - The two-pass execution and mask semantics have passing functional tests.
  action_trace:
  - step: 1
    status: observed_action
    action: Inspected the original mask-through-pager-to-background_ready path and preserved the functional
      baseline.
    observation_or_result: Original WNS was -0.866 ns with 165 failing setup endpoints.
  - step: 2
    status: observed_action
    action: >-
      Supplied direct population-count calculation and registered total_active and needs_second_pass at acceptance.
    observation_or_result: WNS improved to -0.617 ns with 35 failures, but a 19-level mask-to-router lane_last
