taxonomy:
  name: accelerator_operation_features
  version: "0.9"
  scope: code-owned functional-coverage concepts for supported integer accelerator operations
  rules:
    - A recognized operation kind must implement every baseline concept for its family.
    - Baseline concepts may not be removed or renamed by the Verifier.
    - Optional concepts are selected only when their behavior exists in the frozen contract.
    - Family verification properties guide the independent golden checker, not synthetic coverage hits.
    - Unsupported operations or concepts use a contract-local Verifier extension; they are not advertised as code-owned catalog features.
    - Operation samples represent transactions actually submitted to and checked against the DUT.
    - Feature groups organize selectable leaf concepts and never create their own assertions, coverage bins, or stimulus targets.
    - Select applicable group children in feature_extensions using their stable leaf names; arithmetic.post_operations defines execution order.

feature_defaults:
  assertion: {checker: central_golden_equivalence}
  coverage: {sampler: canonical_classifier}
  stimulus: {strategy: canonical_discriminating_stimuli}

families:
  softmax:
    aliases: [softmax, fixed_point_softmax, row_softmax]
    optional_concepts: {}
    baseline_concepts: [dimensions, row_patterns, mask_patterns, exp_domain, normalization]
    starter_bins:
      dimensions: [fixed_shape]
      row_patterns: [uniform, tied_maximum, unique_maximum, all_negative, mixed_sign, distinct_rows]
      mask_patterns: [unmasked, singleton, partial, fully_masked, masked_maximum, masked_zero]
      exp_domain: [zero_delta, interior_delta, last_lut_entry, clipped_delta]
      normalization: [zero_probability, positive_probability, rounded_division, exact_division, tiny_positive_weight_zero]
    feature_groups: {}
  block_matmul:
    aliases: [block_matmul, blocked_qk, indexed_block_matmul]
    optional_concepts: {}
    baseline_concepts: [dimensions, block_selection, block_mapping, block_tails, block_reduction]
    starter_bins:
      dimensions: [fixed_shape]
      block_selection: [empty, singleton, multiple, nonadjacent, reordered, duplicate]
      block_mapping: [origin, nonzero_row, nonzero_column, distinct_tile_results]
      block_tails: [full_tile, row_tail, column_tail, reduction_tail]
      block_reduction: [single_chunk, multiple_chunks, zero_result, positive_result, negative_result, nonzero_reduction_tail]
    feature_groups: {}
  matrix_multiply:
    aliases: [gemm, matmul, matrix_multiply, matrix_multiplication, tensor_gemm]
    optional_concepts: {}
    baseline_concepts: [dimensions, operand_values, accumulation]
    starter_bins:
      dimensions: [fixed_shape]
      operand_values: [zero, positive, negative, minimum, maximum]
      accumulation: [ordinary, positive_boundary, negative_boundary, positive_overflow, negative_overflow]
    feature_groups:
      post_processing:
        description: Code-owned post-reduction GEMM stages selected individually when present in the contract.
        optional_concepts:
          bias:
            applies_when: Exactly one per-output-column integer bias vector is added.
            starter_bins: [zero_bias, positive_bias, negative_bias, minimum_bias, maximum_bias]
          activation:
            applies_when: A ReLU post-operation is declared in the arithmetic DAG.
            starter_bins: [negative_region, zero_region, positive_region]
          quantization:
            applies_when: One per-tensor fixed-point affine requantization stage is declared in the arithmetic DAG.
            starter_bins: [exact, rounded, nonzero_zero_point, negative_saturation, positive_saturation]
  sparse_attention:
    aliases: [sparse_attention, masked_sparse_attention, integer_sparse_attention]
    optional_concepts: {}
    baseline_concepts: [dimensions, operand_values, sparsity_patterns, attention_scores, stage_handoffs, output_values]
    starter_bins:
      dimensions: [fixed_shape]
      operand_values: [zero, positive, negative, minimum, maximum]
      sparsity_patterns: [empty_row, singleton_row, partial_row, dense_row]
      attention_scores: [zero_score, positive_score, negative_score]
      stage_handoffs: [qk_to_scale_forwarded, active_mask_preserved, inactive_mask_zeroed, normalization_bypass_forwarded, value_reduction_consumed]
      output_values: [zero_output, positive_output, negative_output]
    feature_groups: {}
  attention_qk:
    aliases: [attention_qk, qk_score, query_key_score]
    optional_concepts: {}
    baseline_concepts: [dimensions, operand_values, accumulation, attention_scores]
    starter_bins:
      dimensions: [fixed_shape]
      operand_values: [zero, positive, negative, minimum, maximum]
      accumulation: [ordinary, positive_boundary, negative_boundary, positive_overflow, negative_overflow, cancellation, mixed_sign_terms, last_term_only]
      attention_scores: [zero_score, positive_score, negative_score]
    feature_groups: {}
  attention_scale:
    aliases: [attention_scale, scaled_attention_score, qk_scale]
    optional_concepts: {}
    baseline_concepts: [dimensions, score_values, rounding, scaled_values, attenuation]
    starter_bins:
      dimensions: [fixed_shape]
      score_values: [zero, positive, negative, minimum, maximum]
      rounding: [exact, positive_fraction_discarded, negative_fraction_discarded]
      scaled_values: [zero_scaled, positive_scaled, negative_scaled]
      attenuation: [zero_preserved, magnitude_reduced]
    feature_groups: {}
  attention_mask:
    aliases: [attention_mask, masked_attention_score, binary_attention_mask]
    optional_concepts: {}
    baseline_concepts: [dimensions, score_values, mask_values, sparsity_patterns, masked_values, mask_effects]
    starter_bins:
      dimensions: [fixed_shape]
      score_values: [zero, positive, negative, minimum, maximum]
      mask_values: [drop, keep]
      sparsity_patterns: [empty_row, singleton_row, partial_row, dense_row]
      masked_values: [zero_masked, positive_masked, negative_masked]
      mask_effects: [active_score_preserved, inactive_nonzero_zeroed, active_zero_preserved, inactive_positive_zeroed, inactive_negative_zeroed]
    feature_groups: {}
