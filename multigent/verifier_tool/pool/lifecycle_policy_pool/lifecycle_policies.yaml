schema_version: 1

# Architect selects one value per policy. These are supported behaviors, not
# feature/checker names. Only implemented choices belong in this pool.
policies:
  job_acceptance:
    description: Event that accepts a command and starts a legal job.
    choices:
      valid_ready_handshake: Accept command content on a sampled VALID and READY transfer.
      control_plane_sequence: Job starts when the declared control_plane_sequence.job_start action list completes (e.g. a register-mapped ap_start write on a black-box AXI4-Lite control interface). No opcode/legal_values concept exists for this source.
  job_overlap:
    description: Whether another command can be accepted while a job is active.
    choices:
      single_inflight: Do not accept another command until the current job retires or aborts.
  busy_behavior:
    description: Meaning of the bound busy signal, when one is present.
    choices:
      tracks_active_job: Busy equals job-active state from the sample after acceptance through retirement.
  completion_style:
    description: Shape of the bound completion indication, when one is present.
    choices:
      pulse: Completion lasts exactly one sampled cycle.
      control_plane_sequence: No dedicated completion signal exists; completion is observed only through the declared control_plane_sequence.job_complete poll, per job_acceptance=control_plane_sequence.
  completion_timing:
    description: Timing relative to the final accepted result or memory write response.
    choices:
      next_cycle_after_retirement: Completion appears in the next sampled cycle after final retirement.
      observed_via_poll: Completion is confirmed only at the granularity of a back-to-back register poll, not an exact cycle -- the RTL's completion wire is internal (a black box from the verification boundary) and only reachable by repeatedly reading a control register. Structurally weaker than next_cycle_after_retirement by construction, never a substitute for it when a real completion signal exists.
  illegal_command_behavior:
    description: Handling of an accepted command outside the declared legal-value set.
    choices:
      error_without_start: Do not start a job; assert the bound error signal if present.
  error_style:
    description: Shape and clearing rule of the bound error indication, when one is present.
    choices:
      pulse: Error lasts exactly one sampled cycle.
      sticky_until_reset: Once asserted, error remains high until reset.
  error_timing:
    description: Timing after an accepted illegal command, invalid pointer, or failing memory response.
    choices:
      next_cycle_after_error_event: Error appears in the next sampled cycle after the error event.
  reset_behavior:
    description: Disposition of in-flight work when reset is active.
    choices:
      abort_inflight: Discard pending work, clear lifecycle state, and start a new accounting epoch.
