design:
  name: u04_protocol_heavy
  description: Minimal hand-authored ready/valid GEMM (M=1,K=4,N=1) with bias-add
    then ReLU, no memory-mapped transport at all -- a verifier_tool benchmark fixture
    independent of the HLS Golden AXI4 fixture, built to qualify the ready_valid protocol
    profile and the valid_ready_handshake/pulse lifecycle policy choices. Frozen extension
    benchmark u04_protocol_heavy with 4 unknown features.
operations:
- name: gemm
  kind: arithmetic
  coverage_family: matrix_multiply
  coverage_family_source: catalog
  features:
  - dimensions
  - operand_values
  - accumulation
  - post_processing
  feature_extensions:
  - bias
  - activation
  semantics: Y = relu(sum_k A[k]*B[k] + bias), exact s16 product, wrapping s16 accumulator.
  inputs:
  - A_matrix
  - B_matrix
  - bias_vector
  outputs:
  - Y_matrix
  arithmetic:
    classifier_profile: integer_matrix_multiply
    product_data_type: s16
    accumulator_data_type: s16
    accumulator_initialization: 0
    reduction_dimensions:
    - K
    reduction_order: increasing_declared_reduction_coordinate
    reduction_conversion: wrap_twos_complement_after_each_add
    post_operations:
      biased:
        kind: bias_add
        depends_on:
        - accumulator
        data_object: bias_vector
        broadcast_dimensions:
        - N
      activated:
        kind: relu
        depends_on:
        - biased
    post_output: activated
    bias_conversion: wrap_twos_complement_after_add
    result_data_type: s16
    result_conversion: wrap_twos_complement
  lifecycle_policy:
    job_acceptance: valid_ready_handshake
    job_overlap: single_inflight
    busy_behavior: tracks_active_job
    completion_style: pulse
    completion_timing: next_cycle_after_retirement
    illegal_command_behavior: error_without_start
    error_style: pulse
    error_timing: next_cycle_after_error_event
    reset_behavior: abort_inflight
data_types:
- name: s8
  role: signed 8-bit GEMM operand
  width_bits: 8
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: n/a
  rounding_semantics: n/a
- name: s16
  role: signed 16-bit product/accumulator/bias/result
  width_bits: 16
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: wrap_twos_complement
  rounding_semantics: n/a
data_objects:
- name: A_matrix
  role: left_operand_matrix
  data_type: s8
  dimensions:
  - M
  - K
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - K
    description: One element per transfer, K varies fastest.
- name: B_matrix
  role: right_operand_matrix
  data_type: s8
  dimensions:
  - K
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - K
    - N
    description: One element per transfer, N varies fastest.
- name: bias_vector
  role: per_output_column_bias
  data_type: s16
  dimensions:
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - N
    description: One element per transfer.
- name: Y_matrix
  role: result_matrix
  data_type: s16
  dimensions:
  - M
  - N
  producer: gemm
  consumers:
  - external
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - N
    description: One element per transfer.
dimensions:
- name: M
  semantic: GEMM row count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
- name: K
  semantic: GEMM reduction depth
  minimum: 4
  maximum: 4
  runtime_configurable: false
  bound_parameter: ''
- name: N
  semantic: GEMM column count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
parameters: []
compute:
  organization: sequential streaming load/compute/store FSM
storage: []
pipeline:
  stages: load_a -> load_b -> load_bias -> output
control:
  style: single ready/valid command channel, valid_ready_handshake
reset:
  synchronous: true
  active_low: true
  behavior: aborts any in-flight job
latency_model:
  exact: false
  note: No exact cycle count promised.
architectural_invariants:
- Exactly one GEMM job may be in flight at a time.
open_assumptions: []
verification_extensions:
- id: protocol.exact_two_cycle_backpressure
  domain: protocol
  feature_name: exact_two_cycle_backpressure
  target:
    scope: channel
    name: y
  semantics:
    summary: Observe a transfer stalled for exactly two complete cycles.
    trigger: VALID is asserted and READY becomes low.
    required_behavior:
    - Content stays stable and READY recovers on the third sample.
    end_condition: The transfer is accepted after exactly two stalled cycles.
    forbidden_behavior:
    - The scenario is credited at any other stall length.
  reason: The built-in protocol pool does not represent this exact behavior.
  parameters:
    stall_cycles: 2
  required_observations:
  - name: valid
    kind: signal
    description: Frozen-contract evidence required for valid.
  - name: ready
    kind: signal
    description: Frozen-contract evidence required for ready.
  - name: payload
    kind: signal
    description: Frozen-contract evidence required for payload.
  related_builtin_features:
  - channel.y.stall_stability
  match:
    tags:
    - source: builtin
      name: handshake
    required_roles:
    - valid
    - ready
    - payload
    required_semantic_classes: []
    required_protocol_profiles:
    - ready_valid
- id: protocol.backpressure_duty_cycle
  domain: protocol
  feature_name: backpressure_duty_cycle
  target:
    scope: channel
    name: y
  semantics:
    summary: Measure the fraction of valid cycles spent under backpressure.
    trigger: An output transaction first asserts VALID.
    required_behavior:
    - Count valid cycles and stalled valid cycles until acceptance.
    end_condition: The transfer is accepted.
    forbidden_behavior:
    - Idle cycles are included in the ratio.
  reason: The built-in protocol pool does not represent this exact behavior.
  parameters:
    window_cycles: 16
  required_observations:
  - name: valid
    kind: signal
    description: Frozen-contract evidence required for valid.
  - name: ready
    kind: signal
    description: Frozen-contract evidence required for ready.
  related_builtin_features:
  - channel.y.stall_stability
  match:
    tags:
    - source: builtin
      name: handshake
    required_roles:
    - valid
    - ready
    required_semantic_classes: []
    required_protocol_profiles:
    - ready_valid
- id: protocol.post_reset_first_transfer_deadline
  domain: protocol
  feature_name: post_reset_first_transfer_deadline
  target:
    scope: channel
    name: y
  semantics:
    summary: The first legal output transfer after reset must occur within a declared
      window.
    trigger: Reset is released and a legal job is accepted.
    required_behavior:
    - Observe the first accepted output within twenty cycles.
    end_condition: The first output is accepted or the deadline expires.
    forbidden_behavior:
    - A pre-reset or unaccepted output satisfies the deadline.
  reason: The built-in protocol pool does not represent this exact behavior.
  parameters:
    maximum_cycles: 20
  required_observations:
  - name: valid
    kind: signal
    description: Frozen-contract evidence required for valid.
  - name: ready
    kind: signal
    description: Frozen-contract evidence required for ready.
  related_builtin_features:
  - channel.y.handshake_arrival_order
  match:
    tags:
    - source: builtin
      name: handshake
    required_roles:
    - valid
    - ready
    required_semantic_classes: []
    required_protocol_profiles:
    - ready_valid
- id: lifecycle.error_recovery_window
  domain: lifecycle
  feature_name: error_recovery_window
  target:
    scope: operation
    name: gemm
  semantics:
    summary: A clean legal job can be accepted within six cycles after an error pulse.
    trigger: The operation error signal is observed.
    required_behavior:
    - Drive and accept a clean legal job within six cycles.
    end_condition: The recovery job is accepted or the deadline expires.
    forbidden_behavior:
    - The original failing job is mistaken for recovery.
  reason: The built-in lifecycle pool does not represent this exact behavior.
  parameters:
    maximum_cycles: 6
  required_observations:
  - name: error
    kind: signal
    description: Frozen-contract evidence required for error.
  - name: command_accept
    kind: event
    description: Frozen-contract evidence required for command_accept.
  related_builtin_features:
  - lifecycle.gemm.illegal_command_errors_without_start
