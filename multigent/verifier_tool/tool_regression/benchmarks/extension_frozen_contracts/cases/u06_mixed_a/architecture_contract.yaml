design:
  name: u06_mixed_a
  description: Minimal hand-authored ready/valid GEMM (M=1,K=4,N=1) with bias-add
    then ReLU, no memory-mapped transport at all -- a verifier_tool benchmark fixture
    independent of the HLS Golden AXI4 fixture, built to qualify the ready_valid protocol
    profile and the valid_ready_handshake/pulse lifecycle policy choices. Frozen extension
    benchmark u06_mixed_a with 6 unknown features.
operations:
- name: gemm
  kind: arithmetic
  coverage_family: matrix_multiply
  coverage_family_source: catalog
  features:
  - dimensions
  - operand_values
  - accumulation
  - post_processing
  feature_extensions:
  - bias
  - activation
  semantics: Y = relu(sum_k A[k]*B[k] + bias), exact s16 product, wrapping s16 accumulator.
    Then apply triple_plus_one(value) = value * 3 + 1. Then apply negative_shift(value)
    = value - 17.
  inputs:
  - A_matrix
  - B_matrix
  - bias_vector
  outputs:
  - Y_matrix
  arithmetic:
    classifier_profile: integer_matrix_multiply
    product_data_type: s16
    accumulator_data_type: s16
    accumulator_initialization: 0
    reduction_dimensions:
    - K
    reduction_order: increasing_declared_reduction_coordinate
    reduction_conversion: wrap_twos_complement_after_each_add
    post_operations:
      biased:
        kind: bias_add
        depends_on:
        - accumulator
        data_object: bias_vector
        broadcast_dimensions:
        - N
      activated:
        kind: relu
        depends_on:
        - biased
      triple_plus_one:
        kind: llm_defined
        depends_on:
        - activated
        formula: value * 3 + 1
      negative_shift:
        kind: llm_defined
        depends_on:
        - triple_plus_one
        formula: value - 17
    post_output: negative_shift
    bias_conversion: wrap_twos_complement_after_add
    result_data_type: s16
    result_conversion: wrap_twos_complement
  lifecycle_policy:
    job_acceptance: valid_ready_handshake
    job_overlap: single_inflight
    busy_behavior: tracks_active_job
    completion_style: pulse
    completion_timing: next_cycle_after_retirement
    illegal_command_behavior: error_without_start
    error_style: pulse
    error_timing: next_cycle_after_error_event
    reset_behavior: abort_inflight
data_types:
- name: s8
  role: signed 8-bit GEMM operand
  width_bits: 8
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: n/a
  rounding_semantics: n/a
- name: s16
  role: signed 16-bit product/accumulator/bias/result
  width_bits: 16
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: wrap_twos_complement
  rounding_semantics: n/a
data_objects:
- name: A_matrix
  role: left_operand_matrix
  data_type: s8
  dimensions:
  - M
  - K
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - K
    description: One element per transfer, K varies fastest.
- name: B_matrix
  role: right_operand_matrix
  data_type: s8
  dimensions:
  - K
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - K
    - N
    description: One element per transfer, N varies fastest.
- name: bias_vector
  role: per_output_column_bias
  data_type: s16
  dimensions:
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - N
    description: One element per transfer.
- name: Y_matrix
  role: result_matrix
  data_type: s16
  dimensions:
  - M
  - N
  producer: gemm
  consumers:
  - external
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - N
    description: One element per transfer.
dimensions:
- name: M
  semantic: GEMM row count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
- name: K
  semantic: GEMM reduction depth
  minimum: 4
  maximum: 4
  runtime_configurable: false
  bound_parameter: ''
- name: N
  semantic: GEMM column count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
parameters: []
compute:
  organization: sequential streaming load/compute/store FSM
storage: []
pipeline:
  stages: load_a -> load_b -> load_bias -> output
control:
  style: single ready/valid command channel, valid_ready_handshake
reset:
  synchronous: true
  active_low: true
  behavior: aborts any in-flight job
latency_model:
  exact: false
  note: No exact cycle count promised.
architectural_invariants:
- Exactly one GEMM job may be in flight at a time.
open_assumptions: []
verification_extensions:
- id: protocol.bounded_ready_recovery
  domain: protocol
  feature_name: bounded_ready_recovery
  target:
    scope: channel
    name: a
  semantics:
    summary: DUT-owned operand-A READY must recover within seven cycles after A VALID
      is presented and a legal command opens the input channel.
    trigger: While the DUT is idle and A READY is low, the test presents and holds
      A VALID with stable payload, then issues a legal command and observes its accepted
      handshake.
    required_behavior:
    - Monitor A READY concurrently before issuing the command; after the command handshake
    - A READY is observed within seven sampled cycles while A VALID remains asserted.
    end_condition: The A transfer is accepted or the seventh post-command cycle expires;
      deassert A VALID only after its handshake.
    forbidden_behavior:
    - READY remains low for eight sampled cycles.
  reason: The built-in protocol pool does not represent this exact behavior.
  parameters:
    maximum_cycles: 7
  required_observations:
  - name: valid
    kind: signal
    description: Frozen-contract evidence required for valid.
  - name: ready
    kind: signal
    description: Frozen-contract evidence required for ready.
  related_builtin_features:
  - channel.a.stall_stability
  match:
    tags:
    - source: builtin
      name: handshake
    required_roles:
    - valid
    - ready
    required_semantic_classes: []
    required_protocol_profiles:
    - ready_valid
- id: protocol.transfer_gap_limit
  domain: protocol
  feature_name: transfer_gap_limit
  target:
    scope: channel
    name: y
  semantics:
    summary: Consecutive output transfers must be separated by at most five cycles.
    trigger: One output transfer is accepted while another output remains pending.
    required_behavior:
    - The next output transfer is accepted within five cycles.
    end_condition: The next transfer is accepted or the limit expires.
    forbidden_behavior:
    - A pending transfer waits more than five cycles.
  reason: The built-in protocol pool does not represent this exact behavior.
  parameters:
    maximum_gap_cycles: 5
  required_observations:
  - name: valid
    kind: signal
    description: Frozen-contract evidence required for valid.
  - name: ready
    kind: signal
    description: Frozen-contract evidence required for ready.
  related_builtin_features:
  - channel.y.handshake_states
  match:
    tags:
    - source: builtin
      name: handshake
    required_roles:
    - valid
    - ready
    required_semantic_classes: []
    required_protocol_profiles:
    - ready_valid
- id: lifecycle.busy_watchdog_observation
  domain: lifecycle
  feature_name: busy_watchdog_observation
  target:
    scope: operation
    name: gemm
  semantics:
    summary: Observe whether an accepted job remains busy for twelve sampled cycles.
    trigger: A legal command is accepted and busy becomes asserted.
    required_behavior:
    - Count consecutive busy cycles and record the twelve-cycle threshold.
    end_condition: The job retires, resets, errors, or reaches twelve busy cycles.
    forbidden_behavior:
    - The observation weakens built-in lifecycle checkers.
  reason: The built-in lifecycle pool does not represent this exact behavior.
  parameters:
    threshold_cycles: 12
  required_observations:
  - name: busy
    kind: signal
    description: Frozen-contract evidence required for busy.
  related_builtin_features:
  - lifecycle.gemm.busy_tracks_active_job
- id: lifecycle.reset_recovery_window
  domain: lifecycle
  feature_name: reset_recovery_window
  target:
    scope: operation
    name: gemm
  semantics:
    summary: A clean legal job can start within five cycles after reset release.
    trigger: Reset is released after aborting or idling the operation.
    required_behavior:
    - Accept one clean command within five cycles.
    end_condition: The recovery command is accepted or the deadline expires.
    forbidden_behavior:
    - Pre-reset pending work is treated as the recovery job.
  reason: The built-in lifecycle pool does not represent this exact behavior.
  parameters:
    maximum_cycles: 5
  required_observations:
  - name: reset_release
    kind: event
    description: Frozen-contract evidence required for reset_release.
  - name: command_accept
    kind: event
    description: Frozen-contract evidence required for command_accept.
  related_builtin_features:
  - lifecycle.gemm.reset_aborts_pending_job
