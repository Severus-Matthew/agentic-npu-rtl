design:
  name: post_processing_tiny_gemm
  description: Minimal hand-authored ready/valid GEMM (M=1,K=4,N=1) with bias-add,
    ReLU, and affine requantization to int8, no memory-mapped transport -- a verifier_tool
    benchmark fixture built specifically to qualify the operation_bin accumulation
    boundary/overflow bins and the full post_processing.{bias,activation,quantization}
    bin set, none of which any other fixture in this pool declares.
operations:
- name: gemm
  kind: arithmetic
  coverage_family: matrix_multiply
  coverage_family_source: catalog
  features:
  - dimensions
  - operand_values
  - accumulation
  - post_processing
  feature_extensions:
  - bias
  - activation
  - quantization
  semantics: Y = relu(quantize(sum_k A[k]*B[k] + bias)), exact s16 product, wrapping
    s16 accumulator, scale_multiplier=1, scale_shift=4, zero_point=5, s8 result. Quantize
    before relu (not after) so a negative biased accumulator can still reach affine_quantize's
    negative_saturation bin; relu then guarantees a non-negative final s8 result.
  inputs:
  - A_matrix
  - B_matrix
  - bias_vector
  outputs:
  - Y_matrix
  arithmetic:
    classifier_profile: integer_matrix_multiply
    product_data_type: s16
    accumulator_data_type: s16
    accumulator_initialization: 0
    reduction_dimensions:
    - K
    reduction_order: increasing_declared_reduction_coordinate
    reduction_conversion: wrap_twos_complement_after_each_add
    post_operations:
      biased:
        kind: bias_add
        depends_on:
        - accumulator
        data_object: bias_vector
        broadcast_dimensions:
        - N
      quantized:
        kind: affine_quantize
        depends_on:
        - biased
        scale_multiplier: 1
        scale_shift: 4
        zero_point: 5
        data_type: s8
        rounding: nearest_ties_to_even
        saturation: clamp
        granularity: per_tensor
      activated:
        kind: relu
        depends_on:
        - quantized
    post_output: activated
    bias_conversion: wrap_twos_complement_after_add
    result_data_type: s8
    result_conversion: exact
  lifecycle_policy:
    job_acceptance: valid_ready_handshake
    job_overlap: single_inflight
    busy_behavior: tracks_active_job
    completion_style: pulse
    completion_timing: next_cycle_after_retirement
    illegal_command_behavior: error_without_start
    error_style: pulse
    error_timing: next_cycle_after_error_event
    reset_behavior: abort_inflight
data_types:
- name: s8
  role: signed 8-bit GEMM operand and quantized result
  width_bits: 8
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: n/a
  rounding_semantics: n/a
- name: s16
  role: signed 16-bit product/accumulator/bias
  width_bits: 16
  signed: true
  representation: twos_complement
  conversion_semantics: n/a
  overflow_semantics: wrap_twos_complement
  rounding_semantics: n/a
data_objects:
- name: A_matrix
  role: left_operand_matrix
  data_type: s8
  dimensions:
  - M
  - K
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - K
    description: One element per transfer, K varies fastest.
- name: B_matrix
  role: right_operand_matrix
  data_type: s8
  dimensions:
  - K
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - K
    - N
    description: One element per transfer, N varies fastest.
- name: bias_vector
  role: per_output_column_bias
  data_type: s16
  dimensions:
  - N
  producer: external
  consumers:
  - gemm
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - N
    description: One element per transfer.
- name: Y_matrix
  role: result_matrix
  data_type: s8
  dimensions:
  - M
  - N
  producer: gemm
  consumers:
  - external
  external: true
  serialization:
    kind: dense_tensor
    index_order:
    - M
    - N
    description: One element per transfer.
dimensions:
- name: M
  semantic: GEMM row count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
- name: K
  semantic: GEMM reduction depth
  minimum: 4
  maximum: 4
  runtime_configurable: false
  bound_parameter: ''
- name: N
  semantic: GEMM column count
  minimum: 1
  maximum: 1
  runtime_configurable: false
  bound_parameter: ''
parameters: []
compute:
  organization: sequential streaming load/compute/store FSM
storage: []
pipeline:
  stages: load_a -> load_b -> load_bias -> output
control:
  style: single ready/valid command channel, valid_ready_handshake
reset:
  synchronous: true
  active_low: true
  behavior: aborts any in-flight job
latency_model:
  exact: false
  note: No exact cycle count promised.
architectural_invariants:
- Exactly one GEMM job may be in flight at a time.
open_assumptions: []
