clock: clk
reset: rst_n
channels:
- name: cmd
  direction: input
  protocol_profile: ready_valid
  data_objects: []
  ordering: one command
  framing: one beat
- name: a
  direction: input
  protocol_profile: ready_valid
  data_objects:
  - A_matrix
  ordering: declared dimension order
  framing: exact tensor
- name: b
  direction: input
  protocol_profile: ready_valid
  data_objects:
  - B_matrix
  ordering: declared dimension order
  framing: exact tensor
- name: bias
  direction: input
  protocol_profile: ready_valid
  data_objects:
  - bias_vector
  ordering: declared dimension order
  framing: exact tensor
- name: y
  direction: output
  protocol_profile: ready_valid
  data_objects:
  - Y_matrix
  ordering: declared dimension order
  framing: exact tensor
signals:
- name: clk
  role: clock
  semantic_class: null
  channel: null
  direction: input
  width: 1
  signed: false
  semantic: Free-running clock.
  reset_value: '0'
- name: rst_n
  role: reset
  semantic_class: null
  channel: null
  direction: input
  width: 1
  signed: false
  semantic: Synchronous active-low reset.
  reset_value: '0'
- name: cmd_valid
  role: valid
  semantic_class: null
  channel: cmd
  direction: input
  width: 1
  signed: false
- name: cmd_ready
  role: ready
  semantic_class: null
  channel: cmd
  direction: output
  width: 1
  signed: false
- name: cmd_op
  role: payload
  semantic_class: command
  channel: cmd
  direction: input
  width: '1'
  signed: false
  semantic: legal only 1'd1
- name: a_valid
  role: valid
  semantic_class: null
  channel: a
  direction: input
  width: 1
  signed: false
- name: a_ready
  role: ready
  semantic_class: null
  channel: a
  direction: output
  width: 1
  signed: false
- name: a_data
  role: payload
  semantic_class: data
  channel: a
  direction: input
  width: '8'
  signed: true
- name: b_valid
  role: valid
  semantic_class: null
  channel: b
  direction: input
  width: 1
  signed: false
- name: b_ready
  role: ready
  semantic_class: null
  channel: b
  direction: output
  width: 1
  signed: false
- name: b_data
  role: payload
  semantic_class: data
  channel: b
  direction: input
  width: '8'
  signed: true
- name: bias_valid
  role: valid
  semantic_class: null
  channel: bias
  direction: input
  width: 1
  signed: false
- name: bias_ready
  role: ready
  semantic_class: null
  channel: bias
  direction: output
  width: 1
  signed: false
- name: bias_data
  role: payload
  semantic_class: data
  channel: bias
  direction: input
  width: '16'
  signed: true
- name: y_valid
  role: valid
  semantic_class: null
  channel: y
  direction: output
  width: 1
  signed: false
- name: y_ready
  role: ready
  semantic_class: null
  channel: y
  direction: input
  width: 1
  signed: false
