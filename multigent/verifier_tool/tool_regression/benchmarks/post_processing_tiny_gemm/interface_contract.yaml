  width: 1
  signed: false
- name: err
  role: error
  semantic_class: null
  channel: null
  direction: output
  width: 1
  signed: false
global_handshake_rules: 'Every VALID/READY pair follows standard ready/valid stability:
  once asserted, VALID and its payload hold stable until the paired READY active edge.
  All producer VALIDs are held low throughout active reset.'
