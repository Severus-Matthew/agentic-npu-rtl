global_handshake_rules: AXI4 channels obey AXI4; Wishbone events are defined by protocol_semantics.
protocol_semantics:
- name: wishbone_b4_pipelined
  description: Wishbone B4 pipelined request and registered response behavior at the audited slave boundary.
  protocol_groups: [wishbone]
  clock: {signal: i_clk, edge: rising}
  events:
  - {name: request_presented, expression: i_wb_cyc && i_wb_stb, description: A source presents a request.}
  - {name: request_ready, expression: '!o_wb_stall', description: The bridge can accept a request.}
  - {name: request_accepted, expression: request_presented && request_ready, description: A request is accepted on this edge.}
  - {name: request_stalled, expression: request_presented && !request_ready, description: A presented request is backpressured.}
  - {name: write_request_stalled, expression: request_stalled && i_wb_we, description: A stalled write request must retain write data.}
  - {name: response_success, expression: i_wb_cyc && o_wb_ack, description: One accepted request retires successfully.}
  - {name: response_error, expression: i_wb_cyc && o_wb_err, description: One accepted request retires with an error.}
  - {name: response_completed, expression: response_success || response_error, description: Exactly one response terminates a request.}
  - {name: cycle_cancelled, expression: '!i_wb_cyc', description: Dropping CYC cancels the visible source cycle.}
  transactions:
  - name: wishbone_request
    channel: wb_request
    presented_event: request_presented
    ready_event: request_ready
    accepted_event: request_accepted
    stalled_event: request_stalled
    completed_event: response_completed
    success_event: response_success
    error_event: response_error
    content_signals: [i_wb_we, i_wb_addr, i_wb_data, i_wb_sel]
    stable_while_stalled: true
    stability_rules:
    - id: request_control
      while_event: request_stalled
      signals: [i_wb_stb, i_wb_we, i_wb_addr, i_wb_sel]
    - id: write_data
      while_event: write_request_stalled
      signals: [i_wb_data]
    source_drive:
      presented_assignments:
      - {signal: i_wb_cyc, value: 1}
      - {signal: i_wb_stb, value: 1}
      idle_assignments:
      - {signal: i_wb_cyc, value: 0}
      - {signal: i_wb_stb, value: 0}
      post_accept_assignments:
      - {signal: i_wb_cyc, value: 1}
      - {signal: i_wb_stb, value: 0}
      driven_fields: [i_wb_we, i_wb_addr, i_wb_data, i_wb_sel]
      completion_mode: wait_for_all_completions
  flow_control:
    maximum_outstanding: 64
    ordering: oldest_outstanding
    in_order: true
  cancellation:
    supported: true
    trigger_event: cycle_cancelled
    pending_behavior: flush
  custom_rules:
  - id: axi_translation_and_read_lane
    description: Check fixed AXI IDs, byte-address translation, saved read-lane association, and returned read data.
    required_observations: [transaction_trace, cycle_trace]
    extension_request_id: protocol.p01_wishbone_axi_translation_residuals
  - id: abort_flush_and_read_data_association
    description: Check returned read-data association and suppression of stale source-visible responses after reset or cycle cancellation.
    required_observations: [transaction_trace, cycle_trace]
    extension_request_id: protocol.p01_wishbone_axi_translation_residuals
protocol_event_relations:
- id: axi_read_response_to_wishbone_completion
  description: A transferred AXI read response produces its registered Wishbone completion on the following cycle.
  clock: {signal: i_clk, edge: rising}
  cause:
    kind: standard_channel_transfer
    protocol_group: axi
    protocol_channel: read_data
  effect:
    kind: protocol_event
    profile: wishbone_b4_pipelined
    event: response_completed
  minimum_latency_cycles: 1
  maximum_latency_cycles: 1
  ordering: fifo
  maximum_outstanding: 64
  unmatched_effect: ignore
  require_effect_before_test_end: true
  cancellation:
    event:
      kind: protocol_event
      profile: wishbone_b4_pipelined
      event: cycle_cancelled
    pending_behavior: flush
- id: axi_write_response_to_wishbone_completion
  description: A transferred AXI write response produces its registered Wishbone completion on the following cycle.
  clock: {signal: i_clk, edge: rising}
  cause:
    kind: standard_channel_transfer
    protocol_group: axi
    protocol_channel: write_response
  effect:
    kind: protocol_event
    profile: wishbone_b4_pipelined
    event: response_completed
  minimum_latency_cycles: 1
  maximum_latency_cycles: 1
  ordering: fifo
  maximum_outstanding: 64
  unmatched_effect: ignore
  require_effect_before_test_end: true
  cancellation:
    event:
      kind: protocol_event
      profile: wishbone_b4_pipelined
      event: cycle_cancelled
    pending_behavior: flush
source_boundary:
  top: wbm2axisp
  target: rtl/wbm2axisp.v
  binding_status: audited_default_parameters
