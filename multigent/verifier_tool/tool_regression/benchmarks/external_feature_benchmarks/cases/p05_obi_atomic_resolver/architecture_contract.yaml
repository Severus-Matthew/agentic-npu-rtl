verification_extensions:
- id: protocol.p05_obi_atomic_operation_resolution
  domain: protocol
  feature_name: obi_atomic_operation_resolution
  target:
    scope: interface
    name: interface
  semantics:
    summary: Verify obi atomic operation resolution exactly as implemented by the
      pinned upstream design.
    trigger: A legal source-level transaction or job begins.
    required_behavior:
    - Observe and check the externally visible obi atomic operation resolution behavior.
    - Preserve every reusable built-in protocol, lifecycle, and operation check that
      applies.
    end_condition: The corresponding response, retirement, or terminal state is observed.
    forbidden_behavior:
    - Credit the feature without observing the required RTL boundary evidence.
    - Replace an unsupported behavior with an inferred built-in behavior.
  reason: obi_atomic_operation_resolution is intentionally absent from the current
    verifier_tool pools.
  required_observations:
  - name: transaction_trace
    kind: transaction
    description: Accepted request and response events at the real RTL boundary.
  - name: cycle_trace
    kind: event
    description: Cycle-ordered protocol state and handshake evidence.
  related_builtin_features:
  - obi_request_response_binding
  - memory_model
