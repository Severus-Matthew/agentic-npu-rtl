clock: clk
reset: rst_n
channels:
- name: cmd
  direction: input
  protocol_profile: ready_valid
  data_objects: []
  ordering: one command
  framing: one beat
- name: a_ar
  direction: output
  protocol_profile: axi4_lite
  purpose: a_axi read_address
  data_objects: []
  metadata:
  - protocol_group=a_axi
  - protocol_channel=read_address
  framing: single_beat_per_transfer
  ordering: in_order
  backpressure: true
- name: a_r
  direction: input
  protocol_profile: axi4_lite
  purpose: a_axi read_data
  data_objects:
  - A_matrix
  metadata:
  - protocol_group=a_axi
  - protocol_channel=read_data
  framing: single_beat_per_transfer
  ordering: in_order
  backpressure: true
- name: b
  direction: input
  protocol_profile: ready_valid
  data_objects:
  - B_matrix
  ordering: declared dimension order
  framing: exact tensor
- name: bias
  direction: input
  protocol_profile: ready_valid
  data_objects:
  - bias_vector
  ordering: declared dimension order
  framing: exact tensor
- name: y
  direction: output
  protocol_profile: ready_valid
  data_objects:
  - Y_matrix
  ordering: declared dimension order
  framing: exact tensor
signals:
- name: clk
  role: clock
  semantic_class: null
  channel: null
  direction: input
  width: 1
  signed: false
  semantic: Free-running clock.
- name: rst_n
  role: reset
  semantic_class: null
  channel: null
  direction: input
  width: 1
  signed: false
  semantic: Synchronous active-low reset.
- name: cmd_valid
  role: valid
  semantic_class: null
  channel: cmd
  direction: input
  width: 1
  signed: false
- name: cmd_ready
  role: ready
  semantic_class: null
  channel: cmd
  direction: output
  width: 1
  signed: false
- name: cmd_op
  role: payload
  semantic_class: command
  channel: cmd
  direction: input
  width: 1
  signed: false
  semantic: legal only 1'd1
- name: a_araddr
  role: payload
  semantic_class: address
  channel: a_ar
  direction: output
  width: 32
  signed: false
  semantic: protocol_field=addr
- name: a_arvalid
  role: valid
  semantic_class: null
  channel: a_ar
  direction: output
  width: 1
  signed: false
- name: a_arready
  role: ready
  semantic_class: null
  channel: a_ar
  direction: input
  width: 1
  signed: false
- name: a_rdata
  role: payload
  semantic_class: data
  channel: a_r
  direction: input
  width: 32
  signed: false
  semantic: protocol_field=data
- name: a_rresp
  role: metadata
  semantic_class: response_code
  channel: a_r
  direction: input
  width: 2
  signed: false
  semantic: protocol_field=resp
- name: a_rvalid
  role: valid
  semantic_class: null
  channel: a_r
  direction: input
  width: 1
  signed: false
- name: a_rready
  role: ready
  semantic_class: null
  channel: a_r
  direction: output
  width: 1
  signed: false
- name: a_base
  role: metadata
  semantic_class: address
  channel: cmd
  direction: input
  width: 32
  signed: false
  semantic: data_object=A_matrix address_role=base byte_order=little address_sequence=contiguous
    word_stride_bytes=4
- name: b_valid
  role: valid
  semantic_class: null
  channel: b
  direction: input
  width: 1
  signed: false
- name: b_ready
  role: ready
  semantic_class: null
  channel: b
  direction: output
  width: 1
  signed: false
- name: b_data
  role: payload
  semantic_class: data
  channel: b
  direction: input
  width: 8
  signed: false
- name: bias_valid
  role: valid
  semantic_class: null
  channel: bias
  direction: input
  width: 1
  signed: false
- name: bias_ready
  role: ready
  semantic_class: null
  channel: bias
  direction: output
  width: 1
  signed: false
- name: bias_data
  role: payload
  semantic_class: data
  channel: bias
  direction: input
  width: 16
  signed: false
- name: y_valid
  role: valid
  semantic_class: null
  channel: y
  direction: output
  width: 1
  signed: false
- name: y_ready
  role: ready
  semantic_class: null
  channel: y
  direction: input
  width: 1
  signed: false
- name: y_data
  role: payload
  semantic_class: data
  channel: y
  direction: output
  width: 16
  signed: false
- name: busy
  role: busy
  semantic_class: null
  channel: null
  direction: output
  width: 1
  signed: false
