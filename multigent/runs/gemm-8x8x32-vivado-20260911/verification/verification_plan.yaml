test_categories:
- functional
- randomized
- reset
- backpressure
- completion
- error_protocol
randomized_test_count: 100
seed: 12345
timeout_seconds: 180
regression_groups:
  smoke:
  - test_gemm8x8x32_cocotb
  targeted:
  - test_gemm8x8x32_cocotb
  full:
  - test_gemm8x8x32_cocotb
pass_criteria: All cocotb tests pass; exact integer match to independent reference
  for randomized jobs; protocol/reset/backpressure/completion/error assertions all
  satisfied.
protocol_assumptions:
- Handshake occurs on rising edge when valid&&ready.
- 'Input framing strict: CMD then 256 A then 256 B then 8 BIAS beats.'
- Source holds valid and payload stable until handshake once asserted.
- Output transfer counted only on m_valid&&m_ready; order must be row-major 64 beats.
- error is sticky until reset; done is completion pulse on final output handshake.
