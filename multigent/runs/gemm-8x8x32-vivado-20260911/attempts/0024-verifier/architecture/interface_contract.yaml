protocol: ready_valid_streaming
clock: clk
reset: rst (synchronous active-high)
channels:
- name: in_cmd_data
  direction: input
  purpose: command and payload ingress
  data_objects:
  - obj_A_matrix
  - obj_B_matrix
  - obj_bias_vector
  metadata:
  - in_type[1:0]
  framing: First transfer after IDLE must be CMD (in_type=0). Then exact payload sections
    A(in_type=1,256 beats), B(in_type=2,256 beats), BIAS(in_type=3,8 beats).
  ordering: strict section order, no interleaving
  backpressure: s_ready driven by loader availability
- name: out_y
  direction: output
  purpose: Y matrix egress
  data_objects:
  - obj_Y_matrix
  metadata: []
  framing: 64 beats per job
  ordering: row-major m outer, n inner
  backpressure: m_valid held until handshake
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: clock
  reset_value: '0'
- name: rst
  direction: input
  width: '1'
  signed: false
  semantic: synchronous active-high reset
  reset_value: '0'
- name: s_valid
  direction: input
  width: '1'
  signed: false
  semantic: input valid
  reset_value: '0'
- name: s_ready
  direction: output
  width: '1'
  signed: false
  semantic: input ready
  reset_value: '0'
- name: s_data
  direction: input
  width: '32'
  signed: true
  semantic: payload; CMD packs {opcode[7:0],reserved[23:0]} with opcode=1 start; A/B
    use s_data[7:0] signed int8 and require s_data[31:8]=0; BIAS uses full signed
    int32
  reset_value: '0'
- name: s_type
  direction: input
  width: '2'
  signed: false
  semantic: 00 CMD, 01 A, 10 B, 11 BIAS
  reset_value: '0'
- name: m_valid
  direction: output
  width: '1'
  signed: false
  semantic: output valid
  reset_value: '0'
- name: m_ready
  direction: input
  width: '1'
  signed: false
  semantic: output ready/backpressure
  reset_value: '0'
- name: m_data
  direction: output
  width: '32'
  signed: true
  semantic: signed int32 Y element
  reset_value: '0'
- name: busy
  direction: output
  width: '1'
  signed: false
  semantic: 1 when not IDLE
  reset_value: '0'
- name: done
  direction: output
  width: '1'
  signed: false
  semantic: 1-cycle pulse when final output beat handshakes
  reset_value: '0'
- name: error
  direction: output
  width: '1'
  signed: false
  semantic: sticky protocol/length error flag
  reset_value: '0'
global_handshake_rules:
  transfer_condition: channel transfer occurs iff ready && valid on rising clk
  stall_behavior: while valid=1 and ready=0, payload and metadata must remain stable
