design:
  name: gemm8x8x32_bias_relu_accel
  version: '1.0'
  description: Fixed-size GEMM accelerator computing Y[8,8]=ReLU(A[8,32]@B[32,8]+bias[8])
    with int8 inputs and int32 accumulation/wrap semantics, supporting reset and output
    backpressure.
operations:
- name: op_load_a
  kind: ingress_load
  semantics: Load 256 signed int8 A elements in row-major order for one job.
  inputs:
  - a_stream_payload
  outputs:
  - a_matrix
- name: op_load_b
  kind: ingress_load
  semantics: Load 256 signed int8 B elements in row-major over K then N for one job.
  inputs:
  - b_stream_payload
  outputs:
  - b_matrix
- name: op_load_bias
  kind: ingress_load
  semantics: Load 8 signed int32 bias elements for one job.
  inputs:
  - bias_stream_payload
  outputs:
  - bias_vector
- name: op_gemm_accumulate
  kind: compute
  semantics: For each m in [0..7], n in [0..7], compute 32-term dot product sum_k
    (A[m,k]*B[k,n]) into signed int32 accumulator with two's-complement wrap on overflow
    each addition.
  inputs:
  - a_matrix
  - b_matrix
  outputs:
  - acc_matrix
- name: op_add_bias
  kind: compute
  semantics: For each output element, add bias[n] to acc_matrix[m,n] in signed int32
    with two's-complement wrap on overflow.
  inputs:
  - acc_matrix
  - bias_vector
  outputs:
  - pre_relu_matrix
- name: op_relu
  kind: compute
  semantics: For each element x, output 0 if x<0 else x; comparison is signed int32
    after wrap-complete arithmetic.
  inputs:
  - pre_relu_matrix
  outputs:
  - y_matrix
- name: op_emit_y
  kind: egress_store
  semantics: Emit 64 signed int32 Y elements in row-major order with ready/valid handshake
    and backpressure support.
  inputs:
  - y_matrix
  outputs:
  - y_stream_payload
data_types:
- name: int8_s
  role: A/B elements
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: Operands sign-extended to int32 before multiply.
  overflow_semantics: N/A at source type
  rounding_semantics: exact_integer
- name: int16_s
  role: product intermediate
  width_bits: 16
  signed: true
  representation: two_complement
  conversion_semantics: Exact int8*int8 product; sign-extended to int32 before accumulation.
  overflow_semantics: wrap two_complement
  rounding_semantics: exact_integer
- name: int32_s
  role: accumulator,bias,output
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: Native compute/output type
  overflow_semantics: wrap two_complement
  rounding_semantics: exact_integer
data_objects:
- name: a_stream_payload
  role: external serialized A elements
  data_type: int8_s
  dimensions:
  - A_ELEMS
  producer: external
  consumers:
  - op_load_a
  external: true
- name: b_stream_payload
  role: external serialized B elements
  data_type: int8_s
  dimensions:
  - B_ELEMS
  producer: external
  consumers:
  - op_load_b
  external: true
- name: bias_stream_payload
  role: external serialized bias elements
  data_type: int32_s
  dimensions:
  - N_DIM
  producer: external
  consumers:
  - op_load_bias
  external: true
- name: a_matrix
  role: local A operand store
  data_type: int8_s
  dimensions:
  - M_DIM
  - K_DIM
  producer: op_load_a
  consumers:
  - op_gemm_accumulate
  external: false
- name: b_matrix
  role: local B operand store
  data_type: int8_s
  dimensions:
  - K_DIM
  - N_DIM
  producer: op_load_b
  consumers:
  - op_gemm_accumulate
  external: false
- name: bias_vector
  role: local bias store
  data_type: int32_s
  dimensions:
  - N_DIM
  producer: op_load_bias
  consumers:
  - op_add_bias
  external: false
- name: acc_matrix
  role: post-dotproduct accumulators
  data_type: int32_s
  dimensions:
  - M_DIM
  - N_DIM
  producer: op_gemm_accumulate
  consumers:
  - op_add_bias
  external: false
- name: pre_relu_matrix
  role: bias-added results
  data_type: int32_s
  dimensions:
  - M_DIM
  - N_DIM
  producer: op_add_bias
  consumers:
  - op_relu
  external: false
- name: y_matrix
  role: final relu outputs
  data_type: int32_s
  dimensions:
  - M_DIM
  - N_DIM
  producer: op_relu
  consumers:
  - op_emit_y
  external: false
- name: y_stream_payload
  role: external serialized output elements
  data_type: int32_s
  dimensions:
  - Y_ELEMS
  producer: op_emit_y
  consumers:
  - external
  external: true
dimensions:
- name: M_DIM
  semantic: Output row count M; fixed per this design to 8.
  minimum: 8
  maximum: 8
  runtime_configurable: false
  bound_parameter: M_FIXED
- name: N_DIM
  semantic: Output column count N; fixed per this design to 8.
  minimum: 8
  maximum: 8
  runtime_configurable: false
  bound_parameter: N_FIXED
- name: K_DIM
  semantic: Reduction dimension K; fixed per this design to 32.
  minimum: 32
  maximum: 32
  runtime_configurable: false
  bound_parameter: K_FIXED
- name: A_ELEMS
  semantic: Serialized A element count per job, equals M_DIM*K_DIM.
  minimum: 256
  maximum: 256
  runtime_configurable: false
  bound_parameter: A_ELEMS_FIXED
- name: B_ELEMS
  semantic: Serialized B element count per job, equals K_DIM*N_DIM.
  minimum: 256
  maximum: 256
  runtime_configurable: false
  bound_parameter: B_ELEMS_FIXED
- name: Y_ELEMS
  semantic: Serialized Y element count per job, equals M_DIM*N_DIM.
  minimum: 64
  maximum: 64
  runtime_configurable: false
  bound_parameter: Y_ELEMS_FIXED
parameters:
- name: M_FIXED
  default_value: '8'
  legality_constraint: integer == 8
  description: Compile-time fixed M dimension.
- name: N_FIXED
  default_value: '8'
  legality_constraint: integer == 8
  description: Compile-time fixed N dimension.
- name: K_FIXED
  default_value: '32'
  legality_constraint: integer == 32
  description: Compile-time fixed K dimension.
- name: A_ELEMS_FIXED
  default_value: '256'
  legality_constraint: integer == M_FIXED*K_FIXED
  description: Total A elements per job.
- name: B_ELEMS_FIXED
  default_value: '256'
  legality_constraint: integer == K_FIXED*N_FIXED
  description: Total B elements per job.
- name: Y_ELEMS_FIXED
  default_value: '64'
  legality_constraint: integer == M_FIXED*N_FIXED
  description: Total Y elements per job.
compute:
  organization: Single MAC datapath with sequential nested-loop execution.
  dataflow: Load-all-then-compute-then-emit.
  parallelism: 1 multiply-accumulate per cycle during GEMM phase.
  scheduling: 'Deterministic FSM: load A/B/bias, compute all outputs, apply bias+ReLU,
    stream out with backpressure.'
storage:
- name: a_mem
  stored_objects:
  - a_matrix
  capacity_expression: M_FIXED*K_FIXED elements of int8_s
  capacity_at_default_parameters: 256
  access_pattern: Sequential write during load; indexed read during compute.
  port_requirements: 1R/1W logical (can be time-multiplexed single-port across phases).
  implementation_hint: reg array or inferred SRAM
  reuse_semantics: Each element reused across N outputs for same m,k traversal.
  lifetime: From end of A load until compute completion.
- name: b_mem
  stored_objects:
  - b_matrix
  capacity_expression: K_FIXED*N_FIXED elements of int8_s
  capacity_at_default_parameters: 256
  access_pattern: Sequential write during load; indexed read during compute.
  port_requirements: 1R/1W logical (phase-separated).
  implementation_hint: reg array or inferred SRAM
  reuse_semantics: Each element reused across M outputs for same k,n traversal.
  lifetime: From end of B load until compute completion.
- name: bias_mem
  stored_objects:
  - bias_vector
  capacity_expression: N_FIXED elements of int32_s
  capacity_at_default_parameters: 8
  access_pattern: Sequential write during load; indexed read during post-accumulate.
  port_requirements: 1R/1W logical (phase-separated).
  implementation_hint: register file
  reuse_semantics: Each bias reused for all M rows.
  lifetime: From end of bias load until bias-add completion.
- name: y_mem
  stored_objects:
  - y_matrix
  capacity_expression: M_FIXED*N_FIXED elements of int32_s
  capacity_at_default_parameters: 64
  access_pattern: Indexed write during finalize; sequential read during egress.
  port_requirements: 1R/1W logical; read/write not concurrent in baseline schedule.
  implementation_hint: reg array or inferred SRAM
  reuse_semantics: No arithmetic reuse; buffering for backpressured egress.
  lifetime: From finalize write until each element transmitted.
pipeline:
- stage: S0_INGRESS
  responsibility: Accept input streams and fill A/B/bias memories.
  registered: true
  valid_behavior: Write on input transfer (valid&&ready).
  stall_behavior: If corresponding ready low, no counter advance and payload not consumed.
- stage: S1_COMPUTE
  responsibility: Perform sequential MAC accumulation for one output element.
  registered: true
  valid_behavior: One MAC update per cycle while active.
  stall_behavior: No external stall in this stage; internal deterministic progress.
- stage: S2_FINALIZE
  responsibility: Add bias, apply ReLU, store y_mem.
  registered: true
  valid_behavior: One output element finalized per cycle.
  stall_behavior: No external stall in this stage; internal deterministic progress.
- stage: S3_EGRESS
  responsibility: Stream y_mem with output handshake.
  registered: true
  valid_behavior: Advance output index only on y_valid&&y_ready.
  stall_behavior: Hold y_valid and payload stable while y_ready=0.
control:
  strategy: Central FSM with monotonic counters.
  state_progression: RESET->IDLE_WAIT_JOB->LOAD_A->LOAD_B->LOAD_BIAS->COMPUTE->FINALIZE->EMIT->DONE_PULSE->IDLE_WAIT_JOB
  counters:
  - a_load_idx[0..255]
  - b_load_idx[0..255]
  - bias_load_idx[0..7]
  - m_idx[0..7]
  - n_idx[0..7]
  - k_idx[0..31]
  - emit_idx[0..63]
  error_behavior: Protocol violation if input valid asserted for wrong section/state;
    raise sticky error flag and ignore transfers until next reset.
  error_recovery: Synchronous reset clears error flag and returns to IDLE_WAIT_JOB.
reset:
  style: synchronous
  polarity: active_high
  required_state: FSM to RESET/IDLE, counters zeroed, valid outputs deasserted, error
    flag cleared, done deasserted; memories not required to be bulk-cleared.
latency_model: Per job cycles = input load transfers (256+256+8)=520 + compute MAC
  cycles (64*32)=2048 + finalize cycles 64 + output transfers (64, plus extra stall
  cycles from backpressure). Total no-stall latency 2696 cycles from first accepted
  A beat to last accepted Y beat.
architectural_invariants:
- Exactly one job in flight.
- Input section order is strictly A then B then bias.
- Arithmetic is exact integer except mandated int32 two's-complement wrap on additions.
- ReLU is applied after full wrapped accumulation and wrapped bias add.
- Output order is row-major Y[m][n] with n fastest.
open_assumptions:
- No start/done command channel required; job starts implicitly when A section reception
  begins in IDLE.
- Input backpressure support is provided via per-channel ready signals though only
  output backpressure was explicitly requested.
- Dimension is fixed to requested 8x8x32; no runtime shape programmability.
