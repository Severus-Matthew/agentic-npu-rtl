schema_version: 1
source: verifier operation coverage
obligations:
- id: operation.add_unsigned.accepted_sum
  template: operation_coverpoint
  scope: operation
  scope_name: add_unsigned
  kind: coverpoint
  description: Observe the mathematical sum class of each accepted packed operand
    pair.
  bindings:
    operation_name: add_unsigned
    family: unsigned_binary_add
    field: accepted_operand_sum
    concept: two_operand_unsigned_addition
    source: baseline
    sampling:
      template: custom
      event: clock
      channel: {}
      fields:
        rst_n:
          signal: rst_n
          lsb: 0
          width: null
          declared_width: 1
        in_valid:
          signal: in_valid
          lsb: 0
          width: null
          declared_width: 1
        in_ready:
          signal: in_ready
          lsb: 0
          width: null
          declared_width: 1
        in_payload:
          signal: in_payload
          lsb: 0
          width: null
          declared_width: 16
      guards: []
      field_binding_origin: verifier_declared
      observer: observe_accepted_sum
      field_types: {}
  bins:
  - name: zero
    intent: Both accepted operands are zero.
    predicate:
      op: eq
      args:
      - 0
  - name: low_or_no_carry
    intent: Accepted sum is between 1 and 255.
    predicate:
      op: between
      args:
      - 1
      - 255
  - name: widened_result
    intent: Accepted sum requires the ninth result bit.
    predicate:
      op: between
      args:
      - 256
      - 509
  - name: maximum
    intent: Both operands are at their maximum.
    predicate:
      op: eq
      args:
      - 510
  checks: []
- id: operation.add_unsigned.output_buffer_stall
  template: operation_coverpoint
  scope: operation
  scope_name: add_unsigned
  kind: coverpoint
  description: Observe released stalls in the single-entry output register.
  bindings:
    operation_name: add_unsigned
    family: unsigned_binary_add
    field: released_output_stall_cycles
    concept: single_entry_backpressure_buffer
    source: architect_extension
    sampling:
      template: channel_stall
      event: transfer
      channel:
        valid: out_valid
        ready: out_ready
      fields: {}
      guards: []
      field_binding_origin: verifier_declared
  bins:
  - name: none
    intent: An actual transfer with no preceding stall.
    predicate:
      op: eq
      args:
      - 0
  - name: one_cycle
    intent: An actual transfer after exactly one stalled observation.
    predicate:
      op: eq
      args:
      - 1
  - name: short
    intent: An actual transfer after two through four stalled observations.
    predicate:
      op: between
      args:
      - 2
      - 4
  - name: long
    intent: An actual transfer after five or more stalled observations.
    predicate:
      op: gte
      args:
      - 5
  checks: []
- id: operation.add_unsigned.registered_latency
  template: operation_coverpoint
  scope: operation
  scope_name: add_unsigned
  kind: coverpoint
  description: Observe input-acceptance to associated output-transfer distance.
  bindings:
    operation_name: add_unsigned
    family: unsigned_binary_add
    field: acceptance_to_transfer_cycles
    concept: registered_result
    source: architect_extension
    sampling:
      template: custom
      event: clock
      channel: {}
      fields:
        rst_n:
          signal: rst_n
          lsb: 0
          width: null
          declared_width: 1
        in_valid:
          signal: in_valid
          lsb: 0
          width: null
          declared_width: 1
        in_ready:
          signal: in_ready
          lsb: 0
          width: null
          declared_width: 1
        out_valid:
          signal: out_valid
          lsb: 0
          width: null
          declared_width: 1
        out_ready:
          signal: out_ready
          lsb: 0
          width: null
          declared_width: 1
      guards: []
      field_binding_origin: verifier_declared
      observer: observe_registered_latency
      field_types: {}
  bins:
  - name: one_cycle
    intent: Unstalled result transfers exactly one cycle after acceptance.
    predicate:
      op: eq
      args:
      - 1
  - name: backpressured_delay
    intent: Output backpressure extends transfer latency.
    predicate:
      op: gte
      args:
      - 2
  checks: []
- id: operation.add_unsigned.transferred_sum
  template: operation_coverpoint
  scope: operation
  scope_name: add_unsigned
  kind: coverpoint
  description: Observe exact transferred 9-bit result values.
  bindings:
    operation_name: add_unsigned
    family: unsigned_binary_add
    field: transferred_sum
    concept: widened_exact_result
    source: baseline
    sampling:
      template: custom
      event: clock
      channel: {}
      fields:
        rst_n:
          signal: rst_n
          lsb: 0
          width: null
          declared_width: 1
        out_valid:
          signal: out_valid
          lsb: 0
          width: null
          declared_width: 1
        out_ready:
          signal: out_ready
          lsb: 0
          width: null
          declared_width: 1
        out_payload:
          signal: out_payload
          lsb: 0
          width: null
          declared_width: 9
      guards: []
      field_binding_origin: verifier_declared
      observer: observe_transferred_sum
      field_types: {}
  bins:
  - name: zero
    intent: Transferred result is zero.
    predicate:
      op: eq
      args:
      - 0
  - name: uint8_range
    intent: Transferred result fits in eight bits.
    predicate:
      op: between
      args:
      - 1
      - 255
  - name: ninth_bit_set
    intent: Transferred result exercises widened representation.
    predicate:
      op: between
      args:
      - 256
      - 509
  - name: maximum
    intent: Transferred result is 510.
    predicate:
      op: eq
      args:
      - 510
  checks: []
