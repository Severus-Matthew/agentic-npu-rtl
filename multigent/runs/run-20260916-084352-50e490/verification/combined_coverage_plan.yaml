  checks: []
- id: operation.uadd_pair.vector_length
  template: operation_coverpoint
  scope: operation
  scope_name: uadd_pair
  kind: coverpoint
  description: Single element per accepted transaction.
  bindings:
    operation_name: uadd_pair
    family: vector_alu
    field: tx_elems
    concept: vector_length
    source: baseline
    sampling:
      template: custom
      event: clock
      channel: {}
      fields:
        v:
          signal: in_valid
          lsb: 0
          width: null
          declared_width: 1
      guards: []
      field_binding_origin: verifier_declared
      observer: observe_const_one
      field_types: {}
  bins:
  - name: minimum
    intent: single scalar element
    predicate:
      op: eq
