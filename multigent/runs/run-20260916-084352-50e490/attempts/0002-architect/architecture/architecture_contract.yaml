design:
  name: rv_uadd8x2_to_u9
  version: '1.0'
  description: Clocked unsigned 8b+8b adder with ready/valid input and output, single-entry
    output register, one-cycle no-stall latency, backpressure-stable output, synchronous
    active-low reset.
operations:
- name: uadd_pair
  kind: add
  coverage_family: vector_alu
  coverage_family_source: catalog
  features:
  - opcode
  - vector_length
  - operand_classes
  - numeric_behavior
  - predication
  feature_extensions:
  - fixed_opcode_add_only
  - scalar_single_element_per_transaction
  - no_predication_supported
  semantics: On each accepted input transfer, compute exact unsigned sum S=A+B where
    A and B are 8-bit unsigned operands and S is 9-bit unsigned with zero-extension
    carry-out preserved; no truncation, no saturation, no wrap beyond 9 bits.
  inputs:
  - in_pair
  outputs:
  - sum_out
data_types:
- name: u8
  role: input_operand_element
  width_bits: 8
  signed: false
  representation: unsigned_binary
  conversion_semantics: Consumed as-is; no sign extension.
  overflow_semantics: Not applicable at type level.
  rounding_semantics: Exact integer.
- name: u9
  role: sum_element
  width_bits: 9
  signed: false
  representation: unsigned_binary
  conversion_semantics: Produced from zero-extended 8b operands addition.
  overflow_semantics: Exact representable range 0..510; no overflow for 8b+8b.
  rounding_semantics: Exact integer.
data_objects:
- name: in_pair
  role: input_transaction_operands
  data_type: u8
  dimensions: []
  producer: external
  consumers:
  - uadd_pair
  external: true
- name: sum_out
  role: output_sum_transaction
  data_type: u9
  dimensions: []
  producer: uadd_pair
  consumers:
  - external
  external: true
dimensions: []
parameters: []
compute:
  organization: single scalar adder datapath with registered output
  dataflow: 'transactional stream: accept input then publish sum next cycle'
  parallelism: one transaction in flight in output register
  scheduling: single-cycle compute from accepted input to output register write when
    output slot empty
storage:
- name: out_reg
  stored_objects:
  - sum_out
  capacity_expression: 1 transaction
  capacity_at_default_parameters: 1
  access_pattern: write on accepted input; hold until accepted output
  port_requirements: 1 write source (adder result), 1 read sink (output channel),
    valid bit
  implementation_hint: flip-flop register plus valid flag
  reuse_semantics: no reuse; each entry consumed once
  lifetime: from input acceptance cycle+1 visibility until output handshake
pipeline:
- stage: s0_accept_compute
  responsibility: input handshake qualification and combinational add
  registered: false
  valid_behavior: when in_valid&&in_ready, compute sum candidate
  stall_behavior: if out_reg valid and out_ready=0, in_ready=0 so no acceptance
- stage: s1_output_register
  responsibility: store/hold sum and drive output handshake
  registered: true
  valid_behavior: out_valid reflects valid flag; out_sum reflects stored sum
  stall_behavior: while out_valid&& !out_ready, out_sum and out_valid remain stable
control:
  strategy: single valid-bit occupancy control
  state_progression: EMPTY -> FULL on input transfer; FULL -> EMPTY on output transfer;
    if simultaneous dequeue/enqueue allowed only when FULL and out_ready and in_valid
    then replace with new sum preserving one-cycle latency not used here because one-cycle
    no-stall requires EMPTY at accept
  counters: []
  error_behavior: No command channel; protocol violation only if environment changes
    payload while stalled, DUT behavior unspecified beyond handshake contract; DUT
    raises no error output.
  error_recovery: Recovery by external protocol compliance and reset; reset clears
    valid state deterministically.
reset:
  style: synchronous
  polarity: active_low
  required_state: 'on cycle with rst_n=0: out_valid=0, output register content don''t-care
    but held deterministic by flops, in_ready=1 (since empty), pending/pre-reset work
    discarded'
latency_model: 'Exact, no-stall case: if input transfer occurs at cycle t (ready&&valid
  sampled high at rising edge, rst_n=1), corresponding output becomes valid at cycle
  t+1 and must transfer at t+1 when out_ready=1. Backpressure may delay output transfer
  arbitrarily; value remains stable until transfer. During stall at output, in_ready=0
  so no new input accepted.'
architectural_invariants:
- Each accepted input transaction produces exactly one output transaction with value
  A+B in 9-bit unsigned arithmetic.
- No output transaction occurs without a prior accepted input transaction after last
  reset.
- Output payload and valid remain stable during any cycle with out_valid=1 and out_ready=0.
- Reset aborts all pending work and deasserts out_valid synchronously.
open_assumptions:
- Input channel payload packing uses two dedicated 8-bit signals (op_a, op_b) rather
  than a packed 16-bit bus for simplicity.
- No internal queue beyond required single-entry output register; therefore input
  backpressures whenever output register occupied.
- No error/status/completion sideband is exposed because user request did not require
  it.
