protocol: 'Four independent synchronous ready/valid channels: command, operand, result,
  and completion. Single outstanding job; operands are accepted only after a legal
  command.'
clock: clk; all transfers and sequential updates occur on rising edges. No target
  clock period is assumed.
reset: rst; synchronous active-high reset. Transfer acceptance is disabled while rst
  is high.
channels:
- name: command
  direction: input
  purpose: Submit dimensions and requested feature selections
  data_objects:
  - row_count
  - column_count
  - bias_enable
  - relu_enable
  metadata: []
  framing: Exactly one transfer per job. Separate fields cmd_rows[15:0], cmd_cols[15:0],
    cmd_bias_enable, and cmd_relu_enable are accepted together; total payload is 34
    physical bits, with no packed command bus.
  ordering: Accepted only in IDLE. A new command cannot be accepted until the preceding
    completion has been accepted.
  backpressure: Host holds all four fields and cmd_valid stable while cmd_valid &&
    !cmd_ready.
- name: operand
  direction: input
  purpose: Supply vector, optional tile biases, and tile matrix elements
  data_objects:
  - vector
  - bias
  - matrix
  metadata: []
  framing: 'One scalar per 32-bit transfer, with no tags or last signal. INT8 transfers
    use data[7:0] and ignore data[31:8]; bias uses data[31:0]. Sequence: vector[c]
    for c=0..C-1; then for t=0..ceil(R/16)-1, let base=16*t and h=min(16,R-base),
    send bias[base+i] for i=0..h-1 only if enabled, then matrix[base+i,c] for c=0..C-1
    outer and i=0..h-1 inner. Total C+b*R+C*R transfers. Partial tiles send h elements,
    never padding.'
  ordering: Section boundaries are determined solely by accepted counts and the command.
    Internal MAC, initialization, finalization, and output phases insert ready-low
    gaps; the next operand may be held valid through those gaps.
  backpressure: Host holds in_valid and all in_data bits stable while stalled. DUT
    asserts in_ready only in LOAD_X, LOAD_BIAS, or LOAD_W.
- name: result
  direction: output
  purpose: Return activated or unactivated INT32 results
  data_objects:
  - results
  metadata:
  - out_last
  framing: Exactly R transfers for a legal command and zero for an invalid command.
    out_data[31:0] is one signed result bit pattern. out_last is one only for row
    R-1.
  ordering: Rows 0 through R-1 in ascending order. Tile boundaries create gaps but
    do not change order.
  backpressure: DUT holds out_valid, out_data, and out_last while stalled; no subsequent
    tile starts until the current tile is drained.
- name: completion
  direction: output
  purpose: Report terminal success or invalid command
  data_objects:
  - completion_status
  metadata: []
  framing: Exactly one transfer per accepted command unless reset aborts it. done_error=0
    means all R results were accepted; done_error=1 means invalid dimensions and no
    operands or results were accepted for that command.
  ordering: Success becomes valid in the cycle after the final result handshake. Invalid-command
    status becomes valid in the cycle after command acceptance.
  backpressure: DUT holds done_valid and done_error until done_ready; command ready
    remains low through the completion handshake cycle.
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: Rising-edge clock
  reset_value: Not applicable
- name: rst
  direction: input
  width: '1'
  signed: false
  semantic: Synchronous active-high reset
  reset_value: Environment drives
- name: cmd_valid
  direction: input
  width: '1'
  signed: false
  semantic: Command payload valid
  reset_value: Environment drives; ignored during reset
- name: cmd_ready
  direction: output
  width: '1'
  signed: false
  semantic: High exactly when state is IDLE and rst is low
  reset_value: 0 while rst is high
- name: cmd_rows
  direction: input
  width: '16'
  signed: false
  semantic: Unsigned R; legal range 1..MAX_ROWS
  reset_value: Unconstrained
- name: cmd_cols
  direction: input
  width: '16'
  signed: false
  semantic: Unsigned C; legal range 1..MAX_COLS
  reset_value: Unconstrained
- name: cmd_bias_enable
  direction: input
  width: '1'
  signed: false
  semantic: One enables bias transport and addition
  reset_value: Unconstrained
- name: cmd_relu_enable
  direction: input
  width: '1'
  signed: false
  semantic: One enables signed ReLU after bias selection
  reset_value: Unconstrained
- name: in_valid
  direction: input
  width: '1'
  signed: false
  semantic: Operand payload valid
  reset_value: Environment drives; ignored during reset
- name: in_ready
  direction: output
  width: '1'
  signed: false
  semantic: High exactly in operand load states while rst is low
  reset_value: '0'
- name: in_data
  direction: input
  width: '32'
  signed: false
  semantic: Raw scalar transport; low byte is signed INT8 except full-width signed
    INT32 bias sections
  reset_value: Unconstrained
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: High exactly in EMIT while rst is low
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: Result sink can accept a transfer
  reset_value: Unconstrained
- name: out_data
  direction: output
  width: '32'
  signed: true
  semantic: Current signed INT32 result; zero when out_valid is zero
  reset_value: '0'
- name: out_last
  direction: output
  width: '1'
  signed: false
  semantic: High iff out_valid and current result row equals R-1
  reset_value: '0'
- name: done_valid
  direction: output
  width: '1'
  signed: false
  semantic: High exactly in DONE while rst is low
  reset_value: '0'
- name: done_ready
  direction: input
  width: '1'
  signed: false
  semantic: Completion sink can accept terminal status
  reset_value: Unconstrained
- name: done_error
  direction: output
  width: '1'
  signed: false
  semantic: Invalid-dimension status when done_valid; zero otherwise
  reset_value: '0'
global_handshake_rules:
  transfer_condition: At a rising edge, a channel transfers iff rst=0 and its ready
    && valid are both one.
  stall_behavior: A source must retain valid and its entire payload until handshake,
    except reset may cancel it. DUT ready is state-derived, not dependent on source
    valid. Independent channels cannot bypass the single-job phase ordering.
