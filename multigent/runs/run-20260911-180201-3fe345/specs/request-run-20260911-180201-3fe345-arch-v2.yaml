user_request: "Design a small AI accelerator for fully connected neural-network layers.\
  \ The accelerator should primarily operate as a tiled GEMM engine, multiplying INT8\
  \ activation matrices by INT8 weight matrices, accumulating in INT32, adding a bias\
  \ vector, and applying ReLU. Use an 8\xD78 compute array and support matrices larger\
  \ than the array through tiling."
project_constraints:
  rtl_constraints:
    language: SystemVerilog
    synthesizable_only: true
    forbidden_constructs:
    - real
    - shortreal
    - delay_statements
    - force_release
    - classes
  verification_policy:
    exact_integer_match_when_applicable: true
    randomized_transactions_minimum: 100
    require_reset_tests: true
    require_backpressure_tests_when_applicable: true
    regression_wall_timeout_seconds_minimum: 120
    require_completion_behavior_tests_when_defined: true
    require_error_behavior_tests_when_defined: true
  synthesis_policy:
    provider: vivado
    requires_verified_rtl: true
    result_schema: multigent/schemas/synthesis_result.schema.json
    authoritative_metrics_source: deterministic_tool_report
    prohibit_metric_estimation: true
architect_must_decide_when_unspecified:
- design_name
- operation_semantics
- data_type_semantics
- logical_data_objects
- legal_runtime_bounds
- compile_time_parameters
- compute_organization
- parallelism
- scheduling
- dataflow
- storage_and_reuse
- buffering
- pipeline_structure
- interface_protocol
- interface_payload_mapping
- framing_and_ordering
- backpressure_behavior
- reset_style
- reset_polarity
- control_strategy
- error_recovery
- latency_model
- module_decomposition
provenance:
  user_supplied_fields:
  - user_request
  runtime_injected_fields:
  - project_constraints
  - architect_must_decide_when_unspecified
  - downstream_revision_feedback
downstream_revision_feedback:
  category: Missing/underspecified interface contract
  affected_modules:
  - fc_tiled_gemm_top
  - control_fsm
  - output_unit
  - pe_array_8x8
  issue: Current frozen port contracts do not carry enough control/state information
    to implement the required tile loops, k-step handshakes, boundary masking, and
    stage progression while preserving architecture semantics.
  evidence: 1) control_fsm lacks M/K/N inputs and datapath handshake inputs, yet must
    drive nested loops and stalls. 2) control_fsm exposes no control outputs (except
    counters) to drive pe_array step_en/clear_tile or post/emit phases. 3) output_unit
    lacks index/context inputs for boundary masking/order derivation. 4) pe_array
    requires step_en/clear_tile but their source/control timing is not representable
    via existing inter-module contracts.
  requested_architect_decision: 'Freeze additional interfaces/control ownership: (a)
    provide control_fsm inputs for M_reg/K_reg/N_reg and stage handshake/status, and
    outputs for step_en/clear_tile/post_valid sequencing; (b) define where tm_idx/tn_idx
    live and expose them; (c) provide output_unit with sufficient index/context (or
    move boundary/order control to top) to enforce tile-major masked emission deterministically.'
