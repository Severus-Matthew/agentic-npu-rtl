rtl_constraints:
  language: SystemVerilog
  synthesizable_only: true
  forbidden_constructs:
    - real
    - shortreal
    - delay_statements
    - force_release
    - classes

verification_policy:
  exact_integer_match: true
  randomized_transactions_minimum: 100
  require_reset_tests: true
  require_backpressure_tests: true

synthesis_policy:
  provider: synopsys
  requires_verified_rtl: true
  result_schema: multigent/schemas/synthesis_result.schema.json
  authoritative_metrics_source: deterministic_tool_report
  prohibit_metric_estimation: true

architect_must_decide_when_unspecified:
  - design_name
  - design_description
  - exact_arithmetic_semantics
  - signedness
  - overflow_semantics
  - compute_organization
  - array_dimensions
  - supported_dimension_bounds
  - parameterization
  - dataflow
  - operand_reuse_strategy
  - operand_storage_strategy
  - buffering
  - pipeline_structure
  - interface_protocol
  - input_ordering
  - backpressure_behavior
  - reset_style
  - reset_polarity
  - control_strategy
  - latency_model
  - module_decomposition
