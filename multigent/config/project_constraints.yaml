rtl_constraints:
  language: SystemVerilog
  synthesizable_only: true
  forbidden_constructs:
    - real
    - shortreal
    - delay_statements
    - force_release
    - classes

verification_policy:
  exact_integer_match_when_applicable: true
  randomized_transactions_minimum: 100
  require_reset_tests: true
  require_backpressure_tests_when_applicable: true
  regression_wall_timeout_seconds_minimum: 120
  require_completion_behavior_tests_when_defined: true
  require_error_behavior_tests_when_defined: true

synthesis_policy:
  provider: synopsys
  requires_verified_rtl: true
  result_schema: multigent/schemas/synthesis_result.schema.json
  authoritative_metrics_source: deterministic_tool_report
  prohibit_metric_estimation: true

architect_must_decide_when_unspecified:
  - design_name
  - operation_semantics
  - data_type_semantics
  - logical_data_objects
  - legal_runtime_bounds
  - compile_time_parameters
  - compute_organization
  - parallelism
  - scheduling
  - dataflow
  - storage_and_reuse
  - buffering
  - pipeline_structure
  - interface_protocol
  - interface_payload_mapping
  - framing_and_ordering
  - backpressure_behavior
  - reset_style
  - reset_polarity
  - control_strategy
  - error_recovery
  - latency_model
  - module_decomposition
