design:
  name: gemm_bias_relu_npu
  version: '1.0'
  description: Parameterized int8 GEMM with int32 bias add and ReLU activation, using
    tiled accumulation and streaming ready/valid interfaces.
operations:
- name: op_gemm_core
  kind: compute
  semantics: For each output element C[m,n], compute acc[m,n]=sum_{k=0..K-1}(A[m,k]*B[k,n])
    with signed int8 multiplicands and signed int32 accumulation.
  inputs:
  - obj_a_matrix
  - obj_b_matrix
  - obj_dims
  outputs:
  - obj_acc_matrix
- name: op_bias_add
  kind: compute
  semantics: 'For each output element, add signed int32 bias per output column: z[m,n]=acc[m,n]+bias[n].'
  inputs:
  - obj_acc_matrix
  - obj_bias_vector
  - obj_dims
  outputs:
  - obj_bias_matrix
- name: op_relu
  kind: compute
  semantics: For each output element, y[m,n]=max(0,z[m,n]) in signed int32 domain.
  inputs:
  - obj_bias_matrix
  - obj_dims
  outputs:
  - obj_out_matrix
data_types:
- name: dt_int8
  role: A/B input element
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: Sign-extend when promoted to multiplier input internal width.
  overflow_semantics: Wrap on any explicit truncation (none in mandatory path).
  rounding_semantics: Not applicable (integer exact).
- name: dt_int32
  role: Accumulator/bias/output element
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: No narrowing in mandatory path.
  overflow_semantics: Wrap on add/multiply-accumulate overflow in 32-bit accumulator.
  rounding_semantics: Not applicable (integer exact).
- name: dt_u16
  role: Runtime dimension scalar
  width_bits: 16
  signed: false
  representation: unsigned_binary
  conversion_semantics: Used as positive integer counters.
  overflow_semantics: Illegal if exceeds configured maxima.
  rounding_semantics: Not applicable.
data_objects:
- name: obj_a_matrix
  role: Left GEMM operand
  data_type: dt_int8
  dimensions:
  - dim_m
  - dim_k
  producer: external
  consumers:
  - op_gemm_core
  external: true
- name: obj_b_matrix
  role: Right GEMM operand
  data_type: dt_int8
  dimensions:
  - dim_k
  - dim_n
  producer: external
  consumers:
  - op_gemm_core
  external: true
- name: obj_bias_vector
  role: Bias per output column
  data_type: dt_int32
  dimensions:
  - dim_n
  producer: external
  consumers:
  - op_bias_add
  external: true
- name: obj_acc_matrix
  role: Post-GEMM accumulation intermediate
  data_type: dt_int32
  dimensions:
  - dim_m
  - dim_n
  producer: op_gemm_core
  consumers:
  - op_bias_add
  external: false
- name: obj_bias_matrix
  role: Post-bias intermediate
  data_type: dt_int32
  dimensions:
  - dim_m
  - dim_n
  producer: op_bias_add
  consumers:
  - op_relu
  external: false
- name: obj_out_matrix
  role: Final GEMM+bias+ReLU output
  data_type: dt_int32
  dimensions:
  - dim_m
  - dim_n
  producer: op_relu
  consumers:
  - external
  external: true
- name: obj_dims
  role: Runtime shape tuple (M,N,K)
  data_type: dt_u16
  dimensions: []
  producer: external
  consumers:
  - op_gemm_core
  - op_bias_add
  - op_relu
  external: true
dimensions:
- name: dim_m
  semantic: Output rows / A rows
  minimum: 1
  maximum: 256
  runtime_configurable: true
  bound_parameter: MAX_M
- name: dim_n
  semantic: Output cols / B cols / bias length
  minimum: 1
  maximum: 256
  runtime_configurable: true
  bound_parameter: MAX_N
- name: dim_k
  semantic: Reduction dimension / A cols / B rows
  minimum: 1
  maximum: 256
  runtime_configurable: true
  bound_parameter: MAX_K
parameters:
- name: MAX_M
  default_value: '64'
  legality_constraint: integer >=1 && integer <=256
  description: Maximum supported runtime M dimension.
- name: MAX_N
  default_value: '64'
  legality_constraint: integer >=1 && integer <=256
  description: Maximum supported runtime N dimension.
- name: MAX_K
  default_value: '64'
  legality_constraint: integer >=1 && integer <=256
  description: Maximum supported runtime K dimension.
- name: TILE_M
  default_value: '8'
  legality_constraint: integer >=1 && integer <=MAX_M
  description: Row tile size for compute engine.
- name: TILE_N
  default_value: '8'
  legality_constraint: integer >=1 && integer <=MAX_N
  description: Column tile size for compute engine.
- name: ACC_W
  default_value: '32'
  legality_constraint: integer == 32
  description: Accumulator/output width.
compute:
  organization: Single-core tiled GEMM engine with local scratchpads and MAC grid
    sized TILE_M x TILE_N (time-multiplexed across K).
  dataflow: Output-stationary within tile; accumulators retained locally across full
    K sweep.
  parallelism: Up to TILE_M*TILE_N parallel MACs per cycle when A-row vector and B-col
    vector are available.
  scheduling: 'Phase order per job: load config -> load bias -> tiled loops over (m_tile,n_tile):
    zero acc, for k in K load A/B slices and MAC, then bias+ReLU, then stream out
    tile.'
storage:
- name: buf_a_tile
  stored_objects:
  - obj_a_matrix
  capacity_expression: TILE_M
  capacity_at_default_parameters: 8
  access_pattern: Read TILE_M int8 values per K step, refill each K step.
  port_requirements: 1 write vector port from ingress staging, 1 read vector port
    to MAC.
  implementation_hint: Register file or small SRAM with banking by row.
  reuse_semantics: Reused across all n_tile for current m_tile and k step only if
    scheduled preload retained for cycle; otherwise reloaded per step.
  lifetime: One K step within active tile computation.
- name: buf_b_tile
  stored_objects:
  - obj_b_matrix
  capacity_expression: TILE_N
  capacity_at_default_parameters: 8
  access_pattern: Read TILE_N int8 values per K step, refill each K step.
  port_requirements: 1 write vector port from ingress staging, 1 read vector port
    to MAC.
  implementation_hint: Register file or small SRAM with banking by column.
  reuse_semantics: Reused across all m_tile for current n_tile and k step only if
    retained in schedule; baseline reload each step.
  lifetime: One K step within active tile computation.
- name: buf_bias_full
  stored_objects:
  - obj_bias_vector
  capacity_expression: MAX_N
  capacity_at_default_parameters: 64
  access_pattern: Sequential load once per job; random/strided read by n index during
    output finalize.
  port_requirements: 1 write port ingress, 1 read port finalize stage.
  implementation_hint: Single-port SRAM acceptable with time-separated read/write
    phases.
  reuse_semantics: Loaded once per job and reused for every output row.
  lifetime: Entire job.
- name: buf_acc_tile
  stored_objects:
  - obj_acc_matrix
  capacity_expression: TILE_M*TILE_N
  capacity_at_default_parameters: 64
  access_pattern: Initialize to zero, read-modify-write each K step, read once at
    finalize.
  port_requirements: At least TILE_M*TILE_N accumulator registers or equivalent multiport/banked
    storage to sustain parallel MAC updates.
  implementation_hint: Register array preferred.
  reuse_semantics: Holds partial sums across full K loop for one output tile.
  lifetime: From tile start until tile output emission.
pipeline:
- stage: s0_ingress
  responsibility: Accept config and stream payload words into loaders/scratchpads.
  registered: true
  valid_behavior: Consumes input when in_valid&&in_ready.
  stall_behavior: Holds internal write enables low; no state advance without transfer.
- stage: s1_compute
  responsibility: Perform tiled MAC accumulation into acc tile buffer.
  registered: true
  valid_behavior: Advances k/tile counters only when operand slices available and
    compute_enable true.
  stall_behavior: Freezes counters and accumulator write indices; accumulator contents
    unchanged.
- stage: s2_finalize
  responsibility: Add bias and apply ReLU for each tile element.
  registered: true
  valid_behavior: Produces finalized int32 elements with tile order metadata.
  stall_behavior: Retains pending finalized element until downstream ready.
- stage: s3_egress
  responsibility: Stream output matrix elements.
  registered: true
  valid_behavior: Transfers output on out_valid&&out_ready.
  stall_behavior: Keeps out_valid asserted and payload stable while waiting.
control:
  strategy: Central FSM with nested counters for phase and dimensions.
  state_progression: IDLE->LOAD_CFG->LOAD_BIAS->LOAD_A_B_AND_COMPUTE(looped over tiles
    and K)->FINALIZE_TILE->OUTPUT_TILE->DONE->IDLE.
  counters:
  - cnt_m
  - cnt_n
  - cnt_k
  - cnt_tile_m
  - cnt_tile_n
  - cnt_bias_load
  - cnt_out
  error_behavior: If runtime M/N/K is 0 or exceeds MAX_* or protocol order invalid,
    raise error flag and enter ERROR state; ignore payload transfers except status
    reads.
  error_recovery: Recovery via synchronous reset only.
reset:
  style: synchronous
  polarity: active_low
  required_state: FSM to IDLE, valid flags deasserted, counters zeroed, error flag
    cleared, no requirement to clear data SRAM contents.
latency_model: 'Variable latency: L = config_load + bias_load(N) + sum_tiles( K*(load_step+mac_step)
  + finalize_step + output_step ) with backpressure-dependent extension.'
architectural_invariants:
- 'Computation is exact integer sequence: GEMM then bias add then ReLU.'
- Bias is applied once per output element after full K accumulation.
- Output ordering is row-major over M then N.
- No output transfer occurs before corresponding full accumulation and finalize complete.
open_assumptions:
- Single input stream is packetized with explicit section tags for config, bias, A,
  B.
- A and B payload are provided in compute-consumption order required by scheduler
  (no global full-matrix storage required).
- Accumulator overflow uses two's-complement wrap as no saturation requirement was
  specified.
- Error recovery is reset-only because no explicit clear command was requested.
