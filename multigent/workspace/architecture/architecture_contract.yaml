design:
  name: gemm_bias_relu_npu
  version: '1.0'
  description: Parameterized single-core GEMM engine performing int8*int8 accumulation
    to int32, optional per-output-column int32 bias add, then ReLU clamp to nonnegative
    int32.
operations:
- name: op_gemm_accumulate
  kind: compute
  semantics: For each output element C[m,n], compute S[m,n]=sum_{k=0..K-1}(A[m,k]*B[k,n])
    with signed int8 operands and signed int32 accumulator; exact integer arithmetic
    with no rounding; intermediate product is signed int16 then sign-extended to int32
    before accumulation.
  inputs:
  - obj_a_stream
  - obj_b_stream
  - obj_cmd
  outputs:
  - obj_accum_matrix
- name: op_bias_add
  kind: compute
  semantics: For each C position, T[m,n]=S[m,n]+Bias[n] when bias_enable=1 else T[m,n]=S[m,n].
    Signed int32 add with 2s-complement wrap on overflow.
  inputs:
  - obj_accum_matrix
  - obj_bias_stream
  - obj_cmd
  outputs:
  - obj_bias_matrix
- name: op_relu
  kind: compute
  semantics: Y[m,n]=max(0,T[m,n]) in signed int32 domain.
  inputs:
  - obj_bias_matrix
  outputs:
  - obj_out_stream
data_types:
- name: dt_int8
  role: input elements A/B
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: No implicit conversion on ingress; consumed as signed 8-bit.
  overflow_semantics: N/A for storage type
  rounding_semantics: N/A
- name: dt_int32
  role: accumulator/bias/output
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: int16 product sign-extended to int32 before accumulate.
  overflow_semantics: 2s-complement wrap for int32 add
  rounding_semantics: exact integer (no rounding)
- name: dt_cmd
  role: job control packet
  width_bits: 96
  signed: false
  representation: bitfield
  conversion_semantics: Fields decoded by fixed bit slices.
  overflow_semantics: N/A
  rounding_semantics: N/A
data_objects:
- name: obj_cmd
  role: runtime job configuration
  data_type: dt_cmd
  dimensions: []
  producer: external
  consumers:
  - op_gemm_accumulate
  - op_bias_add
  external: true
- name: obj_a_stream
  role: A matrix elements
  data_type: dt_int8
  dimensions:
  - dim_M
  - dim_K
  producer: external
  consumers:
  - op_gemm_accumulate
  external: true
- name: obj_b_stream
  role: B matrix elements
  data_type: dt_int8
  dimensions:
  - dim_K
  - dim_N
  producer: external
  consumers:
  - op_gemm_accumulate
  external: true
- name: obj_bias_stream
  role: Bias vector elements indexed by N
  data_type: dt_int32
  dimensions:
  - dim_N
  producer: external
  consumers:
  - op_bias_add
  external: true
- name: obj_accum_matrix
  role: post-GEMM pre-bias matrix
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_gemm_accumulate
  consumers:
  - op_bias_add
  external: false
- name: obj_bias_matrix
  role: post-bias pre-relu matrix
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_bias_add
  consumers:
  - op_relu
  external: false
- name: obj_out_stream
  role: output matrix after bias/relu
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_relu
  consumers:
  - external
  external: true
dimensions:
- name: dim_M
  semantic: rows of A and output rows; runtime legal range 1..MAX_M
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_M
- name: dim_N
  semantic: columns of B and output columns; runtime legal range 1..MAX_N
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_N
- name: dim_K
  semantic: shared reduction dimension; runtime legal range 1..MAX_K
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_K
parameters:
- name: MAX_M
  default_value: '64'
  legality_constraint: integer >=1
  description: Compile-time upper bound for runtime M.
- name: MAX_N
  default_value: '64'
  legality_constraint: integer >=1
  description: Compile-time upper bound for runtime N.
- name: MAX_K
  default_value: '64'
  legality_constraint: integer >=1
  description: Compile-time upper bound for runtime K.
- name: TILE_N
  default_value: '8'
  legality_constraint: integer >=1 and <=MAX_N
  description: Number of output columns processed in parallel in compute core.
compute:
  organization: Tiled dot-product engine with TILE_N parallel lanes sharing one A
    element broadcast per K step.
  dataflow: For each row m and N-tile, iterate k to accumulate lane-local sums; then
    bias/relu and emit.
  parallelism: Spatial parallelism across N lanes = TILE_N; temporal iteration over
    M,K and N tiles.
  scheduling: 'Load-all then compute/emit: phase 1 load A,B,(bias optional), phase
    2 compute and stream outputs; no overlap between load and compute.'
storage:
- name: buf_A
  stored_objects:
  - obj_a_stream
  capacity_expression: MAX_M*MAX_K elements of dt_int8
  capacity_at_default_parameters: 4096
  access_pattern: Write during A load in row-major A[m][k]; read sequential by m,k
    during compute.
  port_requirements: 1R1W logical (simple dual-port RAM acceptable)
  implementation_hint: SRAM or inferred block RAM
  reuse_semantics: Each A element reused across all N tiles for same m,k.
  lifetime: One job from load completion to job completion.
- name: buf_B
  stored_objects:
  - obj_b_stream
  capacity_expression: MAX_K*MAX_N elements of dt_int8
  capacity_at_default_parameters: 4096
  access_pattern: Write during B load in row-major B[k][n]; read TILE_N elements per
    cycle across n-lane slice at fixed k.
  port_requirements: Read bandwidth TILE_N elements/cycle via banking or wide word
    organization; plus write bandwidth 1 element/cycle during load phase
  implementation_hint: Banked SRAM/BRAM with TILE_N banks
  reuse_semantics: Each B element reused across all M rows.
  lifetime: One job.
- name: buf_bias
  stored_objects:
  - obj_bias_stream
  capacity_expression: MAX_N elements of dt_int32
  capacity_at_default_parameters: 64
  access_pattern: Write during bias load when enabled; read per output element by
    n index.
  port_requirements: 1R1W logical
  implementation_hint: Register file or small SRAM
  reuse_semantics: Each bias[n] reused across all M rows.
  lifetime: One job when bias_enable=1; ignored otherwise.
- name: reg_acc_lane
  stored_objects:
  - obj_accum_matrix
  - obj_bias_matrix
  capacity_expression: TILE_N elements of dt_int32
  capacity_at_default_parameters: 8
  access_pattern: Per-lane clear at tile start; accumulate each k; then bias/relu
    in place and stream.
  port_requirements: Per-lane read/write each cycle
  implementation_hint: Flip-flop array
  reuse_semantics: Holds one output row-tile partial/final results.
  lifetime: From tile start until tile outputs emitted.
pipeline:
- stage: s_cmd
  responsibility: Latch and validate command fields.
  registered: true
  valid_behavior: Command accepted on cmd_valid&&cmd_ready and transitions FSM to
    load.
  stall_behavior: If not ready, cmd payload must remain stable externally; internal
    state unchanged.
- stage: s_load
  responsibility: Ingest A/B/(bias) streams into local buffers with element counters.
  registered: true
  valid_behavior: Each input transfer occurs on valid&&ready; write pointer increments
    once per transfer.
  stall_behavior: On missing valid or deasserted ready, counters and write pointers
    hold.
- stage: s_compute
  responsibility: Run nested loops m, n_tile, k; perform int8xint8 MAC into lane accumulators.
  registered: true
  valid_behavior: When active, one k-step per cycle updates all active lanes.
  stall_behavior: Compute not backpressured internally; egress separated after finalize
    per tile.
- stage: s_emit
  responsibility: Apply bias/relu for tile and stream int32 outputs.
  registered: true
  valid_behavior: Output advances on out_valid&&out_ready.
  stall_behavior: On out_ready low, hold current output data/indices and do not advance.
control:
  strategy: Single FSM controlling phase progression and loop counters.
  state_progression: IDLE->LOAD_A->LOAD_B->LOAD_BIAS(optional)->COMPUTE->EMIT->DONE->IDLE
  counters:
  - cnt_a:0..M*K
  - cnt_b:0..K*N
  - cnt_bias:0..N
  - idx_m:0..M-1
  - idx_ntile:0..ceil(N/TILE_N)-1
  - idx_k:0..K-1
  - idx_lane:0..TILE_N-1
  error_behavior: Protocol/legality errors raise sticky error_flag and halt acceptance
    of new payloads for current job.
  error_recovery: Return to IDLE only via reset; no in-band clear command.
reset:
  style: synchronous
  polarity: active_low
  required_state: FSM=IDLE, ready signals to accept new command, counters/pointers
    zeroed, valid outputs deasserted, error_flag cleared; memory contents treated
    invalid until reloaded.
latency_model: Total cycles per job = 1(cmd)+M*K(load A)+K*N(load B)+bias_enable*N(load
  bias)+M*ceil(N/TILE_N)*(K + active_lane_emit), where active_lane_emit is TILE_N
  for full tile and N%TILE_N for final partial tile (or TILE_N if divisible). No load/compute
  overlap.
architectural_invariants:
- Exactly one job in flight.
- A and B must be fully loaded before compute starts.
- Output order is strict row-major over (m,n).
- Final partial N tile emits only lanes with n<N; inactive lanes produce no transfer.
- Bias indexing depends only on n, shared across rows.
open_assumptions:
- Single clock domain.
- Host provides streams in required load order without gaps or with valid/ready compliance.
- bias_enable field in command selects whether bias stream is required.
- No quantization/scaling beyond requested int32 output.
