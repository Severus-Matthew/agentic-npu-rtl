design:
  name: gemm_bias_relu_npu
  version: '1.0'
  description: Parameterized int8 GEMM with int32 accumulation, optional int32 bias
    add, and ReLU; stream-commanded accelerator with on-chip operand buffering.
operations:
- name: op_load_a
  kind: data_movement
  semantics: Load matrix A elements into local A buffer in row-major order for dimensions
    MxK.
  inputs:
  - obj_a_stream
  outputs:
  - obj_a_buffered
- name: op_load_b
  kind: data_movement
  semantics: Load matrix B elements into local B buffer in row-major order for dimensions
    KxN.
  inputs:
  - obj_b_stream
  outputs:
  - obj_b_buffered
- name: op_load_bias
  kind: data_movement
  semantics: Load bias vector elements into local bias buffer for dimension N.
  inputs:
  - obj_bias_stream
  outputs:
  - obj_bias_buffered
- name: op_gemm
  kind: compute
  semantics: 'For each (m,n): acc32=0; for k in [0,K-1] acc32 += sext8(A[m,k]) * sext8(B[k,n]).'
  inputs:
  - obj_a_buffered
  - obj_b_buffered
  outputs:
  - obj_accum_matrix
- name: op_bias_add
  kind: compute
  semantics: 'For each (m,n): sum32 = accum_matrix[m,n] + bias[n] when bias_enable=1
    else sum32=accum_matrix[m,n]. 32-bit signed wrap on overflow.'
  inputs:
  - obj_accum_matrix
  - obj_bias_buffered
  outputs:
  - obj_post_bias_matrix
- name: op_relu
  kind: compute
  semantics: 'For each (m,n): out32 = max(sum32,0) when relu_enable=1 else out32=sum32.'
  inputs:
  - obj_post_bias_matrix
  outputs:
  - obj_output_matrix
- name: op_store_c
  kind: data_movement
  semantics: Emit output matrix C elements in row-major order for dimensions MxN.
  inputs:
  - obj_output_matrix
  outputs:
  - obj_c_stream
data_types:
- name: dt_int8
  role: A/B elements
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: sign-extend to dt_int32 before multiply
  overflow_semantics: wrap
  rounding_semantics: exact_integer
- name: dt_int32
  role: accumulator/bias/output
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: native
  overflow_semantics: wrap
  rounding_semantics: exact_integer
- name: dt_cmd
  role: job command word
  width_bits: 128
  signed: false
  representation: bitfield
  conversion_semantics: bit-exact decode
  overflow_semantics: not_applicable
  rounding_semantics: not_applicable
- name: dt_status
  role: status word
  width_bits: 32
  signed: false
  representation: bitfield
  conversion_semantics: bit-exact encode
  overflow_semantics: not_applicable
  rounding_semantics: not_applicable
data_objects:
- name: obj_cmd
  role: job configuration
  data_type: dt_cmd
  dimensions: []
  producer: external
  consumers:
  - op_load_a
  - op_load_b
  - op_load_bias
  - op_gemm
  - op_bias_add
  - op_relu
  - op_store_c
  external: true
- name: obj_a_stream
  role: A payload stream
  data_type: dt_int8
  dimensions:
  - dim_M
  - dim_K
  producer: external
  consumers:
  - op_load_a
  external: true
- name: obj_b_stream
  role: B payload stream
  data_type: dt_int8
  dimensions:
  - dim_K
  - dim_N
  producer: external
  consumers:
  - op_load_b
  external: true
- name: obj_bias_stream
  role: bias payload stream
  data_type: dt_int32
  dimensions:
  - dim_N
  producer: external
  consumers:
  - op_load_bias
  external: true
- name: obj_a_buffered
  role: local A
  data_type: dt_int8
  dimensions:
  - dim_M
  - dim_K
  producer: op_load_a
  consumers:
  - op_gemm
  external: false
- name: obj_b_buffered
  role: local B
  data_type: dt_int8
  dimensions:
  - dim_K
  - dim_N
  producer: op_load_b
  consumers:
  - op_gemm
  external: false
- name: obj_bias_buffered
  role: local bias
  data_type: dt_int32
  dimensions:
  - dim_N
  producer: op_load_bias
  consumers:
  - op_bias_add
  external: false
- name: obj_accum_matrix
  role: gemm accum
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_gemm
  consumers:
  - op_bias_add
  external: false
- name: obj_post_bias_matrix
  role: post-bias
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_bias_add
  consumers:
  - op_relu
  external: false
- name: obj_output_matrix
  role: final output matrix
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_relu
  consumers:
  - op_store_c
  external: false
- name: obj_c_stream
  role: C payload stream
  data_type: dt_int32
  dimensions:
  - dim_M
  - dim_N
  producer: op_store_c
  consumers:
  - external
  external: true
- name: obj_status
  role: completion/error status
  data_type: dt_status
  dimensions: []
  producer: op_store_c
  consumers:
  - external
  external: true
dimensions:
- name: dim_M
  semantic: rows of A and C
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_M
- name: dim_N
  semantic: columns of B and C
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_N
- name: dim_K
  semantic: shared reduction dimension
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_K
parameters:
- name: MAX_M
  default_value: '64'
  legality_constraint: integer, 1<=MAX_M<=256
  description: maximum supported M
- name: MAX_N
  default_value: '64'
  legality_constraint: integer, 1<=MAX_N<=256
  description: maximum supported N
- name: MAX_K
  default_value: '64'
  legality_constraint: integer, 1<=MAX_K<=256
  description: maximum supported K
- name: LANES_N
  default_value: '8'
  legality_constraint: integer, 1<=LANES_N<=MAX_N
  description: parallel output columns computed per inner-loop step
- name: CMD_WIDTH
  default_value: '128'
  legality_constraint: CMD_WIDTH==128
  description: command channel payload width
- name: STATUS_WIDTH
  default_value: '32'
  legality_constraint: STATUS_WIDTH==32
  description: status channel payload width
compute:
  organization: single-core FSM-controlled vector-dot-product engine
  dataflow: output-stationary over one C row chunk of LANES_N columns
  parallelism: LANES_N parallel int8xint8 multipliers with int32 accumulators
  scheduling: 'phase schedule: load A, load B, optional load bias, compute all C,
    stream out C'
storage:
- name: buf_a
  stored_objects:
  - obj_a_buffered
  capacity_expression: MAX_M*MAX_K elements of dt_int8
  capacity_at_default_parameters: 4096
  access_pattern: write sequential during load; read as A[m,k] during compute
  port_requirements: 1R/1W (or true dual-port)
  implementation_hint: SRAM or inferred RAM
  reuse_semantics: each A element reused across N outputs
  lifetime: job scope
- name: buf_b
  stored_objects:
  - obj_b_buffered
  capacity_expression: MAX_K*MAX_N elements of dt_int8
  capacity_at_default_parameters: 4096
  access_pattern: write sequential during load; read LANES_N contiguous columns for
    fixed k
  port_requirements: read bandwidth LANES_N elements/cycle via banking/replication
    plus 1W load path
  implementation_hint: banked SRAM
  reuse_semantics: each B element reused across M outputs
  lifetime: job scope
- name: buf_bias
  stored_objects:
  - obj_bias_buffered
  capacity_expression: MAX_N elements of dt_int32
  capacity_at_default_parameters: 64
  access_pattern: write sequential during load; read LANES_N contiguous per output
    chunk
  port_requirements: read bandwidth LANES_N elements/cycle when bias enabled
  implementation_hint: register file or banked RAM
  reuse_semantics: bias reused for all M rows
  lifetime: job scope
- name: buf_acc
  stored_objects:
  - obj_accum_matrix
  - obj_post_bias_matrix
  - obj_output_matrix
  capacity_expression: LANES_N elements of dt_int32 accumulators plus output skid
    FIFO depth 2*LANES_N
  capacity_at_default_parameters: 24
  access_pattern: accumulators cleared per chunk, updated each k, finalized and pushed
    to output FIFO
  port_requirements: LANES_N parallel accumulator update paths
  implementation_hint: register array + small FIFO
  reuse_semantics: ephemeral per output chunk
  lifetime: inner compute/output phases
pipeline:
- stage: s0_ingress
  responsibility: accept/decode command and stream payloads into local buffers
  registered: true
  valid_behavior: ingress transfer on ready&&valid
  stall_behavior: deassert ready when target buffer phase inactive/full
- stage: s1_compute
  responsibility: perform LANES_N MAC updates per cycle across k loop
  registered: true
  valid_behavior: one k-step update per cycle when compute_enable
  stall_behavior: hold m/n/k counters and accumulators when stalled
- stage: s2_postproc
  responsibility: apply optional bias and optional ReLU to finalized accumulators
  registered: true
  valid_behavior: process one LANES_N chunk at chunk-finalization
  stall_behavior: retain finalized chunk until output FIFO has space
- stage: s3_egress
  responsibility: stream int32 outputs and terminal status
  registered: true
  valid_behavior: emit on ready&&valid
  stall_behavior: hold payload stable while valid=1 and ready=0
control:
  strategy: single FSM with phase and nested counters
  state_progression: IDLE->LOAD_A->LOAD_B->(LOAD_BIAS if bias_enable)->COMPUTE->OUTPUT->DONE->IDLE;
    ERROR reachable from any active state
  counters:
  - cnt_a:0..M*K-1
  - cnt_b:0..K*N-1
  - cnt_bias:0..N-1
  - idx_m:0..M-1
  - idx_n_chunk:0..ceil(N/LANES_N)-1
  - idx_k:0..K-1
  - cnt_out:0..M*N-1
  error_behavior: illegal command fields, runtime dimensions out of range, unexpected
    stream during wrong phase, or premature TLAST assert error status and enter ERROR
  error_recovery: software issues soft reset via rst_n assertion; after reset FSM
    returns to IDLE and clears status/error latches
reset:
  style: synchronous
  polarity: active_low
  required_state: FSM=IDLE, valid outputs low, counters zero, error/status cleared,
    buffer write pointers zero; memory contents unspecified
latency_model: Total cycles = cmd_accept(1)+loadA(M*K)+loadB(K*N)+bias_enable*loadBias(N)+compute(M*ceil(N/LANES_N)*K)+postproc(M*ceil(N/LANES_N))+egress(M*N).
  Compute/output do not overlap in baseline schedule.
architectural_invariants:
- All arithmetic is exact integer two's-complement with wrap on 32-bit add/macc overflow.
- A and B must be fully loaded before compute starts.
- Output order is strict row-major C[m][n] ascending n then m.
- Transfer condition for all streaming channels is ready&&valid with stable payload
  under stall.
open_assumptions:
- Single outstanding job; no command queueing.
- 'Host sends sections in required order: command, A payload, B payload, optional
  bias payload.'
- Bias and ReLU enables are per-job command bits.
- When N is not divisible by LANES_N, inactive lanes in final chunk are masked and
  no output beats are produced for invalid lanes.
