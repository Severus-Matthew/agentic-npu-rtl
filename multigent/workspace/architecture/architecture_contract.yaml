design:
  name: gemm_bias_relu_npu
  version: '1.0'
  description: Parameterized int8 GEMM with int32 bias add and ReLU output stream
    interface.
operations:
- name: load_config
  kind: control
  semantics: Latch per-job dimensions M,N,K after command transfer and validate bounds.
  inputs:
  - cmd_word
  outputs:
  - job_config
- name: gemm_core
  kind: compute
  semantics: For each output element C[m,n], compute accumulator = sum_{k=0..K-1}(A[m,k]*B[k,n])
    using signed int8 operands and signed int32 accumulation.
  inputs:
  - a_matrix
  - b_matrix
  - job_config
  outputs:
  - gemm_accum_matrix
- name: bias_add
  kind: compute
  semantics: For each output element, add signed int32 bias[n] to gemm accumulator
    with two's-complement wrap on overflow.
  inputs:
  - gemm_accum_matrix
  - bias_vector
  - job_config
  outputs:
  - biased_matrix
- name: relu
  kind: compute
  semantics: For each output element, if biased value < 0 output 0 else output biased
    value.
  inputs:
  - biased_matrix
  outputs:
  - output_matrix
data_types:
- name: int8_s
  role: input elements A/B
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: No implicit conversion; operands sign-extended before multiply.
  overflow_semantics: wrap
  rounding_semantics: not_applicable
- name: int32_s
  role: accumulator/bias/output
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: Products widened to int32 before accumulation.
  overflow_semantics: wrap
  rounding_semantics: not_applicable
- name: cmd_u32
  role: command word
  width_bits: 32
  signed: false
  representation: unsigned_binary
  conversion_semantics: Bitfield decode only.
  overflow_semantics: not_applicable
  rounding_semantics: not_applicable
data_objects:
- name: cmd_word
  role: job command transfer
  data_type: cmd_u32
  dimensions: []
  producer: external
  consumers:
  - load_config
  external: true
- name: job_config
  role: latched dimensions
  data_type: cmd_u32
  dimensions: []
  producer: load_config
  consumers:
  - gemm_core
  - bias_add
  external: false
- name: a_matrix
  role: left operand matrix
  data_type: int8_s
  dimensions:
  - M
  - K
  producer: external
  consumers:
  - gemm_core
  external: true
- name: b_matrix
  role: right operand matrix
  data_type: int8_s
  dimensions:
  - K
  - N
  producer: external
  consumers:
  - gemm_core
  external: true
- name: bias_vector
  role: per-column bias
  data_type: int32_s
  dimensions:
  - N
  producer: external
  consumers:
  - bias_add
  external: true
- name: gemm_accum_matrix
  role: raw GEMM accumulators
  data_type: int32_s
  dimensions:
  - M
  - N
  producer: gemm_core
  consumers:
  - bias_add
  external: false
- name: biased_matrix
  role: post-bias intermediate
  data_type: int32_s
  dimensions:
  - M
  - N
  producer: bias_add
  consumers:
  - relu
  external: false
- name: output_matrix
  role: final ReLU outputs
  data_type: int32_s
  dimensions:
  - M
  - N
  producer: relu
  consumers:
  - external
  external: true
dimensions:
- name: M
  semantic: output rows / A rows
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_M
- name: N
  semantic: output cols / B cols / bias length
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_N
- name: K
  semantic: reduction dimension / A cols / B rows
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_K
parameters:
- name: MAX_M
  default_value: '64'
  legality_constraint: integer >= 1
  description: Maximum runtime M
- name: MAX_N
  default_value: '64'
  legality_constraint: integer >= 1
  description: Maximum runtime N
- name: MAX_K
  default_value: '64'
  legality_constraint: integer >= 1
  description: Maximum runtime K
- name: LANES_N
  default_value: '4'
  legality_constraint: integer >= 1 and <= MAX_N
  description: Parallel output columns computed per inner-loop step
compute:
  organization: FSM-controlled iterative datapath with LANES_N parallel MAC lanes
    sharing one A operand per cycle.
  dataflow: Output-stationary across K loop for each (m, n-lane group).
  parallelism: Column-lane SIMD parallelism only.
  scheduling: 'Phase order: command -> load A/B/bias memories -> compute -> stream
    output.'
storage:
- name: a_mem
  stored_objects:
  - a_matrix
  capacity_expression: MAX_M*MAX_K elements of int8_s
  capacity_at_default_parameters: 4096
  access_pattern: Sequential write during load; read A[m,k] during compute.
  port_requirements: 1R/1W simple dual-port
  implementation_hint: SRAM or inferred block RAM
  reuse_semantics: Each loaded A element reused across ceil(N/LANES_N) lane groups.
  lifetime: One job
- name: b_mem
  stored_objects:
  - b_matrix
  capacity_expression: MAX_K*MAX_N elements of int8_s
  capacity_at_default_parameters: 4096
  access_pattern: Sequential write during load; LANES_N reads per compute cycle at
    fixed k and n-group.
  port_requirements: Read bandwidth LANES_N elements/cycle via banking or word-packed
    memory
  implementation_hint: Banked SRAM or wide-word RAM
  reuse_semantics: Each loaded B element reused across all M rows.
  lifetime: One job
- name: bias_mem
  stored_objects:
  - bias_vector
  capacity_expression: MAX_N elements of int32_s
  capacity_at_default_parameters: 64
  access_pattern: Sequential write during load; LANES_N reads at output finalize.
  port_requirements: Read bandwidth LANES_N elements/cycle via banking or wide-word
    memory
  implementation_hint: Register file or SRAM
  reuse_semantics: Each bias reused across all M rows.
  lifetime: One job
- name: accum_mem
  stored_objects:
  - gemm_accum_matrix
  - biased_matrix
  - output_matrix
  capacity_expression: MAX_M*MAX_N elements of int32_s
  capacity_at_default_parameters: 4096
  access_pattern: Initialize per output group then K-cycle updates; finalize then
    read for output stream.
  port_requirements: At least 1 write path for compute updates and 1 read path for
    output phase (time-multiplexed by phase)
  implementation_hint: SRAM or inferred block RAM
  reuse_semantics: Accumulator persists for full K reduction and until output emission.
  lifetime: One job
pipeline:
- stage: ingress
  responsibility: Accept command and input payload streams into local memories.
  registered: true
  valid_behavior: Capture on ready&&valid.
  stall_behavior: Deassert ready when target memory/load counter not available.
- stage: compute
  responsibility: Run nested loops m,n_group,k; perform multiply-accumulate.
  registered: true
  valid_behavior: Advance indices only on active compute cycle.
  stall_behavior: Internal no-stall phase; external channels ignored.
- stage: postprocess
  responsibility: Bias add then ReLU on finalized accumulators.
  registered: true
  valid_behavior: One lane-group finalize step per cycle.
  stall_behavior: Hold state until downstream output stage accepts data if coupled.
- stage: egress
  responsibility: Stream output_matrix in row-major order.
  registered: true
  valid_behavior: Transfer on out_valid&&out_ready.
  stall_behavior: Hold out_valid and out_data stable until accepted.
control:
  strategy: Single top-level FSM with phase and nested counters.
  state_progression: IDLE->LOAD_CMD->LOAD_A->LOAD_B->LOAD_BIAS->COMPUTE->OUTPUT->DONE->IDLE
  counters:
  - m_idx
  - n_group_idx
  - k_idx
  - load_count
  - out_count
  error_behavior: If command dimensions exceed MAX_* or zero, set error flag, enter
    DONE without compute, status reports error.
  error_recovery: Host issues new valid command while in IDLE to clear error flag
    and start next job.
reset:
  style: synchronous
  polarity: active_low
  required_state: FSM=IDLE, all valids low, counters zeroed, error flag cleared, configuration
    invalid.
latency_model: 'For one job: 1 cmd beat + (M*K) A beats + (K*N) B beats + N bias beats
  + (M*ceil(N/LANES_N)*K) compute cycles + (M*N) output beats; no load/compute overlap
  in baseline architecture.'
architectural_invariants:
- Arithmetic is exact integer two's-complement with wrap on int32 overflow.
- Bias and ReLU are applied to every GEMM output element before emission.
- 'Output ordering is strict row-major: n increments fastest within each row m.'
- All operands required for a job are loaded once and retained locally; no retransmission
  during compute.
open_assumptions:
- Single outstanding job only.
- 'Command encoding uses one 32-bit word: bits[7:0]=M, bits[15:8]=N, bits[23:16]=K,
  bits[31:24] reserved must be zero.'
- External data streams provide one scalar element per accepted transfer.
- No asynchronous clear/retry signal; recovery via next command in IDLE.
