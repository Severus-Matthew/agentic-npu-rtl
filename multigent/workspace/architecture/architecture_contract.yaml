design:
  name: gemm_bias_relu_npu
  version: '1.0'
  description: Synthesizable int8 GEMM with int32 bias add and ReLU activation using
    streaming tiles.
operations:
- name: gemm_core
  kind: matrix_multiply_accumulate
  semantics: Compute C[m,n] = sum_{k=0..K-1}(A[m,k]*B[k,n]) with A,B as signed int8
    and accumulation in signed int32.
  inputs:
  - A_elem_int8
  - B_elem_int8
  - dim_M
  - dim_N
  - dim_K
  outputs:
  - acc_int32_matrix
- name: bias_add
  kind: elementwise_add
  semantics: Compute Cb[m,n] = C[m,n] + Bias[n], Bias is signed int32 broadcast across
    M.
  inputs:
  - acc_int32_matrix
  - Bias_int32_vector
  - dim_M
  - dim_N
  outputs:
  - biased_int32_matrix
- name: relu
  kind: elementwise_activation
  semantics: Compute Y[m,n] = max(0, Cb[m,n]) in signed int32 domain.
  inputs:
  - biased_int32_matrix
  - dim_M
  - dim_N
  outputs:
  - Y_int32_matrix
data_types:
- name: A_elem_int8
  role: input_activation_element
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: Consumed as-is.
  overflow_semantics: N/A
  rounding_semantics: N/A
- name: B_elem_int8
  role: input_weight_element
  width_bits: 8
  signed: true
  representation: two_complement
  conversion_semantics: Consumed as-is.
  overflow_semantics: N/A
  rounding_semantics: N/A
- name: mul_int16
  role: product_intermediate
  width_bits: 16
  signed: true
  representation: two_complement
  conversion_semantics: Exact signed multiply of two int8.
  overflow_semantics: No overflow for 8x8 product in 16 bits.
  rounding_semantics: N/A
- name: acc_int32
  role: dot_product_accumulator
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: Each int16 product sign-extended to int32 then added.
  overflow_semantics: Wrap on two_complement overflow.
  rounding_semantics: N/A
- name: Bias_int32
  role: bias_element
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: Consumed as-is.
  overflow_semantics: N/A
  rounding_semantics: N/A
- name: Y_int32
  role: output_element
  width_bits: 32
  signed: true
  representation: two_complement
  conversion_semantics: ReLU output from int32 biased sum.
  overflow_semantics: Inherited from prior add (wrap).
  rounding_semantics: N/A
dimensions:
- name: M
  semantic: rows of A and output Y
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_M
- name: N
  semantic: columns of B and output Y
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_N
- name: K
  semantic: inner reduction dimension
  minimum: 1
  maximum: 64
  runtime_configurable: true
  bound_parameter: MAX_K
parameters:
- name: MAX_M
  default_value: '64'
  legality_constraint: integer >=1
  description: Maximum runtime M.
- name: MAX_N
  default_value: '64'
  legality_constraint: integer >=1
  description: Maximum runtime N.
- name: MAX_K
  default_value: '64'
  legality_constraint: integer >=1
  description: Maximum runtime K.
- name: TILE_M
  default_value: '4'
  legality_constraint: integer >=1 and <=MAX_M
  description: Rows processed per tile.
- name: TILE_N
  default_value: '4'
  legality_constraint: integer >=1 and <=MAX_N
  description: Columns processed per tile.
compute:
  organization: Tiled SIMD MAC engine
  dataflow: Output-stationary within TILE_M x TILE_N tile across K loop
  parallelism: TILE_M*TILE_N parallel int8xint8 MAC lanes each cycle
  scheduling: Deterministic nested loops over tile_m, tile_n, k with one MAC step
    per cycle
storage:
- name: a_tile_buffer
  stores: A tile row elements for current k step
  capacity_expression: TILE_M elements
  maximum_elements: 4
  element_width_bits: 8
  access_pattern: Read all TILE_M each cycle at current k; refill per k/tile.
  port_requirements: 1 write path from input stream, TILE_M read fanout via register
    array
  implementation_hint: register array
  reuse_semantics: Each loaded A value reused across TILE_N MAC lanes in same row
    for cycle.
  lifetime: one k-step
- name: b_tile_buffer
  stores: B tile column elements for current k step
  capacity_expression: TILE_N elements
  maximum_elements: 4
  element_width_bits: 8
  access_pattern: Read all TILE_N each cycle at current k; refill per k/tile.
  port_requirements: 1 write path from input stream, TILE_N read fanout via register
    array
  implementation_hint: register array
  reuse_semantics: Each loaded B value reused across TILE_M MAC lanes in same column
    for cycle.
  lifetime: one k-step
- name: acc_tile_buffer
  stores: Partial sums for TILE_M x TILE_N outputs
  capacity_expression: TILE_M*TILE_N elements
  maximum_elements: 16
  element_width_bits: 32
  access_pattern: Read-modify-write each element every cycle during K accumulation.
  port_requirements: Implemented as per-lane registers enabling parallel update of
    all elements per cycle
  implementation_hint: register array
  reuse_semantics: Retained across full K loop, then consumed by bias/relu/output.
  lifetime: one output tile
- name: bias_buffer
  stores: Bias vector length N
  capacity_expression: MAX_N elements
  maximum_elements: 64
  element_width_bits: 32
  access_pattern: Sequential load once per job; random-access by output column index.
  port_requirements: 1 write stream port + up to TILE_N read per cycle via banking/replication
  implementation_hint: small SRAM or register file with replication
  reuse_semantics: Reused for all M rows of job.
  lifetime: entire job
pipeline:
- stage: s0_cmd
  responsibility: Latch command and dimensions when accepted.
  registered: true
  valid_behavior: valid set on cmd handshake.
  stall_behavior: Holds latched config until job completion.
- stage: s1_load
  responsibility: Ingest bias and A/B tile elements from input streams.
  registered: true
  valid_behavior: Advances on ready&&valid.
  stall_behavior: Backpressures inputs via ready deassertion when buffers full.
- stage: s2_mac
  responsibility: Parallel MAC update of acc_tile_buffer.
  registered: true
  valid_behavior: One K-step update when operands available.
  stall_behavior: Freezes k counter and accumulator state.
- stage: s3_post
  responsibility: Bias add then ReLU per accumulator lane.
  registered: true
  valid_behavior: Produces TILE_M*TILE_N outputs over sequenced emission.
  stall_behavior: Holds output payload stable while valid=1 and ready=0.
control:
  strategy: Central FSM with nested counters
  state_progression: IDLE->LOAD_BIAS->COMPUTE_TILES->EMIT_TILE->DONE->IDLE
  counters:
  - m_tile_idx
  - n_tile_idx
  - k_idx
  - emit_lane_idx
  - bias_load_idx
  - a_load_idx
  - b_load_idx
  error_behavior: Illegal command (dimension 0 or above max) sets status_error and
    refuses start until next reset or clear command.
reset:
  style: synchronous
  polarity: active_low
  required_state: FSM to IDLE, valids low, ready defaults per IDLE policy, counters
    zero, error cleared.
latency_model: 'Variable latency: setup (bias load) + sum over tiles of (K MAC cycles
  + load/emit overhead), with additional stalls under backpressure.'
architectural_invariants:
- No output transaction occurs unless corresponding computation complete.
- Output order is row-major over M then N.
- Transfer condition on streaming channels is ready&&valid only.
- Payload remains stable while stalled.
- Accumulator cleared before each new output tile accumulation.
open_assumptions:
- Single-job in-flight; no command queue.
- A and B provided as streams already ordered for tile scheduler needs.
- Bias loaded fully before compute starts.
- No quantization/downcast at output; output is int32.
- Overflow behavior is two's-complement wrap for int32 accumulation/add.
