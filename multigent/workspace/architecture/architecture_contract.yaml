design:
  name: int8_gemm_bias_relu_npu
  version: '1.0'
  description: Parameterizable dense GEMM engine with optional per-output-channel
    bias add and ReLU, using INT8 activations and weights with INT32 accumulation/output.
operation:
  kind: GEMM_BIAS_RELU
  equation: Y[m,n] = ReLU( sum_{k=0..K-1}( A[m,k] * B[k,n] ) + bias[n] )
  description: Matrix multiply A[MxK] by B[KxN], add bias per output column n, apply
    ReLU clamp at zero. Bias path is mandatory for this design profile.
numeric:
  activation_width: 8
  activation_signed: true
  weight_width: 8
  weight_signed: true
  accumulator_width: 32
  accumulator_signed: true
  overflow_semantics: Two's-complement wrap on 32-bit accumulator overflow during
    accumulation/add-bias; ReLU then outputs max(value,0) in INT32 domain.
  rounding_semantics: Exact integer arithmetic; no rounding, no quantization/truncation
    at output.
compute:
  organization: Output-stationary parallel MAC array with time-multiplexed K dimension
  rows: 4
  columns: 4
  mac_count: 16
  parameterization: 'Top-level parameters: M_MAX, N_MAX, K_MAX, ARRAY_ROWS=4, ARRAY_COLS=4,
    ACT_W=8, WGT_W=8, ACC_W=32. Runtime dimensions M,N,K provided per job and must
    satisfy 1<=M<=M_MAX, 1<=N<=N_MAX, 1<=K<=K_MAX.'
dataflow: 'Output-stationary tiled GEMM: each tile computes up to ARRAY_ROWS x ARRAY_COLS
  outputs. For each tile, accumulators reset to zero, consume K products, then bias
  add and ReLU, then stream out results. A and B are provided as element streams;
  internal address generators map elements to tile lanes.'
pipeline:
- stage: S0_INPUT_ACCEPT
  responsibility: Accept input elements/metadata on ready-valid channels into ingress
    FIFOs and job registers.
  registered: true
  valid_behavior: Transfers only on in_valid && in_ready. Payload must remain stable
    while in_valid=1 and in_ready=0.
- stage: S1_OPERAND_FETCH_ALIGN
  responsibility: Read/align A and B elements for active tile lanes; sign-extend INT8
    operands.
  registered: true
  valid_behavior: Lane-valid derived from active row/col masks and k-progress; stalls
    when downstream not ready.
- stage: S2_MUL
  responsibility: Compute signed INT8xINT8 products (16-bit signed).
  registered: true
  valid_behavior: Per-lane product_valid follows aligned lane-valid with one-cycle
    latency.
- stage: S3_ACCUMULATE
  responsibility: Accumulate products into INT32 per-lane accumulators across K iterations.
  registered: true
  valid_behavior: Accumulator update occurs when lane_valid=1; hold state under stall.
- stage: S4_POSTPROC
  responsibility: Add bias[n] (INT32) and apply ReLU.
  registered: true
  valid_behavior: Executed once per output element after final K accumulation for
    that element.
- stage: S5_OUTPUT_STREAM
  responsibility: Emit INT32 outputs with coordinates under ready-valid backpressure.
  registered: true
  valid_behavior: out_valid stays asserted with stable payload until out_ready handshake.
buffers:
- name: a_fifo
  role: Ingress buffering for A stream elements
  implementation_hint: small sync FIFO (register/LUTRAM inferred)
  depth: 32
  element_width: 8
- name: b_fifo
  role: Ingress buffering for B stream elements
  implementation_hint: small sync FIFO (register/LUTRAM inferred)
  depth: 32
  element_width: 8
- name: bias_mem
  role: Stores N bias values per job
  implementation_hint: register file or LUTRAM
  depth: 256
  element_width: 32
- name: accumulator_file
  role: Holds partial sums for active output tile lanes
  implementation_hint: register array
  depth: 16
  element_width: 32
- name: out_fifo
  role: Decouple compute from output backpressure
  implementation_hint: sync FIFO
  depth: 32
  element_width: 32
control: 'Single centralized FSM with phases: IDLE->LOAD_CFG->LOAD_BIAS->COMPUTE_TILE(loop
  over tile_m,tile_n,k)->POSTPROC->DRAIN_OUT->DONE. Internal counters: m_idx,n_idx,k_idx,tile
  indices. Backpressure-aware: compute launch gated by output space availability and
  operand availability.'
reset:
  style: synchronous
  polarity: active_high
  required_state: 'On reset assertion: FSM=IDLE, all valids deasserted, ready signals
    driven per empty-buffer policy, counters cleared, accumulators cleared, FIFOs
    logically emptied.'
latency_model: Variable latency by M,N,K and backpressure. For a single output element
  without stalls, minimum datapath latency from final contributing operand acceptance
  to output valid is 4 cycles (S2-S5). Total job latency includes stream ingress,
  tiled K loop, and output draining.
architectural_invariants:
- Computation semantics fixed to Y=ReLU(A*B+bias) with per-column bias index n.
- A and B operands are signed INT8; products are signed INT16; accumulation/postproc
  in signed INT32.
- Accumulator overflow behavior is wrap (two's complement), not saturation.
- Output datatype is signed INT32 after ReLU (thus non-negative representable INT32).
- Handshake transfer condition is always ready && valid; no sideband transfer without
  handshake.
- Under backpressure, output payload and coordinates remain stable while out_valid=1
  and out_ready=0.
- Architecture is output-stationary tiled parallel MAC array; downstream agents may
  not change to different algorithmic semantics without architecture revision.
- Reset is synchronous active-high and must deterministically clear control/valid
  state.
open_assumptions:
- Bias is required for GEMM_BIAS_RELU path and provided as exactly N signed INT32
  values per job.
- 'Top-level stream ordering: A elements arrive row-major by (m,k), B elements arrive
  row-major by (k,n), outputs emitted row-major by (m,n).'
- Default array size chosen as 4x4 for baseline simplicity and synthesizability; parameterizable
  constants permit future retargeting.
- Single-clock domain design with one global clk; no CDC support in this milestone.
- No sparsity/compression/quantized output path included in this phase.
