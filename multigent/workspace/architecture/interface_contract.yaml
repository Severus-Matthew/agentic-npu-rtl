protocol: ready_valid
clock: clk (single rising-edge domain)
reset: rst (synchronous, active-high)
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: Global clock.
  reset_value: N/A
- name: rst
  direction: input
  width: '1'
  signed: false
  semantic: Synchronous active-high reset.
  reset_value: asserted drives module to required reset state
- name: cfg_valid
  direction: input
  width: '1'
  signed: false
  semantic: Configuration channel valid for {M,N,K}.
  reset_value: '0'
- name: cfg_ready
  direction: output
  width: '1'
  signed: false
  semantic: Configuration channel ready.
  reset_value: 1 when idle
- name: cfg_M
  direction: input
  width: $clog2(M_MAX+1)
  signed: false
  semantic: Rows of A / Y.
  reset_value: '0'
- name: cfg_N
  direction: input
  width: $clog2(N_MAX+1)
  signed: false
  semantic: Columns of B / Y.
  reset_value: '0'
- name: cfg_K
  direction: input
  width: $clog2(K_MAX+1)
  signed: false
  semantic: Shared reduction dimension.
  reset_value: '0'
- name: bias_valid
  direction: input
  width: '1'
  signed: false
  semantic: Bias stream valid.
  reset_value: '0'
- name: bias_ready
  direction: output
  width: '1'
  signed: false
  semantic: Bias stream ready.
  reset_value: '0'
- name: bias_data
  direction: input
  width: '32'
  signed: true
  semantic: Bias value for next n index.
  reset_value: '0'
- name: a_valid
  direction: input
  width: '1'
  signed: false
  semantic: A operand stream valid.
  reset_value: '0'
- name: a_ready
  direction: output
  width: '1'
  signed: false
  semantic: A operand stream ready.
  reset_value: '0'
- name: a_data
  direction: input
  width: '8'
  signed: true
  semantic: A[m,k] element stream.
  reset_value: '0'
- name: b_valid
  direction: input
  width: '1'
  signed: false
  semantic: B operand stream valid.
  reset_value: '0'
- name: b_ready
  direction: output
  width: '1'
  signed: false
  semantic: B operand stream ready.
  reset_value: '0'
- name: b_data
  direction: input
  width: '8'
  signed: true
  semantic: B[k,n] element stream.
  reset_value: '0'
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: Output stream valid.
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: Output stream ready.
  reset_value: '0'
- name: out_data
  direction: output
  width: '32'
  signed: true
  semantic: Y[m,n] output value.
  reset_value: '0'
- name: out_m
  direction: output
  width: $clog2(M_MAX)
  signed: false
  semantic: Output row index m for out_data.
  reset_value: '0'
- name: out_n
  direction: output
  width: $clog2(N_MAX)
  signed: false
  semantic: Output column index n for out_data.
  reset_value: '0'
- name: job_done
  direction: output
  width: '1'
  signed: false
  semantic: Pulse when all MxN outputs for accepted job have transferred.
  reset_value: '0'
handshake:
  transfer_condition: A transfer occurs iff valid && ready on that channel in the
    same cycle.
  stall_behavior: When receiver deasserts ready, sender must hold valid asserted (if
    data pending) and keep payload stable until transfer.
  backpressure_supported: true
  ordering: In-order per stream; no reordering allowed for cfg, bias, A, B, or output
    channels.
