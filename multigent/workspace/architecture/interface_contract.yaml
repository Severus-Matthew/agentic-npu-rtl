protocol: ready_valid_streaming_with_control
clock: single clk
reset: rst_n synchronous active-low
channels:
- name: cmd
  direction: input
  purpose: Start operation and provide M,N,K
  framing: Single beat per job
  ordering: In program order
  backpressure: cmd_ready/cmd_valid handshake
- name: bias_in
  direction: input
  purpose: Bias vector elements
  framing: N beats per job
  ordering: Index 0..N-1
  backpressure: bias_ready/bias_valid handshake
- name: a_in
  direction: input
  purpose: Matrix A elements
  framing: M*K beats per job
  ordering: Row-major A[m][k]
  backpressure: a_ready/a_valid handshake
- name: b_in
  direction: input
  purpose: Matrix B elements
  framing: K*N beats per job
  ordering: Row-major over k then n for B[k][n]
  backpressure: b_ready/b_valid handshake
- name: y_out
  direction: output
  purpose: Output matrix elements
  framing: M*N beats per job
  ordering: Row-major Y[m][n]
  backpressure: y_ready/y_valid handshake
- name: status
  direction: output
  purpose: Done/error reporting
  framing: Level signals
  ordering: N/A
  backpressure: None
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: clock
  reset_value: '0'
- name: rst_n
  direction: input
  width: '1'
  signed: false
  semantic: synchronous active-low reset
  reset_value: '0'
- name: cmd_valid
  direction: input
  width: '1'
  signed: false
  semantic: command valid
  reset_value: '0'
- name: cmd_ready
  direction: output
  width: '1'
  signed: false
  semantic: command ready
  reset_value: '1'
- name: cmd_m
  direction: input
  width: '7'
  signed: false
  semantic: runtime M (1..MAX_M)
  reset_value: '0'
- name: cmd_n
  direction: input
  width: '7'
  signed: false
  semantic: runtime N (1..MAX_N)
  reset_value: '0'
- name: cmd_k
  direction: input
  width: '7'
  signed: false
  semantic: runtime K (1..MAX_K)
  reset_value: '0'
- name: bias_valid
  direction: input
  width: '1'
  signed: false
  semantic: bias data valid
  reset_value: '0'
- name: bias_ready
  direction: output
  width: '1'
  signed: false
  semantic: bias data ready
  reset_value: '0'
- name: bias_data
  direction: input
  width: '32'
  signed: true
  semantic: bias element
  reset_value: '0'
- name: a_valid
  direction: input
  width: '1'
  signed: false
  semantic: A data valid
  reset_value: '0'
- name: a_ready
  direction: output
  width: '1'
  signed: false
  semantic: A data ready
  reset_value: '0'
- name: a_data
  direction: input
  width: '8'
  signed: true
  semantic: A element
  reset_value: '0'
- name: b_valid
  direction: input
  width: '1'
  signed: false
  semantic: B data valid
  reset_value: '0'
- name: b_ready
  direction: output
  width: '1'
  signed: false
  semantic: B data ready
  reset_value: '0'
- name: b_data
  direction: input
  width: '8'
  signed: true
  semantic: B element
  reset_value: '0'
- name: y_valid
  direction: output
  width: '1'
  signed: false
  semantic: Y data valid
  reset_value: '0'
- name: y_ready
  direction: input
  width: '1'
  signed: false
  semantic: Y data ready
  reset_value: '0'
- name: y_data
  direction: output
  width: '32'
  signed: true
  semantic: Y element
  reset_value: '0'
- name: status_done
  direction: output
  width: '1'
  signed: false
  semantic: Pulses high for one cycle when job completes
  reset_value: '0'
- name: status_error
  direction: output
  width: '1'
  signed: false
  semantic: High when illegal command detected
  reset_value: '0'
global_handshake_rules:
  transfer_condition: A transfer occurs iff ready && valid on that channel.
  stall_behavior: While valid=1 and ready=0, payload and sideband remain stable.
