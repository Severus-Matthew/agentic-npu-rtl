protocol: ready_valid_streaming
clock: clk
reset: rst_n (active low, synchronous)
channels:
- name: cmd_ch
  direction: input
  purpose: Job descriptor
  data_objects:
  - obj_cmd
  metadata: []
  framing: Single-beat command packet.
  ordering: Must precede data channels for a job.
  backpressure: cmd_ready/cmd_valid handshake.
- name: a_ch
  direction: input
  purpose: A matrix payload
  data_objects:
  - obj_a_stream
  metadata: []
  framing: Scalar int8 per transfer; exactly M*K transfers/job.
  ordering: Row-major A[m][k], m outer k inner.
  backpressure: a_ready/a_valid handshake.
- name: b_ch
  direction: input
  purpose: B matrix payload
  data_objects:
  - obj_b_stream
  metadata: []
  framing: Scalar int8 per transfer; exactly K*N transfers/job.
  ordering: Row-major B[k][n], k outer n inner.
  backpressure: b_ready/b_valid handshake.
- name: bias_ch
  direction: input
  purpose: Bias payload
  data_objects:
  - obj_bias_stream
  metadata: []
  framing: Scalar int32 per transfer; exactly N transfers if bias_enable=1 else 0.
  ordering: Increasing n index.
  backpressure: bias_ready/bias_valid handshake.
- name: out_ch
  direction: output
  purpose: Output matrix payload
  data_objects:
  - obj_out_stream
  metadata: []
  framing: Scalar int32 per transfer; exactly M*N transfers/job.
  ordering: Row-major Y[m][n], m outer n inner.
  backpressure: out_ready/out_valid handshake.
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: Clock
  reset_value: '0'
- name: rst_n
  direction: input
  width: '1'
  signed: false
  semantic: Active-low synchronous reset
  reset_value: '0'
- name: cmd_valid
  direction: input
  width: '1'
  signed: false
  semantic: Command valid
  reset_value: '0'
- name: cmd_ready
  direction: output
  width: '1'
  signed: false
  semantic: Command ready
  reset_value: '1'
- name: cmd_data
  direction: input
  width: '96'
  signed: false
  semantic: '[15:0]M,[31:16]N,[47:32]K,[48]bias_enable,[95:49]reserved=0'
  reset_value: '0'
- name: a_valid
  direction: input
  width: '1'
  signed: false
  semantic: A stream valid
  reset_value: '0'
- name: a_ready
  direction: output
  width: '1'
  signed: false
  semantic: A stream ready
  reset_value: '0'
- name: a_data
  direction: input
  width: '8'
  signed: true
  semantic: Signed int8 A element
  reset_value: '0'
- name: b_valid
  direction: input
  width: '1'
  signed: false
  semantic: B stream valid
  reset_value: '0'
- name: b_ready
  direction: output
  width: '1'
  signed: false
  semantic: B stream ready
  reset_value: '0'
- name: b_data
  direction: input
  width: '8'
  signed: true
  semantic: Signed int8 B element
  reset_value: '0'
- name: bias_valid
  direction: input
  width: '1'
  signed: false
  semantic: Bias stream valid
  reset_value: '0'
- name: bias_ready
  direction: output
  width: '1'
  signed: false
  semantic: Bias stream ready
  reset_value: '0'
- name: bias_data
  direction: input
  width: '32'
  signed: true
  semantic: Signed int32 bias element
  reset_value: '0'
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: Output valid
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: Output ready
  reset_value: '0'
- name: out_data
  direction: output
  width: '32'
  signed: true
  semantic: Signed int32 output element
  reset_value: '0'
- name: status_done
  direction: output
  width: '1'
  signed: false
  semantic: Pulses high for one cycle when job completes
  reset_value: '0'
- name: status_error
  direction: output
  width: '1'
  signed: false
  semantic: Sticky high on protocol/legality error until reset
  reset_value: '0'
global_handshake_rules:
  transfer_condition: A channel transfer occurs iff corresponding valid && ready are
    both 1 on rising clock.
  stall_behavior: While valid=1 and ready=0, payload must remain stable; receiver
    state and counters must not advance.
