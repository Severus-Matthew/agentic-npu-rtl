protocol: AXI-stream-like ready/valid channels with sideband section identifiers
clock: clk
reset: rst_n (active low synchronous)
channels:
- name: cmd_chan
  direction: input
  purpose: job descriptor
  data_objects:
  - obj_cmd
  metadata: []
  framing: single transfer per job
  ordering: must arrive before any data payload
  backpressure: supported via cmd_ready
- name: in_data_chan
  direction: input
  purpose: serialized A/B/bias payload ingress
  data_objects:
  - obj_a_stream
  - obj_b_stream
  - obj_bias_stream
  metadata:
  - in_section[1:0]
  - in_last
  framing: A section exactly M*K transfers, then B section exactly K*N transfers,
    then optional bias section exactly N transfers
  ordering: strict section order A->B->bias(if enabled), each row-major
  backpressure: supported via in_ready
- name: out_data_chan
  direction: output
  purpose: C payload egress
  data_objects:
  - obj_c_stream
  metadata:
  - out_last
  framing: exactly M*N transfers
  ordering: row-major C
  backpressure: supported via out_ready
- name: status_chan
  direction: output
  purpose: job completion or error code
  data_objects:
  - obj_status
  metadata: []
  framing: single transfer after successful out_data completion or immediately on
    error
  ordering: one status per job
  backpressure: supported via status_ready
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: clock
  reset_value: '0'
- name: rst_n
  direction: input
  width: '1'
  signed: false
  semantic: active-low synchronous reset
  reset_value: '0'
- name: cmd_valid
  direction: input
  width: '1'
  signed: false
  semantic: command valid
  reset_value: '0'
- name: cmd_ready
  direction: output
  width: '1'
  signed: false
  semantic: command ready
  reset_value: '0'
- name: cmd_data
  direction: input
  width: CMD_WIDTH
  signed: false
  semantic: 'command bitfields: [15:0]M,[31:16]N,[47:32]K,[48]bias_enable,[49]relu_enable,others
    reserved 0'
  reset_value: '0'
- name: in_valid
  direction: input
  width: '1'
  signed: false
  semantic: input payload valid
  reset_value: '0'
- name: in_ready
  direction: output
  width: '1'
  signed: false
  semantic: input payload ready
  reset_value: '0'
- name: in_data
  direction: input
  width: '32'
  signed: false
  semantic: payload; int8 uses bits[7:0] sign-interpreted, int32 uses bits[31:0]
  reset_value: '0'
- name: in_section
  direction: input
  width: '2'
  signed: false
  semantic: 00=A,01=B,10=bias
  reset_value: '0'
- name: in_last
  direction: input
  width: '1'
  signed: false
  semantic: last beat of current section
  reset_value: '0'
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: output payload valid
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: output payload ready
  reset_value: '0'
- name: out_data
  direction: output
  width: '32'
  signed: true
  semantic: C int32 element
  reset_value: '0'
- name: out_last
  direction: output
  width: '1'
  signed: false
  semantic: last C element of job
  reset_value: '0'
- name: status_valid
  direction: output
  width: '1'
  signed: false
  semantic: status valid
  reset_value: '0'
- name: status_ready
  direction: input
  width: '1'
  signed: false
  semantic: status ready
  reset_value: '0'
- name: status_data
  direction: output
  width: STATUS_WIDTH
  signed: false
  semantic: status[7:0] code (0=OK,1=BAD_DIM,2=BAD_SECTION,3=EARLY_LAST,4=PROTOCOL),
    status[31:8]=0
  reset_value: '0'
global_handshake_rules:
  transfer_condition: A channel transfer occurs iff ready && valid on that channel.
  stall_behavior: Producer must hold payload/metadata stable while valid=1 and ready=0.
