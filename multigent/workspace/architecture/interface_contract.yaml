protocol: AXI-stream-like ready/valid discrete channels
clock: single rising-edge clock
reset: active-low synchronous reset
channels:
- name: cmd
  direction: input
  purpose: job configuration
  data_objects:
  - cfg_cmd
  metadata:
  - cmd_valid
  - cmd_ready
  framing: single beat per job; bits[15:0]=M bits[31:16]=N bits[47:32]=K
  ordering: one command only accepted in IDLE
  backpressure: supported via cmd_ready
- name: a_in
  direction: input
  purpose: A operand stream
  data_objects:
  - tensor_a
  metadata:
  - a_valid
  - a_ready
  framing: one int8 element per beat in bits[7:0]
  ordering: 'for each tile_m, tile_n, and each k: send rows r=0..TILE_M-1 for global
    row m=tile_m*TILE_M+r when m<M; skip invalid edge rows'
  backpressure: supported
- name: b_in
  direction: input
  purpose: B operand stream
  data_objects:
  - tensor_b
  metadata:
  - b_valid
  - b_ready
  framing: one int8 element per beat in bits[7:0]
  ordering: 'for each tile_m, tile_n, and each k: send cols c=0..TILE_N-1 for global
    col n=tile_n*TILE_N+c when n<N; skip invalid edge cols'
  backpressure: supported
- name: bias_in
  direction: input
  purpose: bias vector stream
  data_objects:
  - bias_vec
  metadata:
  - bias_valid
  - bias_ready
  framing: one int32 element per beat bits[31:0]
  ordering: n=0..N-1 exactly once after command and before compute
  backpressure: supported
- name: out
  direction: output
  purpose: final result stream
  data_objects:
  - output_tensor
  metadata:
  - out_valid
  - out_ready
  - out_last
  - out_user_err
  framing: one int32 per beat bits[31:0]; out_last asserted on final element of job
  ordering: tile-major deterministic order matching architecture invariant
  backpressure: supported
- name: status
  direction: output
  purpose: job completion
  data_objects: []
  metadata:
  - done_valid
  - done_ready
  - done_error
  framing: single beat at job end
  ordering: exactly one status beat per accepted command
  backpressure: supported
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: system clock
  reset_value: '0'
- name: rst_n
  direction: input
  width: '1'
  signed: false
  semantic: active-low synchronous reset
  reset_value: '0'
- name: cmd_valid
  direction: input
  width: '1'
  signed: false
  semantic: command valid
  reset_value: '0'
- name: cmd_ready
  direction: output
  width: '1'
  signed: false
  semantic: command ready
  reset_value: '0'
- name: cmd_data
  direction: input
  width: CMD_W
  signed: false
  semantic: packed M,N,K
  reset_value: '0'
- name: a_valid
  direction: input
  width: '1'
  signed: false
  semantic: A beat valid
  reset_value: '0'
- name: a_ready
  direction: output
  width: '1'
  signed: false
  semantic: A beat ready
  reset_value: '0'
- name: a_data
  direction: input
  width: A_W
  signed: true
  semantic: A element
  reset_value: '0'
- name: b_valid
  direction: input
  width: '1'
  signed: false
  semantic: B beat valid
  reset_value: '0'
- name: b_ready
  direction: output
  width: '1'
  signed: false
  semantic: B beat ready
  reset_value: '0'
- name: b_data
  direction: input
  width: B_W
  signed: true
  semantic: B element
  reset_value: '0'
- name: bias_valid
  direction: input
  width: '1'
  signed: false
  semantic: bias beat valid
  reset_value: '0'
- name: bias_ready
  direction: output
  width: '1'
  signed: false
  semantic: bias beat ready
  reset_value: '0'
- name: bias_data
  direction: input
  width: BIAS_W
  signed: true
  semantic: bias element
  reset_value: '0'
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: output valid
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: output ready
  reset_value: '0'
- name: out_data
  direction: output
  width: OUT_W
  signed: true
  semantic: output element
  reset_value: '0'
- name: out_last
  direction: output
  width: '1'
  signed: false
  semantic: final output beat marker
  reset_value: '0'
- name: out_user_err
  direction: output
  width: '1'
  signed: false
  semantic: error marker (1 if job failed)
  reset_value: '0'
- name: done_valid
  direction: output
  width: '1'
  signed: false
  semantic: status valid
  reset_value: '0'
- name: done_ready
  direction: input
  width: '1'
  signed: false
  semantic: status ready
  reset_value: '0'
- name: done_error
  direction: output
  width: '1'
  signed: false
  semantic: status error flag
  reset_value: '0'
global_handshake_rules:
  transfer_condition: A channel transfer occurs iff ready && valid on same cycle.
  stall_behavior: While valid=1 and ready=0, payload and sideband metadata must remain
    stable until transfer.
