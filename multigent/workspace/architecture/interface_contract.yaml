protocol: ready_valid_stream_with_packet_tags
clock: single rising-edge clock domain
reset: synchronous active-low rst_n
channels:
- name: cmd_data_in
  direction: input
  purpose: Carries config and operand payloads.
  data_objects:
  - obj_dims
  - obj_bias_vector
  - obj_a_matrix
  - obj_b_matrix
  metadata:
  - section_id[1:0]
  - last
  framing: 'Packetized sections in strict order: config(1 beat) -> bias(dim_n beats)
    -> repeated A/B compute payload beats.'
  ordering: In-order; no interleaving between jobs.
  backpressure: Source obeys in_ready; transfer only on in_valid&&in_ready.
- name: result_out
  direction: output
  purpose: Carries output matrix elements.
  data_objects:
  - obj_out_matrix
  metadata:
  - last
  framing: dim_m*dim_n beats per job, last asserted on final beat.
  ordering: Row-major (m outer, n inner).
  backpressure: Sink drives out_ready; module holds stable payload when stalled.
- name: status
  direction: output
  purpose: Reports busy/done/error state.
  data_objects: []
  metadata: []
  framing: Level signals.
  ordering: Not applicable.
  backpressure: Not applicable.
signals:
- name: clk
  direction: input
  width: '1'
  signed: false
  semantic: Primary clock
  reset_value: '0'
- name: rst_n
  direction: input
  width: '1'
  signed: false
  semantic: Active-low synchronous reset
  reset_value: '0'
- name: in_valid
  direction: input
  width: '1'
  signed: false
  semantic: Input payload valid
  reset_value: '0'
- name: in_ready
  direction: output
  width: '1'
  signed: false
  semantic: Input payload ready
  reset_value: '0'
- name: in_data
  direction: input
  width: '32'
  signed: false
  semantic: Input payload word; int8/int32 fields packed by section format
  reset_value: '0'
- name: in_section
  direction: input
  width: '2'
  signed: false
  semantic: 00=config,01=bias,10=A,11=B
  reset_value: '0'
- name: in_last
  direction: input
  width: '1'
  signed: false
  semantic: Last beat of current logical section
  reset_value: '0'
- name: out_valid
  direction: output
  width: '1'
  signed: false
  semantic: Output payload valid
  reset_value: '0'
- name: out_ready
  direction: input
  width: '1'
  signed: false
  semantic: Output payload ready
  reset_value: '0'
- name: out_data
  direction: output
  width: ACC_W
  signed: true
  semantic: Output int32 element
  reset_value: '0'
- name: out_last
  direction: output
  width: '1'
  signed: false
  semantic: Last output beat of job
  reset_value: '0'
- name: busy
  direction: output
  width: '1'
  signed: false
  semantic: Job in progress
  reset_value: '0'
- name: done
  direction: output
  width: '1'
  signed: false
  semantic: Single-cycle pulse when job completes
  reset_value: '0'
- name: error
  direction: output
  width: '1'
  signed: false
  semantic: Latched protocol/config error until reset
  reset_value: '0'
global_handshake_rules:
  transfer_condition: A channel transfer occurs iff ready && valid.
  stall_behavior: While valid=1 and ready=0, payload and metadata remain stable; internal
    state tied to that channel transfer does not advance.
