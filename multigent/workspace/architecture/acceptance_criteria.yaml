functional:
- For each legal M,N,K, output C equals int32(ReLU((A*B)+bias)) per command enables,
  exact integer semantics.
- When bias_enable=0, bias input section is not required and bias term treated as
  zero.
- When relu_enable=0, negative outputs are preserved.
verification:
- Minimum 100 randomized jobs across legal bounds with software golden model comparison.
- 'Directed boundary tests: M/N/K at 1 and at MAX_M/MAX_N/MAX_K, plus N not divisible
  by LANES_N.'
- 'Reset tests required: reset during IDLE and mid-job; post-reset first job must
  execute correctly.'
- Backpressure tests required on in_data, out_data, and status channels with random
  ready deassertions.
- 'Protocol violation tests: bad dimensions, wrong section order, early/late in_last;
  must emit nonzero status code.'
rtl:
- 'RTL must be synthesizable SystemVerilog and avoid forbidden constructs: real, shortreal,
  delay statements, force/release, classes.'
- All sequential logic uses clk and synchronous active-low reset behavior per contract.
- No undefined-width signals; parameterized widths remain legal for all legal parameter
  values.
synopsys_handoff:
- Synthesis/timing/power/area/frequency/utilization claims accepted only from deterministic
  Synopsys tool reports.
- Reported metrics must conform to multigent/schemas/synthesis_result.schema.json.
- No estimated or inferred PPA numbers are permitted without authoritative reports.
