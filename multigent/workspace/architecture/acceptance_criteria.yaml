functional:
- For all legal M,N,K within bounds, output[m,n]=max(0, sum_k(A[m,k]*B[k,n]) + bias[n])
  with exact integer match.
- Command with any of M,N,K=0 or >MAX bound sets error=1 and no output transfers occur
  for that job.
- Output transfer count is exactly M*N for legal jobs.
verification:
- Minimum 100 randomized legal transactions spanning varied M,N,K and signed operand
  ranges.
- Directed boundary tests at M,N,K = 1 and = MAX_* values.
- 'Reset test: asserting rst_n low returns FSM/handshake/status to defined reset state.'
- 'Backpressure test: random out_ready deassertion must not lose/duplicate/reorder
  outputs; out_data stable while stalled.'
rtl:
- SystemVerilog synthesizable subset only; no real/shortreal, delay statements, force/release,
  or classes.
- All state transitions clocked; no combinational loops; no undefined latches.
- Ready/valid protocol implemented exactly with transfer on ready&&valid.
synopsys_handoff:
- Synthesis/timing/power/area metrics accepted only from deterministic Synopsys tool
  reports conforming to multigent/schemas/synthesis_result.schema.json.
- No estimated or inferred PPA metrics are allowed in signoff artifacts.
- RTL must be functionally verified before Synopsys handoff per project policy.
