functional:
- For every legal M,N,K and inputs A,B,bias, output stream equals software reference
  ReLU((A*B)+bias) with signed int32 wrap arithmetic.
- 'Bias index is column-wise: bias[n] added to all rows m for fixed n.'
- Edge tiles (when M or N not divisible by tile sizes) produce only legal indices
  with no extra outputs.
verification:
- Minimum 100 randomized legal transactions across varying M,N,K including boundary
  values 1 and MAX_*.
- 'Reset test required: asserting/deasserting rst_n returns interface/control to required
  reset state before next command.'
- Backpressure tests required on all ready/valid inputs and outputs with random stalls;
  no data loss/duplication.
- 'Protocol-negative tests: illegal dimensions (0 or >max) must produce done_error=1
  and no output data.'
rtl:
- SystemVerilog synthesizable subset only; no real/shortreal/delay/force-release/classes.
- No combinational loops; sequential state updates on clk edge with synchronous active-low
  reset behavior as specified.
- Payload stability under stall must be provable by assertions on each valid/ready
  channel.
synopsys_handoff:
- Synthesis/timing/power/area/frequency/utilization claims accepted only from deterministic
  Synopsys tool reports conforming to multigent/schemas/synthesis_result.schema.json.
- No estimated or inferred PPA metrics allowed without authoritative deterministic
  report.
- Handoff requires verified RTL passing functional and protocol acceptance criteria
  prior to Synopsys runs.
