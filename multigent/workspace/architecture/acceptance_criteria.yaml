functional:
- For any legal M,N,K and inputs, output Y equals ReLU(AxB + Bias) with exact integer
  arithmetic and two's-complement wrap in int32 accumulation/add.
- Output sequence is exactly row-major over m then n.
- Bias is applied per output column n to every row m.
verification:
- Minimum 100 randomized legal transactions across varied M,N,K including boundary
  cases 1 and 64.
- Reset tests verify deterministic return to IDLE, cleared valids/status_done low/status_error
  low.
- Backpressure tests on all ready/valid channels verify no loss/duplication and stable
  payload under stall.
- Directed tests for illegal cmd values (0 or >max) verify status_error behavior and
  no output emission.
rtl:
- 'RTL is SystemVerilog synthesizable-only and excludes forbidden constructs: real,
  shortreal, delay statements, force/release, classes.'
- No combinational ready/valid loops causing non-synthesizable behavior.
- All counters and index widths support configured bounds without overflow in addressing/control.
synopsys_handoff:
- Provide deterministic Synopsys synthesis report conforming to multigent/schemas/synthesis_result.schema.json.
- Report generation only after verification pass; no estimated or inferred metrics
  accepted.
- All reported PPA/timing/utilization values must come from authoritative deterministic
  tool report.
