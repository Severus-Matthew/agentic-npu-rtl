top_module: gemm_bias_relu_npu_top
test_modules:
- test_gemm_bias_relu
test_categories:
- functional
- protocol
- reset
- backpressure
- error
- randomized
randomized_test_count: 100
seed: 12345
timeout_seconds: 180
regression_groups:
  smoke:
  - test_gemm_bias_relu
  targeted:
  - test_gemm_bias_relu
  full:
  - test_gemm_bias_relu
pass_criteria: 'All cocotb tests pass: exact ordered output stream equality to independent
  reference, correct transfer counts/order, reset/error/completion-visible behavior
  per contract, and no timeout/deadlock.'
protocol_assumptions:
- Transfers occur only on valid&&ready per channel.
- While valid=1 and ready=0, producer keeps payload stable.
- Input ordering is contract-defined row-major for A/B and increasing n for bias.
- One job in flight; next command only after DUT ready.
