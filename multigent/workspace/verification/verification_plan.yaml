test_categories:
- functional
- boundary
- reset
- backpressure
- randomized
randomized_test_count: 100
seed: 12345
timeout_seconds: 2
regression_groups:
  smoke:
  - test_gemm_bias_relu_npu
  targeted:
  - test_gemm_bias_relu_npu
  full:
  - test_gemm_bias_relu_npu
pass_criteria: All tests compile and run; ordered out_ch stream matches reference
  exactly for each job; required reset/backpressure/randomized coverage satisfied;
