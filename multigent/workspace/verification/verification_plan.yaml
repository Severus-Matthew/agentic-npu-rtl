protocol_assumptions:
- All channel transfers occur only on valid&&ready at clk rising edge.
- Input source drivers hold valid=1 and payload stable until handshake once a beat
  is presented.
- cmd_data reserved bits are required 0 for legal commands.
- When bias_enable=0, legal jobs send zero bias transfers.
- status_done is a one-cycle completion pulse; status_error is sticky until reset
  as contract-defined.
